# The full-suite campaign of 2026-10-29. C1's `qa/suite.toml`, checked by
# `zakura-sim suite`, defines the suite's targets. This file adds only what
# the campaign decides: the integration it runs, each target's workers,
# shard and per-input timeout, and each segment's search budget.
# `../launch.py` refuses a target set that differs from C1's manifest.

schema = 2
name = "full-suite-20261029"
status = "incomplete"
campaign_plan = "https://valargroup.getoutline.com/doc/campaignmd-full-property-suite-execution-and-fuzz-campaigns-pVoq6yEw5j"
artifacts_root = "/srv/zakura-fuzz/campaigns/full-suite-20261029"
# The campaign host's vCPUs. No shard's workers may exceed them.
cpus = 8

# The PR heads merged into the campaign branch. `launch.py` checks that each
# is an ancestor of the checkout.
[integration]
base = "4eab091b605ff7adab9f37515195d58f1362633c"
pull_1824 = "476415833998f2c17a5cb83558674306a52bc8d6"
pull_1825 = "93c80ecad678f894120ac08fd2da4f9616765358"
pull_1826 = "583f3f8fdaa4f1b2de7c85cc2979097985f5e866"
pull_1830 = "3a99a568551191a17794e9d2af47f9e4ac221db1"
pull_1831 = "26111ae5fe42e8ddefe3d10167327f60b44a184a"
pull_1832 = "1d84808bcba8d398dd90db57a80e093c6aed91fa"
pull_1833 = "f3a60bb1c0e33021ea94a50b37242c531c908551"
pull_1837 = "0dfcf619efb0dbd08ccbacd50bdc512446b1d718"

# `launch.py` checks `fuzz`, `trace` and `contract` against the frozen suite
# manifest.
[toolchain]
rust = "1.98.0"
fuzz = "nightly-2026-07-15"
sanitizer = "address"

[formats]
trace = 21
contract = 1
feedback_backend = "libfuzzer-extra-counters"
feedback = 1

# Each segment gives every target its own search budget, passed to
# libFuzzer as `-max_total_time`. The calibration and pilot budgets follow
# campaign.md; a revision of this file sets the extended budget from the
# pilot's measured cost before the extended segment starts.
[[segment]]
name = "calibration"
budget-secs = 900

[[segment]]
name = "pilot"
budget-secs = 3600

[[segment]]
name = "extended"
budget-secs = 43200

# One row per target of C1's manifest, by its ID. A shard's targets run
# together; shards run one after another, so each shard may use every vCPU.
# `input-timeout-secs` is libFuzzer's per-input `-timeout`.
[[target]]
id = "target/sim/block_sync_storage"
shard = "sim"
workers = 3
input-timeout-secs = 600

[[target]]
id = "target/sim/header_sync_wire"
shard = "sim"
workers = 2
input-timeout-secs = 180

[[target]]
id = "target/sim/header_sync_storage"
shard = "sim"
workers = 1
input-timeout-secs = 120

[[target]]
id = "target/sim/discovery_wait_complete"
shard = "sim"
workers = 1
input-timeout-secs = 60

[[target]]
id = "target/sim/race_fixtures"
shard = "sim"
workers = 1
input-timeout-secs = 60

[[target]]
id = "target/header-chain/fork_transitions"
shard = "header-chain"
workers = 2
input-timeout-secs = 120

[[target]]
id = "target/header-chain/header_codec_v9"
shard = "header-chain"
workers = 2
input-timeout-secs = 120

[[target]]
id = "target/header-chain/header_pursuit"
shard = "header-chain"
workers = 2
input-timeout-secs = 120

[[target]]
id = "target/header-chain/recovery_rows"
shard = "header-chain"
workers = 2
input-timeout-secs = 300
