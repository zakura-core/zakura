# Zakura cargo configuration

[alias]
xtask = "run --package xtask --"

[build]
rustdocflags = [
    # Keep shared rustdoc lint levels synchronized with the book and lint
    # workflows.

    # Links in public docs can point to private items.
    "-Arustdoc::private_intra_doc_links",
]

[env]
RUST_BACKTRACE="1"
# Build RocksDB's rarely run sources for size; see scripts/rocksdb/cxx.sh.
CXX_x86_64_unknown_linux_gnu = { value = "scripts/rocksdb/cxx.sh", relative = true }
CXX_aarch64_unknown_linux_gnu = { value = "scripts/rocksdb/cxx.sh", relative = true }

[profile.profiling]
inherits = "release"
debug = true
