name: Docs Check

on:
  push:
    branches: [main]
    paths:
      - scripts/pyproject.toml
      - scripts/uv.lock
      - .github/actions/setup-python/**
      - "**.md"
      - ".github/lychee.toml"
      - ".github/actions/install-lychee/**"
      - ".github/codespellrc"
      - ".github/.markdownlint.yaml"
      - ".github/workflows/docs-check.yml"
  pull_request:
    paths:
      - scripts/pyproject.toml
      - scripts/uv.lock
      - .github/actions/setup-python/**
      - "**.md"
      - ".github/lychee.toml"
      - ".github/actions/install-lychee/**"
      - ".github/codespellrc"
      - ".github/.markdownlint.yaml"
      - ".github/workflows/docs-check.yml"

# Ensures that only one workflow task will run at a time. Previous builds, if
# already in process, will get cancelled. Only the latest commit will be allowed
# to run, cancelling any workflows in between
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  link-check:
    name: link-check
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - name: Install lychee
        uses: ./.github/actions/install-lychee

      # External links are checked daily by `external-links.yml`, so an outage
      # on a site we link to can't fail a push or pull request.
      - name: Check links between repository files
        run: |
          lychee \
            --offline \
            --verbose \
            --no-progress \
            --config .github/lychee.toml \
            "**/*.md"

  spell-check:
    name: spell-check
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - name: Install locked documentation tools
        uses: ./.github/actions/setup-python
        with:
          group: docs

      - name: Run codespell
        run: codespell --config .github/codespellrc

  markdown-lint:
    name: markdown-lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 #v7.1.0
        with:
          node-version: "22"

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli # zizmor: ignore[adhoc-packages] -- markdown linter only; repo has no npm lockfile to install from, and the job is read-only with no credentials persisted

      - name: Run markdownlint
        run: |
          markdownlint "**/*.md" \
            --ignore node_modules \
            --ignore target \
            --ignore .git \
            --config .github/.markdownlint.yaml

  docs-check-success:
    name: docs check success
    runs-on: ubuntu-latest
    # Skip, rather than fail, when a superseding run cancelled this one.
    # See "Cancelled runs" in .github/workflows/README.md.
    if: ${{ !cancelled() || github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    needs:
      - link-check
      - spell-check
      - markdown-lint
    timeout-minutes: 5
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 #v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
