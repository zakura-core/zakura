# A stale prepare's handler moves a header of its peer's current round's
# reservation into owned capacity. The input's prepare ends after its round
# retired, while the same peer's next round holds a reservation, so the
# handler charges that round's work.
# Besides reactor.rs, which the patch changes, the queue and the subscriber
# decide when a round retires mid-prepare and whether a grant is due. A
# change there can move the input off its stale prepare.
# The input is the stale-prepare seed less its last control step, a close
# on a dropped read that never runs: the same run, with every step it
# declares carried out.
# Past the stop, the charged round outgrows its bound, so
# `header-sync/outstanding-work-bounded` breaks too, but only later, and the
# case's set is judged on its Draft run (`draft_set`).
draft_set = ["header-sync/outstanding-work-bounded"]
input = "crates/zakura-sim/tests/fixtures/header-storage-stale-prepare-steps.bin"
checks = ["crates/zakura-network/src/zakura/header_sync"]
