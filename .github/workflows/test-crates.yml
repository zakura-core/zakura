name: Test Crate Build

on:
  # No `paths:` filter on pull_request: the workflow triggers on every PR and the
  # `changes` job below gates the heavy build so it still skips on PRs that touch
  # no crate-relevant files. This keeps the `test crate build success` required
  # check reporting on every PR instead of sitting in "Expected" forever.
  pull_request:
    branches: [main, "feat/**", "release/**"]
    # Allows maintainers to trigger checks on an unchanged PR head when
    # backfilling newly required status contexts.
    types: [opened, synchronize, reopened, labeled]

  push:
    branches: [main, "feat/**", "release/**"]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      # Include non-Rust inputs compiled or exercised by workspace crates.
      - crates/**
      - .cargo/config.toml
      - .github/actions/setup-zakura-build/**
      - .github/workflows/test-crates.yml

  # Run the full crate-build suite when a PR is queued so the merge queue
  # validates the merged result against the latest `main`. `merge_group` ignores
  # path filters, so this runs unconditionally on every queued entry.
  merge_group:

  workflow_dispatch:

# Ensures that only one workflow task will run at a time. Previous builds, if
# already in process, will get cancelled. Only the latest commit will be allowed
# to run, cancelling any workflows in between
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_LIB_BACKTRACE: 1
  RUST_LOG: info
  COLORBT_SHOW_HIDDEN: 1

jobs:
  # Detect whether a pull request touches crate-build-relevant paths. Only
  # pull_request is path-gated here; push carries its own `paths:` filter and
  # merge_group / workflow_dispatch always run the full build.
  changes:
    name: detect crate-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      crates: ${{ steps.filter.outputs.crates }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TOTAL_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          # Non-PR events run the heavy job unconditionally (see its `if`), so the
          # filter result is only consumed on pull_request.
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "crates=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The PR files endpoint returns at most 3,000 files. Run the full build
          # when the count is missing or reaches that limit so a truncated
          # response cannot hide a crate-relevant path.
          if ! [[ "$TOTAL_CHANGED_FILES" =~ ^[0-9]+$ ]] || \
             (( TOTAL_CHANGED_FILES >= 3000 )); then
            echo "crates=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[] | .filename, (.previous_filename // empty)')

          if grep -qE '(^crates/|\.rs$|(^|/)Cargo\.(toml|lock)$|^\.cargo/config\.toml$|^\.github/actions/setup-zakura-build/|^\.github/workflows/test-crates\.yml$)' <<< "$changed"; then
            echo "crates=true" >> "$GITHUB_OUTPUT"
          else
            echo "crates=false" >> "$GITHUB_OUTPUT"
          fi

  # Verify every crate builds, both with its default features and with no
  # default features.
  #
  # This replaces the previous per-crate build matrix (each crate built 4 ways
  # with clippy + build, throttled to 4 parallel cold jobs) and the lint
  # `crate-checks` / `features` jobs with one `cargo hack` pass in a single warm
  # target dir. cargo-hack iterates every workspace crate, so this preserves the
  # matrix's unique guarantee — that each crate compiles with `--no-default-
  # features` — which the lint clippy (`default-release-binaries`) and
  # `check-cargo-lock` (`--all-features`) jobs do not cover. The all-targets /
  # all-features dimension stays covered by those lint jobs.
  #
  # NOTE: we intentionally do NOT use `--each-feature` here. It checks every
  # feature in isolation, which is stricter than anything this project gated on
  # before and surfaces pre-existing non-additive-feature issues (e.g.
  # zakura-chain's `async-error` not pulling in tokio's `rt` feature). Enforcing
  # that is a separate, deliberate effort, not part of this CI change.
  crate-checks:
    name: Build crates (default and no-default features)
    needs: changes
    # Run for pushes (own paths filter), the merge queue, and on demand; on a
    # pull request only when a crate-relevant path changed.
    if: needs.changes.outputs.crates == 'true' || github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 #v1.17.0
        with:
          toolchain: stable
          cache-key: crate-checks
          cache-on-failure: true
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 #v2.85.7
        with:
          tool: cargo-hack

      - uses: ./.github/actions/setup-zakura-build

      - name: Check every crate with default and no-default features
        run: |
          cargo hack check --workspace
          cargo hack check --workspace --no-default-features
        env:
          # Treat warnings as errors, preserving the old `features` job behavior.
          RUSTFLAGS: -D warnings

  test-crate-build-success:
    name: test crate build success
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - crate-checks
    timeout-minutes: 30
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe #v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
          # crate-checks is skipped on pull requests that touch no crate-relevant
          # paths; a genuine build failure still fails this aggregate.
          allowed-skips: crate-checks
