# After the subscriber checks a later page, the reactor stages it under the
# round's first ancestor instead of the page's own, the previous page's tip.
# The reactor, the subscriber and the queue decide how the witness's rounds
# start and stage, so a change there can move the witness off it.
checks = ["crates/zakura-network/src/zakura/header_sync"]

[typed]
harness = "header-sync/storage"
scenario = "crates/zakura-sim/tests/fixtures/header-authority-multi-page-sync.json"
plan = "crates/zakura-sim/tests/fixtures/header-authority-multi-page-sync.plan"
