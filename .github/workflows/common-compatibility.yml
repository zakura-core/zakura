name: Common compatibility

on:
  pull_request:
    paths:
      - '**/Cargo.toml'
      - Cargo.lock
      - crates/zakura-chain/**
      - crates/zakura-consensus/**
      - crates/zakura-rpc/**
      - qa/common-compatibility/**
      - .github/workflows/common-compatibility.yml
      - .github/actions/setup-zakura-build/**
  push:
    branches: [main]
    paths:
      - '**/Cargo.toml'
      - Cargo.lock
      - crates/zakura-chain/**
      - crates/zakura-consensus/**
      - crates/zakura-rpc/**
      - qa/common-compatibility/**
      - .github/workflows/common-compatibility.yml
      - .github/actions/setup-zakura-build/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: common-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  common-compatibility:
    name: common 2.0 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          cache: false
      - uses: ./.github/actions/setup-zakura-build
      - name: Apply the unreleased common snapshot only in this checkout
        run: |
          git apply --check qa/common-compatibility/dependencies.patch
          git apply qa/common-compatibility/dependencies.patch
          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/common-metadata.json"
          python3 qa/common-compatibility/check-graph.py Cargo.toml "$RUNNER_TEMP/common-metadata.json"
      - name: Check native hashes and V6 encoding against common
        run: |
          cargo test -p zakura-chain --profile ci-tests --locked --lib native_zip244_matches
          cargo test -p zakura-chain --profile ci-tests --locked --lib v6_
      - name: Check transparent and shielded coinbase construction
        run: |
          cargo test -p zakura-rpc --profile ci-tests --locked --lib coinbase
          cargo test -p zakura-rpc --profile ci-tests --locked --lib shielded_coinbase_paths -- --ignored
      - name: Check coinbase construction with the node NU7 feature
        run: |
          cargo test -p zakura-rpc --profile ci-tests --locked --features zakura-consensus/nu7 --lib coinbase
          cargo test -p zakura-rpc --profile ci-tests --locked --features zakura-consensus/nu7 --lib shielded_coinbase_paths -- --ignored
