# The committed fuzz input `block-sync-capacity-frontier-first.bin`: the
# harness that runs it, the generator version it was built for, and its
# SHA-256. Its first two bytes, `ff 08`, pick the capacity-release scenario.
# The rest is Plan bytes from the simulator tests' fuzz inputs:
# `regenerate_capacity_frontier_first_input` in block_semantic_properties.rs
# writes the first one whose run has block sync handle a detached commit's
# tip before its reply, so the reply frees room past the frontier beside a
# waiting body (#1523's order). Rerun it when a block-sync change moves the
# input off that order.
harness = "block-sync/storage"
generator = 2
sha256 = "ad8a54adb587b783132d3491c5cfe5078d8d5dd0ad41b0b9818c899a52599e79"
scenario_sha256 = "f18c98db3729e91291a7a4918d43080f61e6b6e58fdef71fea8c9bac1d51d968"
source = "crates/zakura-sim/tests/block_semantic_properties.rs"

[[witness]]
property = "block-sync/capacity-release-wakes"
expect = "holds"
