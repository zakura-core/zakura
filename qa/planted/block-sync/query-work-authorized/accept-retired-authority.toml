# Keeps the pending needed-block query across a body-work authority change,
# and accepts a reply under whatever authority it names. The input holds the
# node's first query in storage while the mirrors' fork reaches the node's
# header sync, so its reply reaches the reactor after the reactor adopted
# the fork's authority, and installs the old branch's work.
input = "crates/zakura-sim/tests/fixtures/sync-storage-retired-query.bin"
# Besides reactor/state.rs, which the patch changes, header sync's apply and
# the rest of block sync decide when the reply arrives.
checks = ["crates/zakura-network/src/zakura/block_sync", "crates/zakura-network/src/zakura/header_sync"]
