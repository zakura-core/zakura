[[audits.writeable]]
who = "OpenAI Codex <noreply@openai.com>"
criteria = "safe-to-deploy"
version = "0.6.3"
notes = "Reviewed all packaged source, manifests, tests, example, and benchmark. The crate formats caller-supplied values into caller-supplied fmt sinks using checked and saturating length hints; its unsafe UTF-8 conversions consume only an ASCII digit buffer or a prefix incrementally proven equal to valid str chunks. It has no build script, runtime I/O, or ambient capabilities, and the optional either dependency remains separately policy-checked. All 15 unit tests, 1 integration test, and 20 doctests passed with all features, and the no-allocation library target compiled. The published example omits its workspace-only instrumentation dependency and therefore prevents an unfiltered cargo test from compiling that example."

[[audits.z32]]
who = "OpenAI Codex <noreply@openai.com>"
criteria = "safe-to-deploy"
version = "1.3.0"
notes = "Reviewed all packaged source and manifest. The zero-dependency z-base-32 encoder and decoder use input-bounded loops. The sole unsafe String::from_utf8_unchecked is sound because every output byte is selected from a fixed ASCII alphabet. No build script, I/O, or ambient capabilities. All 6 unit tests and 2 doctests passed."

