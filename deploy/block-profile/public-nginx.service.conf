[Unit]
After=zakura-profile-web.service

[Service]
Slice=zakura-profile.slice
MemoryMax=128M
CPUQuota=25%
NoNewPrivileges=true
ProtectSystem=strict
ProtectHome=true
PrivateTmp=true
ReadWritePaths=/run /var/lib/nginx /var/log/nginx
InaccessiblePaths=/srv/zakura-profile /mnt/profile-chain /etc/zakura
RestrictAddressFamilies=AF_INET AF_UNIX
StandardError=journal
LogRateLimitIntervalSec=1min
LogRateLimitBurst=30
