# The subscription primitive stores the latest received page's cursor as
# accepted, though the reactor accepted only the pages through an earlier
# one, so the next update would acknowledge pages nothing validated. The
# reactor, the subscriber, the subscription primitive and the queue decide
# how the witness's rounds start, stage and are credited, so a change there
# can move the witness off it.
checks = ["crates/zakura-network/src/zakura/header_sync", "crates/zakura-network/src/zakura/regulation/subscription"]

[typed]
harness = "header-sync/storage"
scenario = "crates/zakura-sim/tests/fixtures/header-authority-multi-page-sync.json"
plan = "crates/zakura-sim/tests/fixtures/header-authority-multi-page-sync.plan"
