[package]
name = "xtask"
version = "0.1.0"
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"
test = false

[dependencies]
openrpsee.workspace = true
serde = { workspace = true, features = ["derive"] }
sha2.workspace = true
tempfile.workspace = true
toml.workspace = true
tonic-prost-build.workspace = true

zakura-chain = { path = "../zakura-chain", version = "9.0.0" }
zcash_protocol.workspace = true

# Intentional: this is a CLI tool that prints to stdout/stderr. Do not inherit
# the workspace clippy print_* / missing-docs deny set.
[lints]
