name: Verify checkpoint reproduction cleanup
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/do-cli
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Verify all eight task droplets and volumes are gone
        run: |
          python3 - <<'CHECK'
          import json
          import subprocess
          runs = [34622371374, 34622547541, 34622795998, 34622797917, 34623964556, 34624030205, 34626250212, 34626268029]
          leftovers = []
          for kind in ['droplet', 'volume']:
              rows = json.loads(subprocess.check_output(['doctl', 'compute', kind, 'list', '-o', 'json'], text=True))
              for row in rows:
                  name = row.get('name', '')
                  if any(name.endswith('-'+str(run)) or name == 'zakura-pr-vol-'+str(run)+'-nyc1' for run in runs):
                      leftovers.append({'kind': kind, 'id': row['id'], 'name': name})
          print(json.dumps({'task_runs': runs, 'remaining_resources': leftovers}, indent=2))
          assert not leftovers, 'task-owned test resources remain'
          CHECK
