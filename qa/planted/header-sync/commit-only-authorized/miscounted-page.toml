# The subscriber counts a page of several headers as one fewer, so it
# charges and records a cursor that the page's own entries don't sum to.
# The reactor, the subscriber and the queue decide how the witness's rounds
# start, stage and are credited, so a change there can move the witness off
# it.
checks = ["crates/zakura-network/src/zakura/header_sync"]

[typed]
harness = "header-sync/storage"
scenario = "crates/zakura-sim/tests/fixtures/header-authority-multi-page-sync.json"
plan = "crates/zakura-sim/tests/fixtures/header-authority-multi-page-sync.plan"
