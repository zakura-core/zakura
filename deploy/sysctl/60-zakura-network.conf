# Zakura node network defaults. The continuous-sync deployer and the node
# deployer install this file to /etc/sysctl.d/ and load it with
# `sysctl --load`.

# Zakura P2P runs QUIC over one UDP socket shared by every peer. zakurad sets
# neither SO_RCVBUF nor SO_SNDBUF, so the socket gets the kernel defaults
# (212992 bytes on stock Ubuntu). At 60 MB/s, 212992 bytes absorbs about 3 ms
# of burst. The kernel drops datagrams that overflow the buffer, and QUIC
# treats each drop as congestion loss. The kernel doubles these values for
# bookkeeping, so the socket reports twice the configured size.
net.core.rmem_default = 16777216
net.core.wmem_default = 16777216
net.core.rmem_max = 67108864
net.core.wmem_max = 67108864

# Legacy Zcash P2P runs over TCP. With this setting enabled, TCP resets its
# congestion window between block requests. zakurad warns at startup when it
# is enabled.
net.ipv4.tcp_slow_start_after_idle = 0
