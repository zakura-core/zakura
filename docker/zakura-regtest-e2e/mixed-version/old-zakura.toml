# Zakura mixed-version e2e: OLD v2-only node (the released v1.8.9 binary).
#
# Joins only by dialing old-dual natively over p2p-v2/3, so blocks reaching it
# prove old<->old v2 still works next to the new cohort.

[network]
network = "Regtest"
# Inert under the zakura-only stack, but the field is required.
listen_addr = "127.0.0.1:28333"
p2p_stack = "zakura"
cache_dir = false
initial_testnet_peers = []
max_connections_per_ip = 10
# Log real peer addresses, so the harness can tell which connection a peer-set
# disconnect line names.
expose_peer_addresses = true
zakura_node_secret_key = "2222222222222222222222222222222222222222222222222222222222222222"

[network.zakura]
listen_addr = "127.0.0.1:28334"
# The harness replaces the placeholder with old-dual's logged node ID.
bootstrap_peers = [
  "OLD_DUAL_NODE_ID@127.0.0.1:28234",
]

[state]
ephemeral = true

[rpc]
listen_addr = "127.0.0.1:28332"
enable_cookie_auth = false

[metrics]
endpoint_addr = "127.0.0.1:29002"

[mining]
internal_miner = false
# Regtest uses testnet address encoding; needed so `generate` can build coinbases.
miner_address = "tmJymvcUCn1ctbghvTJpXBwHiMEB8P6wxNV"

[tracing]
# Plain logs keep the harness greps free of ANSI escapes.
use_color = false
filter = "info,zakura_network::zakura=debug"
