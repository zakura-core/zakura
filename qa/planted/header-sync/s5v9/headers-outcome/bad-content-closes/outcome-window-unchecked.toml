# The v9 subscriber no longer refuses an outcome outside its window, so it
# ends its subscription on the adversary's early `SubscriptionClosed` and
# keeps the connection open. Its input is the focused scenario of
# `SubscriptionClosed` before the node sent `Close`, so
# `header-sync/s5v9/headers-outcome/bad-content-closes` is the only ID it
# breaks by its stopping step.
# Besides the files the patch changes, the rest of these decide which
# frames the input's peers send and when the node judges them. A change
# there can move the input off its frame.
# Past the stop, the outcomes that follow for the ended subscription are
# unsolicited and the subscriber never closes over them, so
# `headers-outcome/unsolicited-closes` breaks too, but only later, and the
# case's set is judged on its Draft run (`draft_set`).
draft_set = ["header-sync/s5v9/headers-outcome/unsolicited-closes"]
checks = ["crates/zakura-network/src/zakura/header_sync", "crates/zakura-network/src/zakura/regulation"]

[typed]
harness = "header-sync/wire"
scenario = "crates/zakura-sim/tests/fixtures/header-wire-planted-headers-outcome-bad-content.json"
plan = "crates/zakura-sim/tests/fixtures/header-wire-default.plan"
