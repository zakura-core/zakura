# Forgets a clone of each locator permit the reactor takes, so the permit
# never returns to the reactor's locator semaphore. The kept clone also
# keeps the semaphore alive. `consumed-locator-permit` covers a permit
# that lets go of it. The reactor reports no permits, and the ownership
# ledger doesn't count them, so every owner event stays clean. The
# required failure is `TeardownLocatorPermits`, once the stopped
# reactor's task ends. The input's node reads a locator and then shuts
# down.
input = "crates/zakura-sim/tests/fixtures/header-storage-w-stop-storage.bin"
# Besides dispatch.rs, which the patch changes, the rest of header sync
# decides when the node reads a locator and when it stops. A change there
# can move the input off a locator read before its shutdown.
checks = ["crates/zakura-network/src/zakura/header_sync"]
