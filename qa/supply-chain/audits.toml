criteria = "safe-to-deploy"
version = "0.2.17"
notes = "Reviewed all packaged source, manifest, and tests, and diffed the full source tree against 0.2.15: the only changes are Cygwin target support, documentation, and a Windows fix that types BCryptGenRandom's return as i32 before the NTSTATUS severity check. The crate never substitutes insecure bytes for a failed system call: every backend returns an Error instead, the shared fill loop retries only on EINTR and treats a zero or unexpected return as an error, and the destination is a MaybeUninit slice that is assumed initialized only after a backend reports success. The Linux, macOS, and Windows backends are otherwise identical to 0.2.15 and were reviewed on the same terms, including the /dev/random poll before any /dev/urandom fallback. All 6 tests passed with the std and custom features; all-features cannot build on stable because it enables rustc-dep-of-std."

[[audits.getrandom]]
who = "Claude Opus 5 <noreply@anthropic.com>"
criteria = "safe-to-deploy"
version = "0.4.3"
notes = 'Reviewed all packaged source, manifest, build script, and tests. The crate never substitutes insecure bytes for a failed system call: every backend returns an Error instead, the shared fill loop retries only on EINTR and treats a zero or unexpected return as an error, and the destination is a MaybeUninit slice that is assumed initialized only after a backend reports success. The 0.4 line reorganizes the backends behind a getrandom_backend cfg that a builder may set explicitly, including custom and unsupported variants; nothing in this workspace sets it, so target detection picks the platform backend, and the build script only turns cfg(sanitize = "memory") into an internal cfg so filled buffers can be unpoisoned. The u32 and u64 helpers build their destination slice from a MaybeUninit of matching size and assume initialization only after a successful fill. All 20 tests passed with all features.'

