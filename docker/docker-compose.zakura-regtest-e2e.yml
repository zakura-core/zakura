# Lightweight Zakura dual-stack Regtest smoke test.
#
# Four zakurad nodes use a fresh Regtest chain.
# Each node runs the host-built `zakurad` binary in `debian:trixie-slim`.
# The container image provides glibc 2.41, libstdc++, and libgcc.
#
# Build the binary once on the host, then bring the cluster up:
#
#   cargo build -p zakura --bin zakurad         # debug is fine for regtest
#   ZAKURAD_BIN=$(pwd)/target/debug/zakurad \
#     docker compose -f docker/docker-compose.zakura-regtest-e2e.yml up -d
#
# `docker/zakura-regtest-e2e/run.sh` builds the binary and starts the cluster.
# The script verifies compatibility, Zakura propagation, and block sync.
#
# Regtest accepts only localhost initial peers.
# The nodes therefore use host networking.
# The nodes share 127.0.0.1 and use distinct ports.
# Each node keeps temporary state and traces in tmpfs by default.
# Node2 uses a named mount for restart-matrix runs.
# Resource limits keep the cluster responsive after a failure.

name: zakura-regtest-e2e

x-zakura-node: &zakura-node
  image: debian:trixie-slim
  network_mode: host
  restart: "no"
  stop_grace_period: 5s
  cpu_shares: 256
  mem_swappiness: 0
  memswap_limit: 1536m
  tmpfs:
    - /tmp
  deploy:
    resources:
      limits:
        cpus: "2"
        memory: 1536m
        pids: 256

services:
  zakura-node-1:
    <<: *zakura-node
    container_name: zakura-node-1
    entrypoint: ["/usr/local/bin/zakurad", "--config", "/etc/zakura/node1.toml", "start"]
    volumes:
      - ${ZAKURAD_BIN:-../target/debug/zakurad}:/usr/local/bin/zakurad:ro
      - ${ZAKURA_NODE1_CONFIG:-./zakura-regtest-e2e/node1.toml}:/etc/zakura/node1.toml:ro
      - ${ZAKURA_E2E_TRACE_DIR:-/tmp/zakura-regtest-e2e-traces}:/traces

  zakura-node-2:
    <<: *zakura-node
    container_name: zakura-node-2
    depends_on:
      - zakura-node-1
    entrypoint: ["/usr/local/bin/zakurad", "--config", "/etc/zakura/node2.toml", "start"]
    volumes:
      - ${ZAKURAD_BIN:-../target/debug/zakurad}:/usr/local/bin/zakurad:ro
      - ${ZAKURA_NODE2_CONFIG:-./zakura-regtest-e2e/node2.toml}:/etc/zakura/node2.toml:ro
      - ${ZAKURA_E2E_TRACE_DIR:-/tmp/zakura-regtest-e2e-traces}:/traces
      - zakura-node2-state:/tmp/zakura-node2-state

  zakura-node-3:
    <<: *zakura-node
    container_name: zakura-node-3
    depends_on:
      - zakura-node-1
    entrypoint: ["/usr/local/bin/zakurad", "--config", "/etc/zakura/node3.toml", "start"]
    volumes:
      - ${ZAKURAD_BIN:-../target/debug/zakurad}:/usr/local/bin/zakurad:ro
      - ${ZAKURA_NODE3_CONFIG:-./zakura-regtest-e2e/node3.toml}:/etc/zakura/node3.toml:ro
      - ${ZAKURA_E2E_TRACE_DIR:-/tmp/zakura-regtest-e2e-traces}:/traces

  zakura-node-4:
    <<: *zakura-node
    container_name: zakura-node-4
    depends_on:
      - zakura-node-1
    entrypoint: ["/usr/local/bin/zakurad", "--config", "/etc/zakura/node4.toml", "start"]
    volumes:
      - ${ZAKURAD_BIN:-../target/debug/zakurad}:/usr/local/bin/zakurad:ro
      - ${ZAKURA_NODE4_CONFIG:-./zakura-regtest-e2e/node4.toml}:/etc/zakura/node4.toml:ro
      - ${ZAKURA_E2E_TRACE_DIR:-/tmp/zakura-regtest-e2e-traces}:/traces

volumes:
  zakura-node2-state:
    name: ${ZAKURA_NODE2_STATE_VOLUME:-zakura-regtest-e2e-node2-state-default}
