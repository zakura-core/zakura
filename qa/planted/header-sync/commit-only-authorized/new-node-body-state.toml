# Every newly admitted header starts with its body commitments marked
# matched, though no body was seen, so a later body check can trust a
# result nobody produced. The reactor, the queue, the storage adapter and
# the planner decide how the witness's rounds apply, so a change there can
# move the witness off it.
checks = ["crates/zakura-network/src/zakura/header_sync", "crates/zakura-storage/src/header", "crates/zakura-header-chain/src/transition"]

[typed]
harness = "header-sync/storage"
scenario = "crates/zakura-sim/tests/fixtures/header-authority-forks-sharing-a-header.json"
plan = "crates/zakura-sim/tests/fixtures/header-authority-forks-sharing-a-header.plan"
