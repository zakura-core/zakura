# Drops the refusal the machine logs for a failed fetch, in the core task,
# so the indexer misses its invalidation. No submitter is answered for a
# failed fetch, so only the settled run's failed-fetch check sees it.
input = "crates/zakura-sim/tests/fixtures/pool-core.bin"
# The harness drives the pool core and the storage under it.
checks = ["crates/zakura-mempool/src"]
