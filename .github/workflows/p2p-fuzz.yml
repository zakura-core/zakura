name: P2P fuzzing

on:
  # Run a bounded campaign daily, and a longer one on Sunday.
  schedule:
    - cron: "28 5 * * 1-6"
    - cron: "28 5 * * 0"
  workflow_dispatch:

concurrency:
  # One group per run, so a manual run never cancels a scheduled one on `main`.
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_FUZZ_VERSION: 0.13.2
  P2P_FUZZ_NIGHTLY: nightly-2026-07-15
  RUST_BACKTRACE: 1
  CXXFLAGS: -include cstdint

jobs:
  fuzz:
    name: ${{ matrix.target }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: service_session
            decoder: 1
            seconds: 900
            weekly_seconds: 3600
            rss_mb: 2048
            max_len: 512
          - target: cadence
            decoder: 1
            seconds: 900
            weekly_seconds: 3600
            rss_mb: 2048
            max_len: 512
          - target: block_work_ownership
            decoder: 1
            seconds: 900
            weekly_seconds: 3600
            rss_mb: 2048
            max_len: 512
          - target: block_peer_registry
            decoder: 1
            seconds: 900
            weekly_seconds: 3600
            rss_mb: 2048
            max_len: 512
          - target: block_retry_authority
            decoder: 1
            seconds: 900
            weekly_seconds: 3600
            rss_mb: 2048
            max_len: 512
          - target: block_query
            decoder: 1
            seconds: 900
            weekly_seconds: 3600
            rss_mb: 2048
            max_len: 512
          - target: block_reactor
            decoder: 2
            seconds: 900
            weekly_seconds: 3600
            rss_mb: 2048
            max_len: 512
          - target: block_fill
            decoder: 1
            seconds: 900
            weekly_seconds: 3600
            rss_mb: 2048
            max_len: 512
          - target: block_request_lifecycle
            decoder: 1
            seconds: 900
            weekly_seconds: 3600
            rss_mb: 2048
            max_len: 512
          - target: block_sequencer_order
            decoder: 1
            seconds: 900
            weekly_seconds: 3600
            rss_mb: 2048
            max_len: 512
          - target: block_sequencer_reset
            decoder: 1
            seconds: 900
            weekly_seconds: 3600
            rss_mb: 2048
            max_len: 512
          - target: block_sequencer_evidence
            decoder: 1
            seconds: 900
            weekly_seconds: 3600
            rss_mb: 2048
            max_len: 512
          - target: discovery_book
            decoder: 1
            seconds: 900
            weekly_seconds: 3600
            rss_mb: 2048
            max_len: 512
          - target: discovery_state
            decoder: 1
            seconds: 900
            weekly_seconds: 3600
            rss_mb: 2048
            max_len: 512
          - target: discovery_session
            decoder: 1
            seconds: 900
            weekly_seconds: 3600
            rss_mb: 2048
            max_len: 512
          - target: discovery_redial
            decoder: 1
            seconds: 900
            weekly_seconds: 3600
            rss_mb: 2048
            max_len: 512
          - target: discovery_query
            decoder: 1
            seconds: 900
            weekly_seconds: 3600
            rss_mb: 2048
            max_len: 512
          - target: discovery_candidate
            decoder: 1
            seconds: 900
            weekly_seconds: 3600
            rss_mb: 2048
            max_len: 512

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f #v2.0.0
        with:
          toolchain: ${{ env.P2P_FUZZ_NIGHTLY }}
          cache: true
          cache-on-failure: true
      - uses: ./.github/actions/setup-zakura-build
      - name: Install pinned cargo-fuzz
        run: cargo install cargo-fuzz --version "${CARGO_FUZZ_VERSION}" --locked
      - name: Restore the target's corpus
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 #v4.2.3
        with:
          path: qa/fuzz/p2p/corpus/${{ matrix.target }}
          # Bytes mean something only to their decoder, so a new decoder starts a new corpus.
          key: p2p-fuzz-corpus-${{ matrix.target }}-d${{ matrix.decoder }}-${{ github.run_id }}
          restore-keys: |
            p2p-fuzz-corpus-${{ matrix.target }}-d${{ matrix.decoder }}-
      - name: Replay the corpus in a fresh process
        working-directory: qa/fuzz/p2p
        env:
          TARGET: ${{ matrix.target }}
          RSS_MB: ${{ matrix.rss_mb }}
        run: |
          mkdir -p "corpus/${TARGET}"
          cargo fuzz run --fuzz-dir . "${TARGET}" "corpus/${TARGET}" -- \
            -runs=0 \
            -rss_limit_mb="${RSS_MB}"
      - name: Run bounded campaign
        working-directory: qa/fuzz/p2p
        env:
          NORMAL_SECONDS: ${{ matrix.seconds }}
          WEEKLY_SECONDS: ${{ matrix.weekly_seconds }}
          SCHEDULE: ${{ github.event.schedule }}
          TARGET: ${{ matrix.target }}
          RSS_MB: ${{ matrix.rss_mb }}
          MAX_LEN: ${{ matrix.max_len }}
        run: |
          seconds="${NORMAL_SECONDS}"
          if [ "${SCHEDULE}" = "28 5 * * 0" ]; then
            seconds="${WEEKLY_SECONDS}"
          fi
          # cargo-fuzz otherwise looks for `fuzz/` under the workspace root.
          cargo fuzz run --fuzz-dir . "${TARGET}" -- \
            -max_total_time="${seconds}" \
            -rss_limit_mb="${RSS_MB}" \
            -max_len="${MAX_LEN}"
      - name: Replay crash artifacts in a fresh process
        if: failure()
        working-directory: qa/fuzz/p2p
        env:
          TARGET: ${{ matrix.target }}
        run: |
          for artifact in artifacts/"${TARGET}"/*; do
            [ -f "${artifact}" ] || continue
            # A second failure confirms the artifact; the campaign already failed the job.
            cargo fuzz run --fuzz-dir . "${TARGET}" "${artifact}" -- -runs=1 || true
          done
      - name: Upload crash artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
        with:
          name: p2p-fuzz-${{ matrix.target }}-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: qa/fuzz/p2p/artifacts/${{ matrix.target }}
