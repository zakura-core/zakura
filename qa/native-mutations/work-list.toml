# The mutation loop's work list (mutation plan, mut-7.2).
#
# Each entry is one run of PROMPT.md. The entries come from reg-10.1's
# inventory, "Properties shared across reactors" in properties.md. Paths are
# relative to the repository root.
#
# An entry's `kind` is one of:
# - `shared-definition`: one idea with several instances. `shared` names the
#   toolkit code every instance runs through. A break there runs against
#   every instance. A break in one instance's `code` runs against that
#   instance only.
# - `single`: one property with one instance.
# - `machine`: one owner checked against its independent model.
# - `shared-wire-path`: the production side of the wire rules every protocol
#   table enforces. A break here runs once against each table it lists.
# - `protocol-table`: one protocol table's own guards, covered once, not
#   per message type. Its `table` prefixes every generated ID it covers.
#
# Each witness is one of:
# - `planted = "<case>.toml"`: the committed input or typed scenario of a
#   retained `qa/planted/` case, which `zakura-sim record --witness <id>
#   --expect holds` runs on the unpatched build;
# - `input = "<file>.bin"`: a committed fuzz input with its sidecar;
# - `test = "<selector>"` with `test_target = "<file>"`: one `zakura-sim`
#   integration test, run with `--exact`.
# Every witness holds on `main`.
#
# `crates/zakura-sim/tests/mutation_work_list.rs` checks that every
# `Active` block-sync, block and discovery ID appears in exactly one entry
# or under `[[excluded]]`, and that each protocol table appears once.
# `scripts/mutation_inventory.py` checks each generated case against this
# file.

schema = 1

