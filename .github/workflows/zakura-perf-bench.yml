name: Perf bench (ephemeral droplets)

# CPU-profiled mainnet workloads on throwaway DigitalOcean droplets.
#
# Historical sync restores the baked `sandblast` state and syncs to a fixed
# height. Live-head profiling restores the baked pruned `tip` state, catches up
# without profiling on the production default P2P stack, waits until the
# verified body tip matches the peer header tip, then records one fixed window
# of real head traffic. Both workloads emit a sampled CPU flamegraph, metrics,
# available traces, and digests.
#
# Setting `baseline_ref` runs BOTH legs in parallel on identical fresh droplets
# and adds a compare job: blocks/s speedup, per-function CPU self-share diff,
# and a differential flamegraph. No queueing, no shared host, droplet size is
# an input. Weekly scheduled runs keep profiled baselines of `main` in both
# verify modes. See docs/cpu-profiling.md for how to read the results.
#
# Droplets are tagged `zakura-pr-node`, so the hourly reaper removes anything a
# failed teardown leaves behind. Requires the pr-node bake to have run (image +
# state volume snapshots) and the same DO secrets as zakura-pr-node.yml.

on:
  schedule:
    # Weekly profiled baselines of main (UTC Monday, after the 04:00 pr-node
    # bake). The cron string picks the verify mode — see the plan job.
    - cron: "17 5 * * 1" # checkpoint-zone sync profile
    - cron: "47 6 * * 1" # semantic full-verification profile
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/tag/SHA to bench"
        required: false
        default: "main"
      workload:
        description: "Mainnet workload to profile"
        type: choice
        required: false
        default: "historical_checkpoint"
        options:
          - historical_checkpoint
          - historical_semantic
          - live_head
      baseline_ref:
        description: "Optional historical_sync A/B baseline (live_head is intentionally single-leg)"
        required: false
        default: ""
      profile:
        description: "CPU profiling: cpu = flamegraph + CPU counters; off = workload only"
        type: choice
        required: false
        default: "cpu"
        options:
          - cpu
          - "off"
      stop_height:
        description: "historical_sync only: stop after committing this height (sandblast tip is 1,707,210)"
        required: false
        default: "1730000"
      wall_cap_seconds:
        description: "Hard cap for historical sync or live-head catch-up, seconds"
        required: false
        default: "2000"
      head_profile_minutes:
        description: "live_head only: profile duration after the head gate"
        required: false
        default: "60"
      droplet_size:
        description: "Droplet size per leg (disk must be >= the baked image's disk)"
        required: false
        default: "c-16"
      peerset_size:
        description: "Target peer count"
        required: false
        default: "75"
      teardown_after_run:
        description: "Delete the droplets + volumes when the run ends (else the reaper removes them within 24h)"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  plan:
    name: plan legs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # scheduled baselines only make sense where the DO secrets + bake exist
    if: github.event_name != 'schedule' || github.repository == 'zakura-core/zakura'
    outputs:
      legs: ${{ steps.legs.outputs.legs }}
      has_baseline: ${{ steps.legs.outputs.has_baseline }}
      verify_mode: ${{ steps.legs.outputs.verify_mode }}
      workload: ${{ steps.legs.outputs.workload }}
    steps:
      - name: Resolve legs and modes
        id: legs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # inputs.* is empty on scheduled runs; schedule benches main, and the
          # 06:47 cron is the semantic baseline
          REF: ${{ inputs.ref || 'main' }}
          BASELINE_REF: ${{ inputs.baseline_ref }}
          REQUESTED_WORKLOAD: ${{ github.event_name == 'schedule' && (github.event.schedule == '47 6 * * 1' && 'historical_semantic' || 'historical_checkpoint') || inputs.workload || 'historical_checkpoint' }}
        run: |
          set -euo pipefail
          case "$REQUESTED_WORKLOAD" in
            historical_checkpoint) WORKLOAD=historical_sync; VERIFY_MODE=checkpoint ;;
            historical_semantic) WORKLOAD=historical_sync; VERIFY_MODE=semantic ;;
            live_head) WORKLOAD=live_head; VERIFY_MODE=semantic ;;
            *) echo "unknown workload: $REQUESTED_WORKLOAD" >&2; exit 1 ;;
          esac
          if [ "$WORKLOAD" = live_head ] && [ -n "$BASELINE_REF" ]; then
            echo "live_head is observational and intentionally single-leg; leave baseline_ref blank" >&2
            exit 1
          fi
          resolve() { gh api "repos/${REPO}/commits/$1" --jq .sha; }
          PRIMARY_SHA=$(resolve "$REF")
          legs="[{\"leg\":\"primary\",\"ref\":\"${REF}\",\"sha\":\"${PRIMARY_SHA}\"}"
          has_baseline=false
          if [ -n "$BASELINE_REF" ]; then
            BASELINE_SHA=$(resolve "$BASELINE_REF")
            legs="${legs},{\"leg\":\"baseline\",\"ref\":\"${BASELINE_REF}\",\"sha\":\"${BASELINE_SHA}\"}"
            has_baseline=true
          fi
          legs="${legs}]"
          {
            echo "legs=${legs}"
            echo "has_baseline=${has_baseline}"
            echo "verify_mode=${VERIFY_MODE}"
            echo "workload=${WORKLOAD}"
          } >> "$GITHUB_OUTPUT"
          echo "plan: ${legs} (workload=${WORKLOAD}, verify_mode=${VERIFY_MODE})"

  bench:
    name: "bench ${{ matrix.leg.leg }}: ${{ matrix.leg.ref }} (${{ needs.plan.outputs.workload }})"
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.plan.outputs.legs) }}
    steps:
      - name: Checkout (for the run + digest scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Install doctl and the fleet SSH key
        uses: ./.github/actions/do-cli
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          ssh_private_key: ${{ secrets.DO_SSH_PRIVATE_KEY }}

      - name: Create droplet (+ state volume)
        id: droplet
        uses: ./.github/actions/do-droplet
        with:
          name: zakura-perf-${{ matrix.leg.leg }}-${{ github.run_id }}
          size: ${{ inputs.droplet_size || 'c-16' }}
          ssh_fingerprint: ${{ vars.DO_SSH_KEY_FINGERPRINT }}
          # tagged zakura-pr-node so the hourly reaper covers failed teardowns
          tag: zakura-pr-node
          state_network: mainnet
          volume_name: zakura-pr-perf-vol-${{ github.run_id }}-${{ matrix.leg.leg }}

      - name: Wait for SSH
        uses: ./.github/actions/do-wait-ssh
        with:
          ip: ${{ steps.droplet.outputs.ip }}

      - name: Run the profiled bench leg
        env:
          IP: ${{ steps.droplet.outputs.ip }}
          GH_CLONE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEG: ${{ matrix.leg.leg }}
          SHA: ${{ matrix.leg.sha }}
          WORKLOAD: ${{ needs.plan.outputs.workload }}
          VERIFY_MODE: ${{ needs.plan.outputs.verify_mode }}
          PROFILE: ${{ inputs.profile || 'cpu' }}
          STOP_HEIGHT: ${{ inputs.stop_height || '1730000' }}
          WALL_CAP: ${{ inputs.wall_cap_seconds || '2000' }}
          HEAD_PROFILE_MINUTES: ${{ inputs.head_profile_minutes || '60' }}
          START_HEIGHT: ${{ vars.PERF_BENCH_START_HEIGHT || '1707210' }}
          PEERSET_SIZE: ${{ inputs.peerset_size || '75' }}
          VOLUME_NAME: ${{ steps.droplet.outputs.volume_name }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          umask 077
          {
            printf 'GH_REPO=%q\n'          "${GITHUB_REPOSITORY}"
            printf 'GH_CLONE_TOKEN=%q\n'   "${GH_CLONE_TOKEN}"
            printf 'SHA=%q\n'              "${SHA}"
            printf 'LEG=%q\n'              "${LEG}"
            printf 'WORKLOAD=%q\n'         "${WORKLOAD}"
            printf 'VERIFY_MODE=%q\n'      "${VERIFY_MODE}"
            printf 'PROFILE=%q\n'          "${PROFILE}"
            printf 'STOP_HEIGHT=%q\n'      "${STOP_HEIGHT}"
            printf 'WALL_CAP=%q\n'         "${WALL_CAP}"
            printf 'HEAD_PROFILE_MINUTES=%q\n' "${HEAD_PROFILE_MINUTES}"
            printf 'START_HEIGHT=%q\n'     "${START_HEIGHT}"
            printf 'PEERSET_SIZE=%q\n'     "${PEERSET_SIZE}"
            printf 'VOLUME_NAME=%q\n'      "${VOLUME_NAME}"
            printf 'GITHUB_RUN_URL=%q\n'   "${GITHUB_RUN_URL}"
            printf 'GITHUB_RUN_ID=%q\n'    "${GITHUB_RUN_ID}"
          } > /tmp/run.env
          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i /tmp/do_ssh \
            /tmp/run.env \
            .github/workflows/scripts/perf-bench-run.sh \
            scripts/zakura-bench-digest.py \
            scripts/zakura-metrics-dashboard.py \
            "root@${IP}:/root/"
          rm -f /tmp/run.env
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=240 -i /tmp/do_ssh "root@${IP}" \
            'set -euo pipefail; set -a; . /root/run.env; set +a; bash /root/perf-bench-run.sh'

      - name: Collect leg outputs
        if: always() && steps.droplet.outputs.ip != ''
        env:
          IP: ${{ steps.droplet.outputs.ip }}
        run: |
          set -euo pipefail
          mkdir -p leg-out
          scp -r -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i /tmp/do_ssh \
            "root@${IP}:/root/out/." leg-out/ || true
          if [ -f leg-out/leg-summary.md ]; then
            cat leg-out/leg-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Leg: ${{ matrix.leg.leg }} — no outputs collected" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload leg artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: zakura-perf-bench-${{ github.run_id }}-${{ matrix.leg.leg }}
          path: leg-out/
          if-no-files-found: ignore
          retention-days: 30

      - name: Teardown droplet + volume
        if: always()
        uses: ./.github/actions/do-teardown
        with:
          droplet_id: ${{ steps.droplet.outputs.id }}
          volume_ids: ${{ steps.droplet.outputs.volume_id }}
          # string-compare: on schedule/pull_request the input is null, and
          # GitHub's loose `null == false` coercion would skip teardown
          enabled: ${{ format('{0}', inputs.teardown_after_run) == 'false' && 'false' || 'true' }}

  compare:
    name: A/B compare
    needs: [plan, bench]
    if: always() && needs.plan.outputs.has_baseline == 'true' && needs.bench.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (for the digest script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Download leg artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: zakura-perf-bench-${{ github.run_id }}-*
          path: legs/

      - name: Compare legs
        id: compare
        run: |
          set -euo pipefail
          python3 .github/workflows/scripts/perf-bench-compare.py \
            "legs/zakura-perf-bench-${GITHUB_RUN_ID}-primary/meta.json" \
            "legs/zakura-perf-bench-${GITHUB_RUN_ID}-baseline/meta.json" \
            >> "$GITHUB_STEP_SUMMARY"

      # Only when both legs ran zakurad to completion: a diff against a leg that
      # died early describes the crash, not the change.
      - name: Diff CPU profiles
        if: steps.compare.outputs.compare == 'true'
        run: |
          set -euo pipefail
          P="legs/zakura-perf-bench-${GITHUB_RUN_ID}-primary"
          B="legs/zakura-perf-bench-${GITHUB_RUN_ID}-baseline"
          mkdir -p compare-out
          if [ ! -s "$P/profile.folded" ] || [ ! -s "$B/profile.folded" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "_(no CPU diff: one or both legs have no folded stacks)_" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 scripts/zakura-bench-digest.py diff \
            --baseline "$B/profile.folded" --primary "$P/profile.folded" \
            --title "primary vs baseline" | tee compare-out/profile-diff.md >> "$GITHUB_STEP_SUMMARY"
          if cargo install inferno --locked >/dev/null 2>&1; then
            export PATH="$HOME/.cargo/bin:$PATH"
            inferno-diff-folded "$B/profile.folded" "$P/profile.folded" 2>/dev/null \
              | inferno-flamegraph --title "CPU diff: baseline → primary" \
              > compare-out/flamegraph-diff.svg 2>/dev/null \
              || rm -f compare-out/flamegraph-diff.svg
          fi

      - name: Upload compare artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: zakura-perf-bench-${{ github.run_id }}-compare
          path: compare-out/
          if-no-files-found: ignore
          retention-days: 30
