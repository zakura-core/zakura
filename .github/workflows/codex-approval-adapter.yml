name: Codex approval adapter

on:
  issue_comment:
    types: [created, edited, deleted]
  pull_request_target: # zizmor: ignore[dangerous-triggers] -- reads PR metadata only; both jobs check out trusted main and never run PR code
    # Retargeting away from main must still withdraw an existing approval.
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited]
  push:
    branches: [main]
    paths:
      - .github/review-policy/**
      - .github/workflows/codex-approval-adapter.yml
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to recheck (blank includes all open base branches for cleanup; does not start a Codex review)
        type: string
        required: false

# Serialize writers, including scheduled reconciliation and per-PR events.
# Do not cancel a runner between an approval POST and its verification.
concurrency:
  group: codex-approval-adapter
  cancel-in-progress: false

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  audit:
    if: >-
      github.repository == 'zakura-core/zakura' &&
      (github.event_name != 'issue_comment' || github.event.issue.pull_request) &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      run_reconcile: ${{ steps.authors.outputs.run_reconcile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: .github/review-policy
      - name: Check PR authors' repository access
        id: authors
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_APPROVAL_BOT_ID: ${{ vars.CODEX_APPROVAL_BOT_ID }}
        run: python3 .github/review-policy/adapter.py --check-authors --event "$GITHUB_EVENT_PATH"
      - name: Inspect native Codex evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/review-policy/adapter.py --event "$GITHUB_EVENT_PATH" --wait-seconds 10

  reconcile:
    needs: audit
    if: >-
      !cancelled() && needs.audit.result != 'skipped' &&
      needs.audit.outputs.run_reconcile == 'true' &&
      vars.CODEX_APPROVAL_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: .github/review-policy
      - name: Mint approval App token
        id: approval-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 #v3.2.0
        with:
          client-id: ${{ vars.CODEX_APPROVAL_APP_CLIENT_ID }}
          private-key: ${{ secrets.CODEX_APPROVAL_APP_PRIVATE_KEY }}
          permission-pull-requests: write
          # Omitted owner/repositories scopes the token to this repository.
      - name: Revalidate and reconcile approval
        env:
          GH_TOKEN: ${{ github.token }}
          GH_APPROVAL_TOKEN: ${{ steps.approval-token.outputs.token }}
          CODEX_APPROVAL_ENABLED: ${{ vars.CODEX_APPROVAL_ENABLED }}
          CODEX_APPROVAL_APP_ID: ${{ vars.CODEX_APPROVAL_APP_ID }}
          CODEX_APPROVAL_APP_CLIENT_ID: ${{ vars.CODEX_APPROVAL_APP_CLIENT_ID }}
          CODEX_APPROVAL_APP_SLUG: ${{ steps.approval-token.outputs.app-slug }}
          CODEX_APPROVAL_BOT_ID: ${{ vars.CODEX_APPROVAL_BOT_ID }}
        run: TRUSTED_SHA="$(git rev-parse HEAD)" python3 .github/review-policy/adapter.py --apply --event "$GITHUB_EVENT_PATH" --wait-seconds 10
