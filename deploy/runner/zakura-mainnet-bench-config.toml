# =============================================================================
# Mainnet bench config - public Zakura bootstrap peers.
#
# feed_run.sh copies this file and substitutes the per-run tokens below, then
# launches zakurad with the result. Use `make perf-run-mainnet` to select it.
#
# Tokens (each wrapped in double-at markers in the config lines further down):
#   FORK     -> hard-link fork of the warm master (per-run cache_dir)
#   LISTEN   -> legacy P2P listen port (derived from metrics port)
#   MET      -> Prometheus metrics port
#   STOP     -> debug_stop_at_height (bounds the bench window)
#   TRACEDIR -> structured Zakura trace directory
# =============================================================================

[network]
network     = "Mainnet"
listen_addr = "0.0.0.0:@@LISTEN@@"
cache_dir   = "@@FORK@@"
p2p_stack   = "zakura"  # pure Zakura P2P v2: block/header sync + tree_aux -> VCT fast path

[network.zakura]
# Bind on all interfaces - the QUIC endpoint uses one UDP socket for send+recv, so a loopback
# bind breaks OUTBOUND to external peers.
listen_addr     = "0.0.0.0:8234"
# Public mainnet Zakura bootstrap peers. No dev_network is set, so discovery uses
# the public Mainnet Zakura overlay instead of the private perf cohort.
bootstrap_peers = [
    "a98d73e0114f9f8ae3d5a0b4ec0b8cef20b51d715de6898a39fc3f23948196b7@159.65.183.89:8234",
    "02ef9b05d81ad2f6176a68fd047bda5e4e277d69ac51b3b2536d43ea8f38de1c@143.244.184.176:8234",
    "0018a0f4fc1f3cc3b4a84e8ebcb77008343c9e54fb80f77fd03271c7a33063b7@159.203.38.10:8234",
    "4607c5353e2c07ecd10d73c6c19d0b0de092939328f33e8f04d5ced382fadf7b@64.227.44.93:8234",
    "8ac35544d02141e7a3cc3c8b8661a3e726985a266673b60cf45f5b33c3f36e73@161.35.156.226:8234",
    "42623a00c2632e0cf99d1c10cec024b0217d12d5fecc91947a3a040f142df06b@139.59.64.115:8234",
    "ba06d75332e3a430d4e838b5838a2356338124cf2930bb0f8e2962e01223ed95@168.144.173.250:8234",
]
# Structured Zakura JSONL trace tables (BLOCK_SYNC_STATE + limiter, commit-state).
trace_dir       = "@@TRACEDIR@@"
# Throughput-gating knobs (levers for the body-fetch bottleneck): max_blocks_per_response=1,
# request_timeout=10s at default.

[network.zakura.block_sync]
replace_legacy_syncer = true   # Zakura fully owns block-body download; the legacy syncer keeps
                               # doing tip discovery only, so it no longer competes for downloads

[consensus]
checkpoint_sync = true  # keeps the region checkpoint-verified; on mainnet selects VCT peer-source mode

[metrics]
endpoint_addr = "127.0.0.1:@@MET@@"

[state]
cache_dir            = "@@FORK@@"
storage_mode         = "pruned"
debug_stop_at_height = @@STOP@@

# [sync] - back to defaults. The 2x checkpoint apply-concurrency test (800) was a loss
# (throughput flat/down, latency 2x, CPU still idle): two ranges serialize, they don't
# pipeline. The clamp is reverted to 400; next we split verify vs commit to find the
# serial stage (see zakura.consensus.checkpoint.{verify_range,state_commit}.* below).

[tracing]
# Full-pipeline tracing: Zakura block-sync (BLOCK_SYNC_STATE + limiter), checkpoint
# verifier, and the committer at debug. QUIC UDP + byte-budget-guard WARN spam silenced.
# Output lands in the run's log: /mnt/roman-dev-2-data/feedrun-<LABEL>.log
filter = "info,zakura_network::zakura=debug,zakura_network::zakura::transport::guard=error,zakurad::commands::start::zakura=debug"
