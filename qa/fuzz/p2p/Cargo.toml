[package]
name = "zakura-p2p-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# What each target checks and which decoder reads its bytes. The C1 suite manifest
# generates its coverage rows from this table, and scripts/check-fuzz-campaign.py
# fails a target without an entry. A new decoder gets a new corpus cache.
[package.metadata.zakura-machine.targets]
service_session = { decoder = 1, properties = ["session/offer-assembly", "session/one-active-generation", "session/legal-reopen"] }
cadence = { decoder = 1, properties = ["cadence/hold", "cadence/settlement"] }
block_work_ownership = { decoder = 1, properties = ["block/work-ownership"] }
block_peer_registry = { decoder = 1, properties = ["block/peer-registry"] }
block_retry_authority = { decoder = 1, properties = ["block/retry-authority"] }
block_query = { decoder = 1, properties = ["block/query-dispatch", "block/query-completion"] }
block_reactor = { decoder = 2, properties = ["block/reactor-policy"] }
block_fill = { decoder = 1, properties = ["block/fill-retry-run", "block/fill-retained-funding", "block/fill-commit-window"] }
block_request_lifecycle = { decoder = 1, properties = ["block/request-lifecycle"] }
block_sequencer_order = { decoder = 1, properties = ["block/contiguous-submission"] }
block_sequencer_reset = { decoder = 1, properties = ["block/retired-apply-isolation"] }
block_sequencer_evidence = { decoder = 1, properties = ["block/required-evidence"] }
discovery_book = { decoder = 1, properties = ["discovery/record-book"] }
discovery_state = { decoder = 1, properties = ["discovery/session-installation"] }
discovery_session = { decoder = 1, properties = ["discovery/session-policy"] }
discovery_redial = { decoder = 1, properties = ["discovery/redial-policy"] }
discovery_query = { decoder = 1, properties = ["discovery/query-ownership"] }
discovery_candidate = { decoder = 1, properties = ["discovery/dial-attempts"] }

[dependencies]
libfuzzer-sys = "0.4"
zakura-network = { path = "../../../crates/zakura-network", features = ["p2p-fuzz"] }

[workspace]

[[bin]]
name = "block_work_ownership"
path = "fuzz_targets/block_work_ownership.rs"
test = false
doc = false
bench = false

