# This workflow is the only supported path for creating v* release tags.
# It dispatches an advisory Mainnet VCT handoff canary and builds/verifies every
# release asset before a protected environment allows the release GitHub App to
# publish a draft and create the immutable tag.
#
# It dispatches from main, or from a hotfix/vX.Y.Z branch named for the exact
# tag it releases (see docs/security-hotfix-release.md). The
# source_first_release input is the emergency "Mode B" path described there.
name: Create release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, matching the zakura package version (for example v1.0.0-rc2)"
        required: true
        type: string
      publish_crates:
        description: "Publish to crates.io after tagging: auto publishes stable tags and skips release candidates. A crates-io reviewer still approves the upload"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - always
          - never
      allow_bootstrap_release_state:
        description: "Emergency override: accept legacy-bootstrap Mainnet release state (note it in the release PR)"
        required: false
        default: false
        type: boolean
      allow_unpublishable_crate_graph:
        description: "Emergency override for a GitHub-only release: proceed although the crates.io publish graph does not resolve — crates must not be published for this release (note it in the release PR)"
        required: false
        default: false
        type: boolean
      source_first_release:
        description: "Emergency mode: skip the staged asset build and publish a source-only release immediately; the tag-push run of release-binaries.yml builds and attaches binaries afterwards (see docs/security-hotfix-release.md, Mode B)"
        required: false
        default: false
        type: boolean
      expected_tag_delay_days:
        description: "Expected days before tagging; used to validate ESTIMATED_RELEASE_HEIGHT"
        required: false
        default: 0
        type: number
      release_state_waiver:
        description: "Urgent RC only: reason for releasing behind the latest verified Mainnet release-state bundle"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.validate.outputs.release_tag }}
      target_sha: ${{ steps.validate.outputs.target_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 #v1.17.0
        with:
          toolchain: stable
          # This job packages crates with --no-verify but does not compile them.
          cache: false

      - name: Validate source, tag, and package version
        id: validate
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_REF: ${{ github.ref }}
          TARGET_SHA: ${{ github.sha }}
          # The documented emergency override for scripts/check-release-state.sh.
          ZAKURA_ALLOW_BOOTSTRAP_RELEASE_STATE: ${{ inputs.allow_bootstrap_release_state && '1' || '0' }}
          # The documented emergency override for
          # scripts/check-crate-publish-graph.sh (GitHub-only releases).
          ZAKURA_ALLOW_UNPUBLISHABLE_CRATE_GRAPH: ${{ inputs.allow_unpublishable_crate_graph && '1' || '0' }}
        run: |
          set -euo pipefail

          case "$SOURCE_REF" in
            refs/heads/main) ;;
            refs/heads/hotfix/v*)
              # Hotfix branches are named for the exact tag they release, so a
              # tag can never be dispatched from another release's branch.
              if [ "$SOURCE_REF" != "refs/heads/hotfix/${RELEASE_TAG}" ]; then
                echo "Tag ${RELEASE_TAG} must be dispatched from hotfix/${RELEASE_TAG}, not ${SOURCE_REF}." >&2
                exit 1
              fi
              ;;
            *)
              echo "Create release must be dispatched from main or a hotfix/v* branch, not ${SOURCE_REF}." >&2
              exit 1
              ;;
          esac

          # This validates only release state committed to the source ref.
          # Resolving the moving R2 pointer belongs to update-release-state.yml.
          make pre-release \
            RELEASE_TAG="$RELEASE_TAG" \
            PRE_RELEASE_WARN_CRATE_VERSION_BUMPS=0

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

      - name: Check release readiness advisories
        env:
          EXPECTED_TAG_DELAY_DAYS: ${{ inputs.expected_tag_delay_days }}
          LATEST_URL: ${{ vars.MAINNET_RELEASE_STATE_LATEST_URL }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_STATE_WAIVER: ${{ inputs.release_state_waiver }}
        run: |
          advisory_exit() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ]; then
              echo "::warning title=Release readiness advisory unavailable::An unexpected readiness-check failure occurred (exit ${status}); continuing temporarily."
            fi
            exit 0
          }
          # These checks are intentionally advisory. Convert any unanticipated
          # shell, parsing, or data error into a warning as a final safeguard.
          trap advisory_exit EXIT
          set -euo pipefail
          if [ -z "$LATEST_URL" ]; then
            echo "::warning title=Release-state advisory unavailable::Set the MAINNET_RELEASE_STATE_LATEST_URL repository variable."
            exit 0
          fi
          if [ -n "$RELEASE_STATE_WAIVER" ] && [[ "$RELEASE_TAG" != *-rc* ]]; then
            echo "::warning title=Ignored release-state waiver::release_state_waiver is only valid for urgent release candidates."
            RELEASE_STATE_WAIVER=""
          fi
          if ! python3 .github/scripts/fetch-release-state.py --self-test \
            || ! python3 scripts/release-readiness.py self-test; then
            echo "::warning title=Release readiness advisory unavailable::A release-readiness self-test failed; continuing without these advisory checks."
            exit 0
          fi
          base_tag="$(git describe --tags --match 'v*' --abbrev=0 HEAD)"
          base_version="$(
            # Transition fallback: tags created before the crates/ move keep
            # zakurad/Cargo.toml at the repo root; remove once a post-move tag exists.
            { git show "${base_tag}:crates/zakurad/Cargo.toml" 2>/dev/null \
              || git show "${base_tag}:zakurad/Cargo.toml"; } \
              | awk -F ' *= *' '$1 == "version" { gsub(/"/, "", $2); print $2; exit }'
          )"
          version_report=""
          if ! version_report="$(
            python3 scripts/release-readiness.py version \
              --base-version "$base_version" \
              --release-tag "$RELEASE_TAG"
          )"; then
            echo "::warning title=Release level advisory::The requested tag is below the changelog-derived release level; continuing temporarily."
          fi
          if ! python3 .github/scripts/fetch-release-state.py \
            --latest-url "$LATEST_URL" \
            --output-dir "$RUNNER_TEMP/release-state-bundle" \
            --metadata-out "$RUNNER_TEMP/release-state-resolution.json" \
            --max-age-hours 48; then
            echo "::warning title=Release-state advisory unavailable::The latest Mainnet release-state bundle could not be verified; continuing temporarily."
            exit 0
          fi
          report=""
          if ! report="$(
            python3 scripts/release-readiness.py height \
              --resolution "$RUNNER_TEMP/release-state-resolution.json" \
              --expected-tag-delay-days "$EXPECTED_TAG_DELAY_DAYS"
          )"; then
            echo "::warning title=Support-height advisory unavailable::The projected release height could not be calculated; continuing temporarily."
            exit 0
          fi
          latest_height="$(jq -r '.bundle_height' <<<"$report")"
          estimated_height="$(jq -r '.estimated_release_height' <<<"$report")"
          committed_height="$(
            jq -r '.finalized_height' \
              crates/zakura-state/src/service/finalized_state/vct/mainnet-vct-manifest.json
          )"
          configured_height="$(
            grep -oE 'ESTIMATED_RELEASE_HEIGHT: u32 = [0-9_]+' \
              crates/zakurad/src/components/sync/end_of_support.rs \
              | grep -oE '[0-9_]+$' | tr -d '_'
          )"
          minimum_height=$((committed_height + 3456))
          if [ "$estimated_height" -gt "$minimum_height" ]; then
            minimum_height="$estimated_height"
          fi

          if [ "$latest_height" -gt "$committed_height" ]; then
            if [ -z "$RELEASE_STATE_WAIVER" ]; then
              echo "::warning title=Stale committed release state::Committed height ${committed_height} trails verified bundle ${latest_height}; update the release state before the next release."
            else
              echo "::warning title=Release-state waiver::${RELEASE_STATE_WAIVER}"
            fi
          fi
          if [ "$configured_height" -lt "$minimum_height" ]; then
            echo "::warning title=Stale support height::ESTIMATED_RELEASE_HEIGHT ${configured_height} trails the projected floor ${minimum_height}; re-run release preparation."
          fi
          [ -z "$version_report" ] || jq . <<<"$version_report" >> "$GITHUB_STEP_SUMMARY"
          jq . <<<"$report" >> "$GITHUB_STEP_SUMMARY"

  handoff-canary:
    name: Dispatch VCT handoff crossing
    needs: [validate]
    if: ${{ !inputs.source_first_release }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch non-blocking handoff canary
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ github.ref_name }}
          TARGET_SHA: ${{ needs.validate.outputs.target_sha }}
        run: |
          gh workflow run zakura-vct-handoff-canary.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$SOURCE_REF" \
            -f target_ref="$TARGET_SHA"

  build-assets:
    name: Build and verify release assets
    needs: [validate]
    # Mode B (source_first_release) trades the pre-tag asset build for speed:
    # the tag-push run of release-binaries.yml rebuilds and attaches assets to
    # the published release instead.
    if: ${{ !inputs.source_first_release }}
    uses: ./.github/workflows/release-binaries.yml
    # The nested publish-zakurad-assets job declares contents: write, and a
    # called workflow may not request more than the caller grants. The staging
    # run never uses the write scope: it skips every release-mutating step,
    # and GITHUB_TOKEN cannot create v* tags (ruleset bypass is app-only).
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      release_tag: ${{ needs.validate.outputs.release_tag }}
      checkout_ref: ${{ needs.validate.outputs.target_sha }}
      stage_release_assets: true

  publish:
    name: Publish release and create tag
    runs-on: ubuntu-latest
    needs: [validate, build-assets]
    # Tolerate asset staging being skipped only when emergency Mode B asked for
    # the source-first path. The separately dispatched handoff canary is
    # advisory and reports failures without delaying publication.
    if: >-
      ${{
        !cancelled()
        && needs.validate.result == 'success'
        && (
          needs.build-assets.result == 'success'
          || (inputs.source_first_release && needs.build-assets.result == 'skipped')
        )
      }}
    environment: release
    # actions: write is for dispatching crates.io publishing below; the release
    # itself is created with the GitHub App token, not GITHUB_TOKEN.
    permissions:
      contents: read
      actions: write
    steps:
      - name: Download staged release assets
        if: ${{ !inputs.source_first_release }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: staged-release-assets
          path: ./assets

      - name: Verify staged release assets
        if: ${{ !inputs.source_first_release }}
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          expected_assets=(
            "SHA256SUMS.txt"
            "zakurad-${RELEASE_TAG}-linux-aarch64.tar.gz"
            "zakurad-${RELEASE_TAG}-linux-x86_64.tar.gz"
            "zakurad-manifest-${RELEASE_TAG}.json"
          )
          unexpected_entry="$(
            find ./assets -mindepth 1 -maxdepth 1 ! -type f -print -quit
          )"
          if [ -n "$unexpected_entry" ]; then
            echo "Staged assets contain a non-file entry: ${unexpected_entry}" >&2
            exit 1
          fi
          printf '%s\n' "${expected_assets[@]}" | sort > ./expected-assets.txt
          find ./assets -maxdepth 1 -type f -printf '%f\n' | sort > ./actual-assets.txt
          diff --unified ./expected-assets.txt ./actual-assets.txt

          expected_payloads=(
            "zakurad-${RELEASE_TAG}-linux-aarch64.tar.gz"
            "zakurad-${RELEASE_TAG}-linux-x86_64.tar.gz"
            "zakurad-manifest-${RELEASE_TAG}.json"
          )
          printf '%s\n' "${expected_payloads[@]}" | sort > ./expected-payloads.txt
          # SHA256SUMS.txt entries are ./-prefixed (sha256sum ./*).
          awk '{print $2}' ./assets/SHA256SUMS.txt | sed 's|^\./||' | sort > ./checksummed-payloads.txt
          diff --unified ./expected-payloads.txt ./checksummed-payloads.txt
          (
            cd ./assets
            sha256sum --check --strict SHA256SUMS.txt
          )

          RELEASE_TAG="$RELEASE_TAG" REPOSITORY="$REPOSITORY" python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          release_tag = os.environ["RELEASE_TAG"]
          repository = os.environ["REPOSITORY"]

          manifest_path = Path(f"./assets/zakurad-manifest-{release_tag}.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("release_tag") != release_tag:
              raise SystemExit("Manifest release tag does not match the requested release.")
          if manifest.get("repository") != repository:
              raise SystemExit("Manifest repository does not match this repository.")

          expected_platforms = {
              "linux-aarch64": "aarch64-unknown-linux-gnu",
              "linux-x86_64": "x86_64-unknown-linux-gnu",
          }
          artifacts = manifest.get("artifacts", [])
          if manifest.get("schema_version") != 1 or len(artifacts) != len(expected_platforms):
              raise SystemExit("Manifest schema or artifact count is invalid.")

          seen_platforms = set()
          for artifact in artifacts:
              platform_id = artifact.get("platform_id")
              target_triple = expected_platforms.get(platform_id)
              if target_triple is None or platform_id in seen_platforms:
                  raise SystemExit(f"Unexpected or duplicate platform {platform_id!r}.")
              seen_platforms.add(platform_id)

              archive = f"zakurad-{release_tag}-{platform_id}.tar.gz"
              archive_path = Path("./assets") / archive
              expected_url = (
                  f"https://github.com/{repository}/releases/download/"
                  f"{release_tag}/{archive}"
              )
              if artifact.get("archive") != archive:
                  raise SystemExit(f"Manifest archive does not match {platform_id}.")
              if artifact.get("target_triple") != target_triple:
                  raise SystemExit(f"Manifest target triple does not match {platform_id}.")
              if artifact.get("archive_member_binary_path") != "./bin/zakurad":
                  raise SystemExit(f"Manifest binary path does not match {platform_id}.")
              if artifact.get("url") != expected_url:
                  raise SystemExit(f"Manifest URL does not match {platform_id}.")
              if artifact.get("size") != archive_path.stat().st_size:
                  raise SystemExit(f"Manifest archive size does not match {platform_id}.")
              digest = hashlib.sha256(archive_path.read_bytes()).hexdigest()
              if artifact.get("sha256") != digest:
                  raise SystemExit(f"Manifest checksum does not match {platform_id}.")
          PY

      - name: Create release GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 #v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Publish staged release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ needs.validate.outputs.target_sha }}
          SOURCE_FIRST: ${{ inputs.source_first_release && 'true' || 'false' }}
        run: |
          set -euo pipefail

          release_body="Release created by the protected Create release workflow."
          if [ "$SOURCE_FIRST" = "true" ]; then
            release_body="Source-first release: binaries are being built and attached by the tag-push release-binaries run."
          fi

          # On HTTP errors `gh api` prints the JSON error body to stdout, so
          # branch on the exit status instead of the captured output, and only
          # treat a 404 (tag does not exist yet) as the create-tag path.
          ref_status=0
          ref_json="$(gh api "repos/${REPOSITORY}/git/ref/tags/${RELEASE_TAG}" 2>/dev/null)" || ref_status=$?
          if [ "$ref_status" -eq 0 ]; then
            existing_sha="$(echo "$ref_json" | jq -r '.object.sha')"
            if [ "$existing_sha" != "$TARGET_SHA" ]; then
              echo "Tag ${RELEASE_TAG} already points to ${existing_sha}, not ${TARGET_SHA}." >&2
              exit 1
            fi
          elif [ "$(echo "$ref_json" | jq -r '.status? // empty' 2>/dev/null)" != "404" ]; then
            echo "Failed to look up tag ${RELEASE_TAG}: ${ref_json}" >&2
            exit 1
          fi

          releases="$(
            gh api --paginate --slurp \
              "repos/${REPOSITORY}/releases?per_page=100"
          )"
          published_count="$(
            echo "$releases" | jq --arg tag "$RELEASE_TAG" \
              '[.[][] | select(.tag_name == $tag and .draft == false)] | length'
          )"
          if [ "$published_count" -gt 0 ]; then
            echo "Release ${RELEASE_TAG} is already published; nothing to do."
            exit 0
          fi

          draft_id="$(
            echo "$releases" | jq -r --arg tag "$RELEASE_TAG" \
              'first(.[][] | select(.tag_name == $tag and .draft == true)).id // empty'
          )"
          if [ -n "$draft_id" ]; then
            echo "Reusing draft release ${draft_id} for ${RELEASE_TAG}."
            jq -n \
              --arg tag "$RELEASE_TAG" \
              --arg sha "$TARGET_SHA" \
              '{tag_name: $tag, target_commitish: $sha, name: $tag, draft: true, prerelease: true}' \
            | gh api --method PATCH \
                "repos/${REPOSITORY}/releases/${draft_id}" \
                --input - >/dev/null

            gh api --paginate \
              "repos/${REPOSITORY}/releases/${draft_id}/assets?per_page=100" \
              --jq '.[].id' \
            | while read -r asset_id; do
                echo "Deleting stale draft asset ${asset_id}."
                gh api --method DELETE \
                  "repos/${REPOSITORY}/releases/assets/${asset_id}"
              done
          else
            draft_id="$(
              jq -n \
                --arg tag "$RELEASE_TAG" \
                --arg sha "$TARGET_SHA" \
                --arg body "$release_body" \
                '{
                  tag_name: $tag,
                  target_commitish: $sha,
                  name: $tag,
                  draft: true,
                  prerelease: true,
                  body: $body
                }' \
              | gh api --method POST \
                  "repos/${REPOSITORY}/releases" \
                  --input - \
                  --jq '.id'
            )"
          fi

          if [ "$SOURCE_FIRST" = "true" ]; then
            echo "Source-first release: publishing without assets; the tag-push run attaches them."
          else
            mapfile -t asset_files < <(
              find ./assets -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' | sort
            )
            asset_files+=("./assets/SHA256SUMS.txt")
            for asset in "${asset_files[@]}"; do
              name="$(basename "$asset")"
              encoded_name="$(jq -rn --arg name "$name" '$name | @uri')"
              echo "Uploading ${name}."
              curl --fail --silent --show-error \
                --request POST \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header "Content-Type: application/octet-stream" \
                --data-binary "@${asset}" \
                --output /dev/null \
                "https://uploads.github.com/repos/${REPOSITORY}/releases/${draft_id}/assets?name=${encoded_name}"
            done
          fi

          html_url="$(
            gh api --method PATCH "repos/${REPOSITORY}/releases/${draft_id}" \
              --field draft=false \
              --jq '.html_url'
          )"
          echo "Published ${html_url}; tag ${RELEASE_TAG} now points to ${TARGET_SHA}."

      # Dispatched rather than called: crates.io matches its Trusted Publisher
      # configuration against the OIDC `workflow_ref` claim, which names the
      # workflow a run starts from, so a `workflow_call` here would present
      # create-release.yml as the publishing identity instead of
      # publish-crates.yml.
      #
      # Always --ref main, including for a hotfix release: publish-crates.yml
      # resolves and checks out the tag on its own, so the crates-io
      # environment stays restricted to main.
      #
      # This only queues the upload. A crates-io environment reviewer approves
      # it, in its own concurrency group, so a release left awaiting that
      # decision never holds this workflow open.
      - name: Dispatch crates.io publishing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          PUBLISH_CRATES: ${{ inputs.publish_crates }}
          UNPUBLISHABLE_GRAPH: ${{ inputs.allow_unpublishable_crate_graph && 'true' || 'false' }}
        run: |
          set -euo pipefail

          skip_reason=""
          if [ "$UNPUBLISHABLE_GRAPH" = "true" ]; then
            # This override means the publish graph does not resolve, so the
            # release is GitHub-only by definition.
            skip_reason="allow_unpublishable_crate_graph was set, so this release must not publish crates"
          else
            case "$PUBLISH_CRATES" in
              never)
                skip_reason="publish_crates was set to never"
                ;;
              always) ;;
              auto)
                case "$RELEASE_TAG" in
                  # Release candidates decide per release, so auto leaves them
                  # to an explicit dispatch.
                  *-*) skip_reason="publish_crates is auto and ${RELEASE_TAG} is a release candidate" ;;
                esac
                ;;
              *)
                echo "Unexpected publish_crates value: ${PUBLISH_CRATES}" >&2
                exit 1
                ;;
            esac
          fi

          workflow_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/publish-crates.yml"
          if [ -n "$skip_reason" ]; then
            echo "Not dispatching crates.io publishing: ${skip_reason}."
            {
              echo "## Crates.io"
              echo
              echo "Not dispatched: ${skip_reason}."
              echo
              echo "To publish later, run [\`Publish crates\`](${workflow_url}) from \`main\`"
              echo "with \`mode: publish\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          gh workflow run publish-crates.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f release_tag="$RELEASE_TAG" \
            -f mode=publish
          echo "Dispatched crates.io publishing for ${RELEASE_TAG}."
          {
            echo "## Crates.io"
            echo
            echo "Dispatched [\`Publish crates\`](${workflow_url}) for \`${RELEASE_TAG}\`."
            echo "It waits for a \`crates-io\` environment reviewer before uploading."
          } >> "$GITHUB_STEP_SUMMARY"
