# Adopting a reset retires each obsolete round without the queue removing
# or releasing it, so the reactor reports the round retired while the
# queue still holds it.
# The queue, the reactor and the planner decide when the witness's round
# starts and retires around the reset, so a change there can move the
# witness off it.
checks = ["crates/zakura-network/src/zakura/header_sync"]

[typed]
harness = "header-sync/storage"
scenario = "crates/zakura-sim/tests/fixtures/header-reset-held-prepare.json"
plan = "crates/zakura-sim/tests/fixtures/header-reset-held-prepare.plan"
