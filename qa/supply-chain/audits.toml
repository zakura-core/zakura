[[audits.encode_unicode]]
who = "OpenAI Codex <noreply@openai.com>"
criteria = "safe-to-deploy"
version = "0.3.6"
notes = "Reviewed all packaged source, manifests, tests, and benchmark. Safe UTF-8 and UTF-16 constructors validate lengths, continuation bytes, overlong forms, surrogate ranges, and scalar bounds before reaching unchecked constructors; transmute and pointer operations preserve their documented invariants, and public unchecked constructors require the caller to uphold them. There is no build script or runtime ambient capability; the benchmark alone embeds a host dictionary at compile time when explicitly built. With two obsolete test-only calls that violate their unchecked APIs' slice-length contracts removed from the temporary harness, 26 integration tests, 54 doctests, the ASCII feature, the no_std library target, and an exhaustive sweep over every valid Unicode scalar passed. The obsolete optional Clippy compiler-plugin feature no longer builds on modern Rust."

