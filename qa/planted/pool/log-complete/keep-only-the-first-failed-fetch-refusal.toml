# Keeps the first failed fetch's refusal and drops every later one, in the
# core task. The script fails the same fetch twice, so a check that only
# asks whether a transaction's refusal was ever read misses the second.
input = "crates/zakura-sim/tests/fixtures/pool-core.bin"
# The harness drives the pool core and the storage under it.
checks = ["crates/zakura-mempool/src"]
