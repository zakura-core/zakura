name: Rust script compatibility

on:
  pull_request:
    paths:
      - 'crates/zcash-script/**'
      - 'crates/zakura-script/**'
      - 'crates/zakura-consensus/**'
      - 'qa/script-oracle/**'
      - 'scripts/check-script-dependencies.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/script-oracle.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CXXFLAGS: -include cstdint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          cache-key: script-oracle
      - uses: ./.github/actions/setup-zakura-build
      - name: Check release script dependencies
        run: python3 scripts/check-script-dependencies.py
      - name: Test Rust execution and counting
        run: cargo test --locked -p zcash_script -p zakura-script
      - name: Compare C++ and Rust
        run: cargo test --locked --manifest-path qa/script-oracle/Cargo.toml
      - name: Replay the saved transaction fixture
        run: cargo run --locked --manifest-path qa/script-oracle/Cargo.toml --example replay -- qa/script-oracle/fixtures/script-tx.jsonl
