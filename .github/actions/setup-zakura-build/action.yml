name: 'Setup Zakura Build Environment'
description: 'Install RocksDB as a system library, and optionally libclang and protoc'
inputs:
  libclang:
    description: >-
      Also install clang and libclang. Current Zakura builds don't need them,
      because zakura-librocksdb-sys 0.17.7 and later commit their bindings.
      Builds of crates published before that, such as cargo-semver-checks
      baselines, still run bindgen.
    required: false
    default: 'false'
  protoc:
    description: >-
      Also install protoc. Only `cargo xtask check-rpc-artifacts` and
      `cargo xtask generate-rpc-artifacts` need it: builds use the checked-in
      generated code.
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    - name: Verify prepared temporary runner packages
      if: runner.os == 'Linux' && vars.TEMPORARY_PR_CI == 'true' && startsWith(runner.name, 'zakura-ci-temporary-')
      shell: bash
      env:
        INSTALL_LIBCLANG: ${{ inputs.libclang }}
        INSTALL_PROTOC: ${{ inputs.protoc }}
      run: |
        packages=(librocksdb-dev)
        if [[ "$INSTALL_LIBCLANG" == true ]]; then
          packages+=(clang libclang-dev)
        fi
        if [[ "$INSTALL_PROTOC" == true ]]; then
          packages+=(protobuf-compiler)
        fi
        for package in "${packages[@]}"; do
          dpkg-query -W -f='${Status}\n' "$package" | grep -qx 'install ok installed'
        done
        echo 'ROCKSDB_LIB_DIR=/usr/lib/x86_64-linux-gnu' >> "$GITHUB_ENV"

    - name: Install librocksdb-dev on Ubuntu
      if: runner.os == 'Linux' && !(vars.TEMPORARY_PR_CI == 'true' && startsWith(runner.name, 'zakura-ci-temporary-'))
      shell: bash
      env:
        INSTALL_LIBCLANG: ${{ inputs.libclang }}
        INSTALL_PROTOC: ${{ inputs.protoc }}
      run: bash "$GITHUB_ACTION_PATH/install-ubuntu-packages.sh"

    - name: Install RocksDB on macOS
      if: runner.os == 'macOS'
      shell: bash
      env:
        INSTALL_PROTOC: ${{ inputs.protoc }}
      run: |
        brew install rocksdb
        if [[ "${INSTALL_PROTOC}" == 'true' ]]; then
          brew install protobuf
        fi
        # Set ROCKSDB_LIB_DIR for both Intel and Apple Silicon Macs
        if [ -d "/opt/homebrew/lib" ]; then
          echo "ROCKSDB_LIB_DIR=/opt/homebrew/lib" >> $GITHUB_ENV
        else
          echo "ROCKSDB_LIB_DIR=/usr/local/lib" >> $GITHUB_ENV
        fi

    - name: Install protoc on Windows
      if: runner.os == 'Windows' && inputs.protoc == 'true'
      shell: bash
      run: |
        choco install protoc -y
