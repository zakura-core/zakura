[[audits.socket2]]
who = "Claude Opus 5 <noreply@anthropic.com>"
criteria = "safe-to-deploy"
version = "0.5.10"
notes = "The crate is a thin, explicitly-unsafe-at-the-edges wrapper over the platform socket API: almost all of its unsafe is a libc or Winsock call plus the sockaddr storage handling around it. That handling is the part that matters and it holds up: every accept, recv-from, and getsockname path passes the capacity in and uses the length the kernel writes back rather than the buffer size, address conversions check the family before reinterpreting the storage, and socket options pass the size of the exact type being read. Sockets are owned by an OwnedFd or SOCKET handle so a descriptor is closed once, and there is no build script. All 16 tests passed with all features."

