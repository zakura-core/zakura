# The node drops a relayed record whose signature doesn't verify instead of
# closing. The scenario's peer relays a record signed over another body.
# Besides the files the patch changes, the rest of discovery decides whether
# the frame reaches the bypass.
checks = ["crates/zakura-network/src/zakura/discovery"]

[typed]
harness = "discovery/wire"
scenario = "qa/planted/discovery/s4v2/peers/bad-content-closes/drop-forged-relay.scenario.json"
plan = "qa/planted/discovery/s4v2/peers/bad-content-closes/drop-forged-relay.plan.bin"
