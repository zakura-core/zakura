# The corrupted-best-score mutation on the harness-commit witness, where
# the node has nothing to fetch and a harness commit straight into its
# engine is the only apply inside the run: after its install, the stored
# header-best score keeps the selected tip's hash but takes its parent's
# suffix work. The commit's engine run, which the port's harness-commit
# hook records and no storage fact carries, is judged like an apply's.
# The storage adapter and the engine decide how the commit installs, so a
# change there can move the witness off it.
checks = ["crates/zakura-storage/src/header", "crates/zakura-header-chain/src/transition", "crates/zakura-header-chain/src/graph"]

[typed]
harness = "header-sync/storage"
scenario = "crates/zakura-sim/tests/fixtures/header-authority-harness-commit.json"
plan = "crates/zakura-sim/tests/fixtures/header-authority-harness-commit.plan"
