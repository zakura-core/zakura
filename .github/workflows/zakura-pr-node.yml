name: PR smoke diagnostics
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [pr945, pr944-main]
        default: pr945
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/do-cli
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          ssh_private_key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
      - name: Read only the task-owned test node
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            pr945) ID=599550693; IP=157.230.182.55; NAME=zakura-pr-343dec5790b9318528bed191-34566433184 ;;
            pr944-main) ID=599552320; IP=68.183.97.2; NAME=zakura-pr-pr944-34567198563 ;;
            *) exit 1 ;;
          esac
          doctl compute droplet get "$ID" -o json | jq -e --arg name "$NAME" --arg ip "$IP" '.[0] | .name == $name and any(.networks.v4[]; .ip_address == $ip)' > /dev/null
          mkdir -p /tmp/inspect
          ssh -i /tmp/do_ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new "root@$IP" 'python3 -' > /tmp/inspect/live.txt <<'PY'
          from pathlib import Path
          import json,subprocess,urllib.request
          print(subprocess.check_output(['systemctl','show','zakurad','--property=ActiveState,NRestarts,ExecStart'],text=True))
          p=Path('/var/log/zakura/zakura.log')
          if p.exists():
              lines=subprocess.check_output(['tail','-n','500',str(p)],text=True).splitlines()
              print('\n'.join(line for line in lines if 'ZakuradConfig' not in line))
          for port in (9999,19999):
              try:
                  with urllib.request.urlopen(f'http://127.0.0.1:{port}/metrics',timeout=5) as r: data=r.read().decode()
                  print(f'METRICS {port}')
                  print('\n'.join(x for x in data.splitlines() if not x.startswith('#') and any(k in x for k in ['sync_block','sync_zakura','peer_','state_vct','header_'])))
              except Exception as e: print(str(e))
          PY
          scp -r -i /tmp/do_ssh -o BatchMode=yes -o ConnectTimeout=10 "root@$IP:/root/out/paired" /tmp/inspect/ || true
          cat /tmp/inspect/live.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr-smoke-diagnostics-${{ inputs.target }}-${{ github.run_id }}
          path: /tmp/inspect/
      - name: Remove runner credential file
        if: always()
        run: rm -f /tmp/do_ssh
