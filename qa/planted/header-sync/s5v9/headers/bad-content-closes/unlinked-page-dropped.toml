# The reader drops a page the subscriber refuses for broken linkage and
# reads on, instead of closing the connection. The page never reaches the
# reactor, so nothing stages it and `commit-only-authorized` holds. Its
# input is the saved bad-content Plan, whose adversary serves the node a
# page that doesn't extend its parent, so
# `header-sync/s5v9/headers/bad-content-closes` is the only ID it breaks,
# when the run quiesces with the close still owed.
# Besides peer.rs, which the patch changes, the rest of header sync
# decides which pages the input's peer sends and when the node judges
# them. A change there can move the input off its page.
input = "crates/zakura-sim/tests/fixtures/header-wire-bad-content.bin"
checks = ["crates/zakura-network/src/zakura/header_sync", "crates/zakura-network/src/zakura/regulation"]
