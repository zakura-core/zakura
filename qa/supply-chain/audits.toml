[[audits.parity-scale-codec-derive]]
who = "OpenAI Codex <noreply@openai.com>"
criteria = "safe-to-deploy"
version = "3.7.5"
notes = "Reviewed all packaged source and manifest. The procedural macros validate compiler-supplied tokens and emit type-checked Encode, Decode, Compact, and MaxEncodedLen implementations; enum indices receive compile-time range and duplicate checks, and length sums saturate. The sole generated unsafe path is repr(transparent) decode_into: it restricts the optimization to structs with unmodified fields, asserts total size and non-ZST count, calls each field's Decode::decode_into, and returns the codec's DecodeFinished only after all fields succeed. No build script, network, process execution, or direct filesystem I/O; crate-path discovery delegates to separately policy-checked proc-macro-crate. The all-feature package compiled, and 128 exact codec tests plus 29 derive-focused functional tests passed. Four published doctests omit their runtime dev dependency, and compile-fail snapshots differed only in current rustc diagnostic wording."

[[audits.parking_lot]]
who = "Claude Opus 5 <noreply@anthropic.com>"
criteria = "safe-to-deploy"
version = "0.12.5"
notes = "Reviewed the manifest, the module-level documentation, and the unsafe surface, which implements the RawMutex, RawRwLock, and RawThreadId contracts that lock_api declares. The fast paths are a single compare-exchange on a state word and the slow paths hand off to parking_lot_core's parking lot, with the fair-unlock and timeout variants each restoring the state word on every exit. There is no build script and no ambient capability beyond thread parking. All 104 tests passed with the send_guard, arc_lock, and serde features; all-features is rejected by the crate itself because send_guard and deadlock_detection are mutually exclusive."

[[audits.parking_lot_core]]
who = "Claude Opus 5 <noreply@anthropic.com>"
criteria = "safe-to-deploy"
version = "0.9.12"
notes = """Reviewed all packaged source, manifest, build script, and tests. This is the thread-parking substrate: a global hash table of wait queues keyed by address, with per-thread ThreadData allocated in thread-local storage and the platform layer implemented over futex on Linux, ulock or pthread on macOS, and WaitOnAddress on Windows. Queue nodes live on the parked thread's own stack and are unlinked before that thread returns, and the table resizes by rehashing under all bucket locks rather than in place. The build script only turns cfg(sanitize = "thread") into an internal cfg. All 12 tests passed with all features."""

