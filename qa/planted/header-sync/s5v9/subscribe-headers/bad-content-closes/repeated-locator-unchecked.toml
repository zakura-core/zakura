# The `SubscribeHeaders` decoder no longer refuses an `Open` that repeats
# a locator, so the publisher takes the adversary's bad `Open` and the
# node keeps the connection open. Its input is the focused scenario of an
# `Open` that repeats a locator, so
# `header-sync/s5v9/subscribe-headers/bad-content-closes` is the only ID
# it breaks.
# Besides the files the patch changes, the rest of these decide which
# frames the input's peers send and when the node judges them. A change
# there can move the input off its frame.
checks = ["crates/zakura-network/src/zakura/header_sync", "crates/zakura-network/src/zakura/regulation"]

[typed]
harness = "header-sync/wire"
scenario = "crates/zakura-sim/tests/fixtures/header-wire-planted-subscribe-headers-bad-content.json"
plan = "crates/zakura-sim/tests/fixtures/header-wire-default.plan"
