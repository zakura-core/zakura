# Releases a finished submission by its height instead of by its token and
# owner: the newest submission at the height goes, whichever owner it has.
# The input resets the chain while storage holds a submission, so that
# submission's late verdict reaches block sync as a stale completion and
# releases the fork's submission at the same height, which storage still
# holds.
input = "crates/zakura-sim/tests/fixtures/block-sync-stale-beside-current.bin"
# Besides sequencer.rs, which the patch changes, the rest of block sync
# decides when the stale verdict arrives. A change there can move the input
# off the shared height.
checks = ["crates/zakura-network/src/zakura/block_sync"]
