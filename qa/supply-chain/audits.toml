[[audits.arc-swap]]
who = "Claude Opus 5 <noreply@anthropic.com>"
criteria = "safe-to-deploy"
version = "1.9.2"
notes = "Reviewed all packaged source, manifest, and tests. The crate swaps an Arc atomically without a lock, and its correctness rests on the debt-list protocol: a reader registers a debt slot before it clones the pointer, and a writer that swaps the pointer pays off any outstanding debt by incrementing the refcount on the reader's behalf before it drops its own reference. That protocol is documented and the unsafe sites each name the part of it they depend on. Generation counters make the fallback path take a lock rather than spin forever under contention. There is no build script and no ambient capability. All 84 tests passed."

