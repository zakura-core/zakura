[[audits.yoke]]
who = "Claude Opus 5 <noreply@anthropic.com>"
criteria = "safe-to-deploy"
version = "0.8.3"
notes = "Reviewed all packaged source, manifest, and tests. Yoke is the lifetime-erasure mechanism the ICU stack is built on, so it is unsafe by nature: it stores data borrowed from a cart alongside the cart itself and hands out that data with a lifetime derived from the Yoke rather than the original borrow. The Yokeable trait that makes this sound is unsafe, its obligation is stated as the type being covariant in its lifetime with no other lifetime-dependent behaviour, and the derive generates the impl rather than leaving it to hand. Projection functions take a closure that cannot capture a shorter-lived borrow. There is no build script. All 58 tests passed."

