    "crates/zakura-network/src/zakura/discovery/requester.rs",
    "crates/zakura-network/src/zakura/discovery/requester",
    "crates/zakura-network/src/zakura/discovery/protocol.rs",
    "crates/zakura-network/src/zakura/discovery/peer.rs",
    "crates/zakura-network/src/zakura/discovery/wire.rs",
]
witnesses = [
    { test = "hello_acts_apply_in_their_witnesses", test_target = "discovery_wire_witness" },
    { test = "get_peers_acts_apply_in_their_witnesses", test_target = "discovery_wire_witness" },
    { test = "peers_acts_apply_in_their_witnesses", test_target = "discovery_wire_witness" },
    { test = "get_services_acts_apply_in_their_witnesses", test_target = "discovery_wire_witness" },
    { test = "services_acts_apply_in_their_witnesses", test_target = "discovery_wire_witness" },
    { test = "conformant_controls_hold_conformant_never_closes", test_target = "discovery_wire_witness" },
    { test = "answers_within_their_requests_hold_sender_within_owed", test_target = "discovery_wire_witness" },
]

