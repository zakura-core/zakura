[package]
name = "zakura-storage"
version = "0.1.0"
authors.workspace = true
description = "Controllable storage for Zakura's P2P simulator. Internal test crate, not published"
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories = ["development-tools::testing"]
# Only the simulator will depend on it, and no published crate does.
publish = false

[features]
# Direct full-state writes for zakurad's driver fidelity test, whose fakes
# stand in for zakura-state's writer and verifier.
driver-fidelity = []

[dependencies]
chrono = { workspace = true }
futures = { workspace = true }
sha2 = { workspace = true }
zakura-chain = { path = "../zakura-chain" }
zakura-header-chain = { path = "../zakura-header-chain" }
zakura-network = { path = "../zakura-network" }
zakura-node-services = { path = "../zakura-node-services" }
zakura-rt = { path = "../zakura-rt" }

[dev-dependencies]
# A paused clock for the lease idle-deadline tests.
tokio = { workspace = true, features = ["macros", "rt", "test-util", "time"] }
zakura-test = { path = "../zakura-test" }

# The real scheduler, for tests that stop a task at each of its scheduling
# points and act as the run would there.
[target.'cfg(zakura_sim)'.dev-dependencies]
zakura-scheduler = { path = "../zakura-scheduler" }

# The block-sync routine's body checks and payload decoder, for the fixture
# tests, and detached range-read leases, for the block service's tests. The
# simulator build exposes them without the feature, which doesn't compile
# there.
[target.'cfg(not(zakura_sim))'.dev-dependencies]
zakura-network = { path = "../zakura-network", features = ["zakura-testkit"] }

[lints]
workspace = true
