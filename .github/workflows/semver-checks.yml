# Gate PRs on cargo-semver-checks against the latest STABLE crates.io release
# of each changed publishable workspace crate and its publishable reverse
# dependencies. A PR that changes a published API must carry the corresponding
# version bump in the same PR — the check passes once the bump level covers the
# change, so an intentional break plus its major bump is green, and a second
# break in the same cycle needs no further bump.
#
# Retro driver: v1.0.3 shipped with semver debt discovered on release day
# (#361 forced zakura-chain 2.0.0 / zakura-consensus 4.0.0 / zakura-script
# 2.0.0 mid-incident). This job settles bump levels when the change merges,
# not when the release is being cut.
#
# Notes:
# - `--default-features` matches the documented release-prep invocation and
#   keeps optional heavy features (e.g. lightwalletd-grpc-tests and its
#   protoc dependency) out of the rustdoc builds. Feature-gated public APIs
#   are not semver-checked, mirroring existing release practice.
# - publish = false members (xtask, zakura-watchdog) are skipped automatically.
# - A NEW publishable crate that has never been published to crates.io fails
#   with "no baseline": add `--exclude <crate>` to the check command in the
#   same PR that introduces the crate, and remove it after its first publish.
# - Baseline downloads come from crates.io; an outage fails the job
#   (deliberately fail-closed — re-run when the registry recovers).
name: Semver checks

on:
  pull_request:
    branches: [main, "feat/**", "release/**"]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - .github/workflows/semver-checks.yml
      - .github/workflows/scripts/affected_semver_packages.py
      - .github/workflows/scripts/test_affected_semver_packages.py
  push:
    branches: [main]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - .github/workflows/semver-checks.yml
      - .github/workflows/scripts/affected_semver_packages.py
      - .github/workflows/scripts/test_affected_semver_packages.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  select-packages:
    name: Select semver packages
    runs-on: ubuntu-latest
    outputs:
      baseline_tag: ${{ steps.affected.outputs.baseline_tag }}
      has_packages: ${{ steps.affected.outputs.has_packages }}
      packages: ${{ steps.affected.outputs.packages }}
      packages_json: ${{ steps.affected.outputs.packages_json }}
      public_api_packages_json: ${{ steps.affected.outputs.public_api_packages_json }}
      has_public_api_packages: ${{ steps.affected.outputs.has_public_api_packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find crates affected by this change
        id: affected
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 .github/workflows/scripts/test_affected_semver_packages.py

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            packages="$(
              python3 .github/workflows/scripts/affected_semver_packages.py \
                --base "$BASE_SHA" \
                --head "$GITHUB_SHA"
            )"
          else
            # Trusted main runs populate reusable rustdoc JSON for the latest
            # stable crates.io baselines. Check every publishable crate so one
            # cache entry can warm any package selected by a later PR.
            packages="$(
              python3 .github/workflows/scripts/affected_semver_packages.py --all
            )"
          fi

          packages_json="$(
            printf '%s\n' "$packages" \
              | jq --raw-input --slurp --compact-output \
                'split("\n") | map(select(length > 0))'
          )"
          # The release preparation has always limited the independent
          # public-API evidence to library crates in its crate bump plan;
          # `zakura` is versioned separately from that plan.
          public_api_packages_json="$(
            jq --compact-output 'map(select(. != "zakura"))' <<<"$packages_json"
          )"
          has_public_api_packages="$(
            jq --raw-output 'length > 0' <<<"$public_api_packages_json"
          )"

          {
            echo "baseline_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*')"
            echo "has_packages=$([[ -n "$packages" ]] && echo true || echo false)"
            echo "has_public_api_packages=$has_public_api_packages"
            echo "packages<<EOF"
            echo "$packages"
            echo "EOF"
            echo "packages_json=$packages_json"
            echo "public_api_packages_json=$public_api_packages_json"
          } >> "$GITHUB_OUTPUT"

          if [[ -n "$packages" ]]; then
            echo "Checking affected packages:"
            echo "$packages"
          else
            echo "No publishable crates need semver checks."
          fi

  check-package:
    name: semver (${{ matrix.package }})
    if: >-
      github.event_name == 'pull_request'
      && needs.select-packages.outputs.has_packages == 'true'
    needs: select-packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.select-packages.outputs.packages_json) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 #v1.17.0
        id: toolchain
        with:
          toolchain: stable
          # cargo-semver-checks removes its temporary build directories after
          # producing rustdoc JSON. Cache that small final output rather than
          # retaining unrelated Cargo registry and target artifacts.
          cache: false

      # cargo-semver-checks reuses generated baseline rustdoc JSON from
      # target/semver-checks/cache (~1-2 MB per crate baseline; a hit skips
      # that baseline's download and rustdoc build entirely). Keyed on the
      # rustc version because the rustdoc JSON format rotates with the
      # toolchain, and on the last release tag because published baselines
      # remain immutable until the next release.
      - name: Restore baseline rustdoc cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: target/semver-checks/cache
          key: semver-baselines-${{ steps.toolchain.outputs.cachekey }}-${{ needs.select-packages.outputs.baseline_tag }}
          restore-keys: semver-baselines-${{ steps.toolchain.outputs.cachekey }}-

      # Deliberately unpinned (like cargo-hack): cargo-semver-checks must
      # track new stable rustdoc formats; pin only if a regression forces it.
      - uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd #v2.84.1
        with:
          tool: cargo-semver-checks

      - uses: ./.github/actions/setup-zakura-build

      - name: Check package against its stable crates.io baseline
        env:
          PACKAGE: ${{ matrix.package }}
        run: cargo semver-checks --package "$PACKAGE" --default-features

      - name: Explain the failure
        if: failure()
        run: |
          cat >&2 <<'EOF'
          cargo-semver-checks found published-API changes not covered by a
          version bump. Either bump the affected crate in THIS PR to the
          level the report requires:

            cargo release version --verbose --execute --allow-branch '*' -p <crate> major|minor

          (this also rewrites workspace-internal dependency requirements),
          or revert the API change if it was accidental. See
          docs/changelog/guidelines.md ("Library crates") and the release
          checklist ("Update Crate Versions").
          EOF

  public-api-diff:
    name: public API (${{ matrix.package }})
    if: >-
      github.event_name == 'pull_request'
      && startsWith(github.head_ref, 'release/v')
      && needs.select-packages.outputs.has_public_api_packages == 'true'
    needs: select-packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.select-packages.outputs.public_api_packages_json) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 #v1.17.0
        with:
          toolchain: stable
          cache: false

      - uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd #v2.84.1
        with:
          tool: cargo-public-api

      - uses: ./.github/actions/setup-zakura-build

      - name: Install nightly rustdoc toolchain
        run: rustup toolchain install nightly --profile minimal

      - name: Diff against the latest published API
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          # cargo-public-api builds both the current and published crate with
          # nightly. Nightly-only warnings are evidence, not the lint gate.
          RUSTFLAGS='' cargo public-api diff latest -p "$PACKAGE" -sss

  warm-baselines:
    name: Warm semver baselines
    if: >-
      github.event_name != 'pull_request'
      && needs.select-packages.outputs.has_packages == 'true'
    needs: select-packages
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 #v1.17.0
        id: toolchain
        with:
          toolchain: stable
          cache: false

      - name: Restore baseline rustdoc cache
        id: baseline-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: target/semver-checks/cache
          key: semver-baselines-${{ steps.toolchain.outputs.cachekey }}-${{ needs.select-packages.outputs.baseline_tag }}
          restore-keys: semver-baselines-${{ steps.toolchain.outputs.cachekey }}-

      - uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd #v2.84.1
        with:
          tool: cargo-semver-checks

      - uses: ./.github/actions/setup-zakura-build

      - name: Check all crates against stable crates.io baselines
        env:
          PACKAGES: ${{ needs.select-packages.outputs.packages }}
        run: |
          while IFS= read -r package; do
            [[ -n "$package" ]] || continue
            cargo semver-checks --package "$package" --default-features
          done <<< "$PACKAGES"

      - name: Save baseline rustdoc cache
        if: >-
          github.ref == 'refs/heads/main'
          && steps.baseline-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: target/semver-checks/cache
          key: semver-baselines-${{ steps.toolchain.outputs.cachekey }}-${{ needs.select-packages.outputs.baseline_tag }}

      - name: Explain the failure
        if: failure()
        run: |
          cat >&2 <<'EOF'
          cargo-semver-checks failed while warming the latest release
          baselines. Review the package report above before retrying.
          EOF

  semver-checks:
    name: semver-checks
    if: always()
    needs: [select-packages, check-package, public-api-diff, warm-baselines]
    runs-on: ubuntu-latest
    steps:
      - name: Check semver job results
        env:
          CHECK_RESULT: ${{ needs.check-package.result }}
          EVENT_NAME: ${{ github.event_name }}
          HAS_PACKAGES: ${{ needs.select-packages.outputs.has_packages }}
          HAS_PUBLIC_API_PACKAGES: ${{ needs.select-packages.outputs.has_public_api_packages }}
          PUBLIC_API_RESULT: ${{ needs.public-api-diff.result }}
          RELEASE_PR: ${{ startsWith(github.head_ref, 'release/v') }}
          SELECT_RESULT: ${{ needs.select-packages.result }}
          WARM_RESULT: ${{ needs.warm-baselines.result }}
        run: |
          if [[ "$SELECT_RESULT" != "success" ]]; then
            echo "Package selection failed: $SELECT_RESULT" >&2
            exit 1
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$HAS_PACKAGES" == "true" && "$CHECK_RESULT" != "success" ]]; then
              echo "Package checks failed: $CHECK_RESULT" >&2
              exit 1
            fi
            if [[ "$RELEASE_PR" == "true" && "$HAS_PUBLIC_API_PACKAGES" == "true" \
              && "$PUBLIC_API_RESULT" != "success" ]]; then
              echo "Public API diffs failed: $PUBLIC_API_RESULT" >&2
              exit 1
            fi
          elif [[ "$WARM_RESULT" != "success" ]]; then
            echo "Baseline warmer failed: $WARM_RESULT" >&2
            exit 1
          fi
