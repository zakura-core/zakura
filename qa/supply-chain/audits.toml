criteria = "safe-to-deploy"
version = "1.11.1+lz4-1.10.0"
notes = "The build script is the whole capability here: it compiles C sources shipped inside the package with cc and links the result, so building this crate runs a C toolchain over vendored third-party code. It fetches nothing and reads nothing outside the package and the environment variables it documents. The vendored tree declares LZ4 version 1.10.0, matching the version metadata in the crate version. The Rust side is extern declarations plus a thin frame-API wrapper with nine unsafe expressions. Auditing the bundled C beyond confirming its provenance is out of scope for this review and is noted here so the record is not read as covering it. All 2 tests passed."

