# The committed fuzz input `block-sync-stale-beside-current.bin`: the
# harness that runs it, the generator version it was built for, and its
# SHA-256. Its first two bytes, `ff 06`, pick the stale-beside-current
# scenario: a reset detaches a held submission, whose late retryable verdict
# reaches block sync while the fork's first submission waits in storage.
# Seed 1 of the seeded `ff 06` search is the first input that holds with the
# trigger history and that `release-by-height.patch` violates alone.
harness = "block-sync/storage"
generator = 2
sha256 = "405d12ec41e2cea406bae77fd39165a4f62cb470784fc2d437b68f6e99b07a4e"
scenario_sha256 = "13f1c8625d6873bc5a9b0708d870f1f50f7a1ad47cc56261af6228044ba03a8f"
source = "crates/zakura-sim/tests/block_semantic_properties.rs"

[[witness]]
property = "block-sync/stale-completion-inert"
expect = "holds"

[[witness]]
property = "block-sync/detached-submission-bounded"
expect = "holds"
