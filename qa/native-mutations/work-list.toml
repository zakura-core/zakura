[[entry]]
id = "shared-wire-path"
kind = "shared-wire-path"
claim = "The transport closes a session on a frame its table's rules refuse, and only on one."
# The checker side, which a patch reads and never changes.
check = ["crates/zakura-sim/src/peer/content.rs", "crates/zakura-sim/src/model/consequence.rs", "crates/zakura-sim/src/table.rs"]
shared = [
    "crates/zakura-network/src/zakura/transport/message_rule.rs",
    "crates/zakura-network/src/zakura/transport/message_rule",
    "crates/zakura-network/src/zakura/transport/pipe.rs",
    "crates/zakura-network/src/zakura/transport/session.rs",
    "crates/zakura-network/src/zakura/handler.rs",
]
# Each table's witness, which the runner runs once per shared-path patch.
# The block-sync harness's relay checks each header but never runs
# `admit_inbound_message` (handler.rs), so a break to that admission step
# (its size check, cadence charge and row `expect`) reaches stream 6 only
# in production. Its runs count only through discovery/s4v2.
tables = [
    { table = "block-sync/s6v3", witness = { test = "each_probe_fault_reaches_its_exact_id", test_target = "block_table" } },
    { table = "discovery/s4v2", witness = { test = "hello_acts_apply_in_their_witnesses", test_target = "discovery_wire_witness" } },
]

[[entry]]
id = "block-sync-table"
kind = "protocol-table"
table = "block-sync/s6v3"
claim = "Block sync's serving session and routine enforce stream 6's rules: they close on refused frames and send only what the table allows."
check = ["crates/zakura-sim/src/peer/content.rs", "crates/zakura-sim/src/model/consequence.rs", "crates/zakura-sim/src/table.rs"]
shared = []
code = [
    "crates/zakura-network/src/zakura/block_sync/wire.rs",
    "crates/zakura-network/src/zakura/block_sync/wire",
    "crates/zakura-network/src/zakura/block_sync/regulated",
    "crates/zakura-network/src/zakura/block_sync/peer_routine",
    "crates/zakura-network/src/zakura/block_sync/request.rs",
]
witnesses = [
    { test = "each_probe_fault_reaches_its_exact_id", test_target = "block_table" },
    { test = "faults_inside_the_nodes_exchange_reach_their_exact_ids", test_target = "block_table" },
    { test = "requests_past_twice_the_serving_limit_reach_over_margin", test_target = "block_table" },
    { test = "honest_runs_hold_every_generated_id_they_reach", test_target = "block_table" },
    { test = "old_chain_bodies_after_a_reset_hold_receiver_work_authorized", test_target = "block_table" },
    { test = "the_stale_request_body_input_holds_receiver_work_authorized", test_target = "block_table" },
]

[[entry]]
id = "discovery-table"
kind = "protocol-table"
table = "discovery/s4v2"
claim = "Discovery's serving admission, requester precheck, query claims and verdicts enforce stream 4's rules."
check = ["crates/zakura-sim/src/peer/content.rs", "crates/zakura-sim/src/model/consequence.rs", "crates/zakura-sim/src/table.rs"]
shared = []
