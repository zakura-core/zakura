# The node asks for services again as soon as each answer settles, past the
# peer's bucket. The scenario is the honest exchange.
# Besides the files the patch changes, the rest of discovery decides whether
# the frame reaches the bypass.
checks = ["crates/zakura-network/src/zakura/discovery"]

[typed]
harness = "discovery/wire"
scenario = "qa/planted/discovery/s4v2/get-services/sender-cadence/re-ask-services.scenario.json"
plan = "qa/planted/discovery/s4v2/get-services/sender-cadence/re-ask-services.plan.bin"
