generator = 2
sha256 = "91b720949bf7054f96e0fb4f40c9c61e4f76f692b52c1a9d305a61b18ab6a9de"
scenario_sha256 = "1a36944b15806be8d9162387983fb18d8bb101ce335cba8cbf2662ee12757652"
source = "crates/zakura-sim/tests/sync_harness.rs"

[[witness]]
property = "sync/block-requests-follow-headers"
