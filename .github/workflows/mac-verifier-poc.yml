name: Mac verifier POC

on:
  pull_request:
    paths:
      - 'deploy/mac-verifier/**'
      - '.github/workflows/mac-verifier-poc.yml'
      - '.github/workflows/deploy-mac-verifier.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/mac-verifier/**'
      - '.github/workflows/mac-verifier-poc.yml'
      - '.github/workflows/deploy-mac-verifier.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s deploy/mac-verifier/tests -v
      - run: bash -n deploy/mac-verifier/build.sh

  native-linux-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: af944f5194ef2e9921bc96af017629450375013c
          path: consensus-source
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: '1.97.1'
          cache: false
      - uses: ./.github/actions/setup-zakura-build
      - name: Run pinned adversarial corpus on native x86_64
        run: |
          export CARGO_TARGET_DIR="${RUNNER_TEMP}/mac-verifier-target"
          python3 deploy/mac-verifier/corpus.py \
            --source consensus-source --output "${RUNNER_TEMP}/corpus-evidence"
      - name: Upload native receipts and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mac-verifier-linux-corpus
          path: ${{ runner.temp }}/corpus-evidence
