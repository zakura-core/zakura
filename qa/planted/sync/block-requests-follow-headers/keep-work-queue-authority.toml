# Applies a new body-work epoch in the sequencer without resetting or
# reauthorizing the work queue, so its queue keeps the old epoch's
# authority and work. The input's run takes two new epochs. A request under
# the first drops before the second arrives, and after the sequencer
# applies the second, a routine takes that returned work and publishes it
# under the first. After #2321, the `reorg-submit` input's queue held only
# in-flight work when its fork arrived, with nothing to take again.
seed = "sync-storage-reorg-verdict-republish"
# Besides sequencer_task/state.rs, which the patch changes, header sync's
# apply and the rest of block sync decide what work is queued at the fork.
checks = ["crates/zakura-network/src/zakura/block_sync", "crates/zakura-network/src/zakura/header_sync"]
