# Discovery's reader skips the maximum of its `get-services` row, and
# discovery drops a `get-services` frame over that maximum instead of
# closing. Skipping the reader's check alone would leave discovery's codec
# to close. The scenario's peer sends a `GetServices` one byte over the
# row's maximum, and the node never closes for it.
# Besides the files the patch changes, the reader's read path and the rest
# of discovery decide whether the frame reaches the drop.
checks = [
    "crates/zakura-network/src/zakura/discovery",
    "crates/zakura-network/src/zakura/handler.rs",
]

[typed]
harness = "discovery/wire"
scenario = "qa/planted/discovery/s4v2/get-services/long-payload-closes/drop-long-payload.scenario.json"
plan = "qa/planted/discovery/s4v2/get-services/long-payload-closes/drop-long-payload.plan.bin"
