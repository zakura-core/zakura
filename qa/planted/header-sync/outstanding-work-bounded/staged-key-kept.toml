# Releasing a round empties its peer's staged-capacity lease list but keeps
# the key, so the next unit of work holds staged capacity for a peer with
# no active slot. The reactor and the queue decide when the witness's
# rounds run, so a change there can move the witness off it.
checks = ["crates/zakura-network/src/zakura/header_sync"]

[typed]
harness = "header-sync/storage"
scenario = "crates/zakura-sim/tests/fixtures/header-authority-forks-sharing-a-header.json"
plan = "crates/zakura-sim/tests/fixtures/header-authority-forks-sharing-a-header.plan"
