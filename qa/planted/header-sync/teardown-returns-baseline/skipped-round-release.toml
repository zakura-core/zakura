# Drops the `release_capacity` call from `PeerWorkQueue::remove`, so a
# removed round keeps its peer's reservation and the queue's lease clones,
# while the queue still reports the removal. The input's node releases a
# round whose reservation still holds headers.
input = "crates/zakura-sim/tests/fixtures/header-storage-close-relink.bin"
# Besides peer_work.rs, which the patch changes, the reactor decides when
# rounds retire. A change there can move the input off that release.
checks = ["crates/zakura-network/src/zakura/header_sync"]
