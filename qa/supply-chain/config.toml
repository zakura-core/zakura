[[exemptions.zakura-iroh]]
version = "1.1.0-rc.0"
criteria = "safe-to-deploy"
notes = "Exact-version exemption for known upstream defects: the 0.92.0 to 1.1.0 delta removed the inactive-node bound that the certified base enforced (MAX_INACTIVE_NODES and prune_inactive in the old node map survive only as a commented-out constant in src/socket/remote_map.rs), and the mapped-address tables in src/socket/mapped_addrs.rs offer insert-on-miss lookups with no removal path, while every completed handshake, inbound included, inserts an entry for the remote EndpointId that outlives the retired per-remote actor. An internet-exposed acceptor therefore retains roughly 100 to 200 bytes per distinct authenticated identity for the life of the endpoint, identities are free to generate, and the consumer cannot evict entries through the public API, so this is a remotely driven memory-exhaustion vector. The delta also retries failed path opens from an uncapped, undeduplicated pending_open_paths queue (src/socket/remote_map/remote_state.rs) that a remote can grow geometrically when the local node holds two or more client connections to it. Everything else in the delta was reviewed and found sound: no unsafe code, TLS 1.3 raw-public-key identity binding with Ed25519 verify_strict and mandatory client authentication, peer-facing datagram handling bounded by noq-owned lengths, bounded channels and pruned path lists; 120 unit, 26 doc and one integration test pass, and loopback probes with junk datagrams, wrong-identity dials, certificate-less clients and 150 fresh identities completed cleanly. Zakura accepts and will track the retained-address growth under sustained identity churn, then adopt the upstream fix when released. No additional compatibility-fork patch is planned. Zakura deduplicates pending dials and evicts duplicate connections, keeping one connection per identity, so no path-open retry change is planned for this integration. Retain this exact-version exemption while the upstream defects remain; the published compatibility package preserves the reviewed Rust source. Registry migration: the 1.1.0-rc.0 archive preserves every upstream Rust file byte for byte, renames sibling packages with exact version requirements, retains the reviewed Dalek versions, and pins relay LRU to 0.18.3. Existing defects and acceptance conditions remain unchanged."

[[exemptions.zakura-iroh-relay]]
version = "1.1.0-rc.0"
criteria = "safe-to-deploy"
notes = "Audit hold: the 0.92.0 to 1.1.0 delta adds derived Debug output that includes relay bearer tokens on ServerConfig, ClientBuilder and RelayConfig (src/main.rs, src/client.rs, src/relay_map.rs), and a probe with debug logging enabled printed a configured token, so ordinary debug logs can leak a live relay credential. The server also replaces shutdown on a duplicate identity with an uncapped inactive-client list (src/server/clients.rs), so an authorized endpoint can hold arbitrarily many same-key connections. Frame decoding is bounded at 1 MiB per WebSocket message and 64 KiB per payload, fixed-width fields are length-checked, and the key cache is bounded by its configured capacity. Zakura runs with relays disabled and without the server feature, so neither path is reachable in the node; 82 all-feature tests and 20,000 malformed-frame property cases pass. Retain the exemption until upstream redacts tokens from Debug output and bounds the inactive list; the published compatibility package preserves the reviewed Rust source. Registry migration: the 1.1.0-rc.0 archive preserves every upstream Rust file byte for byte, renames sibling packages with exact version requirements, retains the reviewed Dalek versions, and pins relay LRU to 0.18.3. Existing defects and acceptance conditions remain unchanged."

