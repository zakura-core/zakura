# A stale prepare's handler closes its peer's live subscription through
# the session's normal close. The input's prepare ends after its round
# retired, while the same peer's next round holds a live subscription.
input = "crates/zakura-sim/tests/fixtures/header-storage-stale-prepare.bin"
# Besides reactor.rs, which the patch changes, the queue and the subscriber
# decide when a round retires mid-prepare and which subscription is live. A
# change there can move the input off its stale prepare.
checks = ["crates/zakura-network/src/zakura/header_sync"]
