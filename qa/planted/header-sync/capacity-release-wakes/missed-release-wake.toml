# Returning headers to the chunk budget no longer wakes the reactor. The
# input's release comes from a completion drained at the top of the
# reactor's loop, so the turn then blocks in its `select!` with the
# waiting offer unscheduled, and only the release wake would get it back
# to the offer.
input = "crates/zakura-sim/tests/fixtures/header-release-wake.bin"
# Besides peer_work.rs, which the patch changes, the reactor's loop decides
# where in a turn the completion is drained, and the queue and the offer
# policy decide when the offer waits for room. A change there can move the
# input off its top-of-loop release.
checks = ["crates/zakura-network/src/zakura/header_sync"]
