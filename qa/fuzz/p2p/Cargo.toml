[package]
name = "zakura-p2p-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
zakura-network = { path = "../../../crates/zakura-network", features = ["p2p-fuzz"] }

[workspace]

[[bin]]
name = "discovery_book"
path = "fuzz_targets/discovery_book.rs"
test = false
doc = false
bench = false

[[bin]]
name = "discovery_state"
path = "fuzz_targets/discovery_state.rs"
test = false
doc = false
bench = false
