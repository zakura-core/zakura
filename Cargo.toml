zcash_keys = { git = "https://github.com/zakura-core/common.git", rev = "88473230387865b2b5c6770c0cfbcd943f56cbce", package = "zakura-keys" }
zcash_primitives = { git = "https://github.com/zakura-core/common.git", rev = "88473230387865b2b5c6770c0cfbcd943f56cbce", package = "zakura-primitives" }
