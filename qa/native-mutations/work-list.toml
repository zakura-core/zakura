# Each `[[no-generator]]` names `Active` IDs that no generator harness can
# reach, and why. A generator harness is one that reports the ID and doesn't
# plant its bugs (`zakura-sim generators`); every ID here has one, but its
# grammar never builds the run the ID applies to. `cargo xtask planted loop
# --generate-harness auto` gives these IDs' cases no generator lane and
# reports the reason instead. `crates/zakura-sim/tests/mutation_work_list.rs`
# checks that every in-scope `Active` ID has a generator harness or a record
# here.

[[no-generator]]
reason = "Each ID applies only when a peer sends a frame that stream 6's table refuses. block-sync/storage, the only harness that reports these IDs, draws honest mirrors only. Its hostile frames come from `ProbeSend` control steps, which no drawn scenario carries: only typed scenarios and the `block_table` tests build them. A 50-run `zakura-sim generate` on seed 11 applied none of them."
