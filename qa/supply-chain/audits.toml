[[audits.cordyceps]]
who = "Claude Opus 5 <noreply@anthropic.com>"
criteria = "safe-to-deploy"
version = "0.3.4"
notes = "Reviewed all packaged source, manifest, and tests. The crate provides intrusive lists and queues, so the unsafe surface is the Linked trait, which is unsafe and states its obligations: a node's links live at a stable address for as long as it is in a list, and the pointer conversions between a node and its links must round-trip. Given that, the list operations maintain the invariant that a node is dereferenced only while linked, and the cursor and drain paths unlink before yielding ownership. There is no build script and no ambient capability. All 69 tests passed with all features."

[[audits.core-foundation]]
