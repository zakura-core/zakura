# A frame that finds its row's cadence bucket empty is throttled, so the
# node closes the connection with `ordered_rate_limited`, instead of
# admitting the frame as an exhausted cadence must be. Every frame on the
# connection is conformant, so `conformant-never-closes`, which counts
# only fault closes and `Misbehavior`, still holds, and the case's set is
# its own ID alone. Its input is the focused scenario of 30 `Status`
# bursts, which empty the row's cadence bucket, so
# `header-sync/s5v9/status/cadence-never-closes` is the only ID it breaks.
# Besides the files the patch changes, the rest of these decide which
# frames the input's peers send and when the node judges them. A change
# there can move the input off its frame.
checks = ["crates/zakura-network/src/zakura/transport", "crates/zakura-network/src/zakura/header_sync"]

[typed]
harness = "header-sync/wire"
scenario = "crates/zakura-sim/tests/fixtures/header-wire-planted-status-burst.json"
plan = "crates/zakura-sim/tests/fixtures/header-wire-default.plan"
