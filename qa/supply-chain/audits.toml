[[audits.objc2-cloud-kit]]
who = "Claude Opus 5 <noreply@anthropic.com>"
criteria = "safe-to-deploy"
version = "0.3.2"
notes = """The crate is mechanically generated from Apple's framework headers: every method is a msg_send shim, which is why the unsafe count is enormous and why there is no hand-written logic to audit. It declares no ambient capability of its own beyond what the framework method being called does, and correctness is a claim about matching those headers rather than something reproducible from the package. It reaches this workspace only through objc2-ui-kit, which os_info depends on under cfg(target_os = "ios"), so it is not compiled for any target this workspace ships; it builds cleanly on default features. Its test target needs sibling objc2 dev-dependencies that do not resolve standalone. It defines no runnable tests."""

