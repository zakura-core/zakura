# The `Status` decoder no longer refuses a work anchor above the selected
# tip, so the node takes the adversary's bad `Status` as conformant and
# keeps the connection open. Its input is the focused scenario of a
# `Status` whose work anchor is above its selected tip, so
# `header-sync/s5v9/status/bad-content-closes` is the only ID it breaks.
# Besides the files the patch changes, the rest of these decide which
# frames the input's peers send and when the node judges them. A change
# there can move the input off its frame.
checks = ["crates/zakura-network/src/zakura/header_sync"]

[typed]
harness = "header-sync/wire"
scenario = "crates/zakura-sim/tests/fixtures/header-wire-planted-status-bad-content.json"
plan = "crates/zakura-sim/tests/fixtures/header-wire-default.plan"
