[[audits.aead]]
who = "OpenAI Codex <noreply@openai.com>"
criteria = "safe-to-deploy"
version = "0.5.2"
notes = "Reviewed all packaged source and manifest content. This no_std crate defines authenticated-encryption traits, bounded buffer adapters, and stream constructions; stream nonces reserve the final bytes for a checked counter and reject overflow before reuse. No unsafe code, build script, runtime I/O, or ambient authority. All-feature library targets compiled; the package contains no active tests."

[[audits.anstyle]]
who = "OpenAI Codex <noreply@openai.com>"
criteria = "safe-to-deploy"
