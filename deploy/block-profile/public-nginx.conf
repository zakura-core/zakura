# Optional public access on a dedicated trial host, enabled only at the operator's request.
user www-data;
worker_processes 1;
pid /run/nginx.pid;
error_log stderr warn;

events {
    worker_connections 256;
}

http {
    server_tokens off;
    access_log off;
    client_max_body_size 1k;
    client_header_timeout 5s;
    client_body_timeout 5s;
    keepalive_timeout 10s;
    send_timeout 10s;

    limit_req_zone $binary_remote_addr zone=profile_requests:1m rate=3r/s;
    limit_req_zone $server_name zone=profile_total_requests:1m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=profile_connections:1m;
    limit_conn_zone $server_name zone=profile_total_connections:1m;

    server {
        listen 80 default_server;
        server_name _;
        limit_req zone=profile_requests burst=12 nodelay;
        limit_req zone=profile_total_requests burst=40 nodelay;
        limit_req_status 429;
        limit_conn profile_connections 8;
        limit_conn profile_total_connections 32;
        limit_conn_status 429;

        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        # Only the viewer's explicit read endpoints. No filesystem or node RPC access.
        location ~ "^/(|app\.js|style\.css|block(/[0-9a-f]{32}/[0-9]{1,20})?|api/(home|search|(attempt|trace)/[0-9a-f]{32}/[0-9]{1,20}))$" {
            proxy_pass http://127.0.0.1:8787;
            proxy_http_version 1.1;
            proxy_pass_request_headers off;
            proxy_pass_request_body off;
            proxy_set_header Host 127.0.0.1:8787;
            proxy_set_header Connection "";
            proxy_set_header Content-Length "";
            proxy_connect_timeout 2s;
            proxy_send_timeout 5s;
            proxy_read_timeout 8s;
            proxy_buffering off;
            proxy_max_temp_file_size 0;
            add_header X-Robots-Tag "noindex, nofollow" always;
            add_header Referrer-Policy no-referrer always;
        }

        location / {
            return 404;
        }
    }
}
