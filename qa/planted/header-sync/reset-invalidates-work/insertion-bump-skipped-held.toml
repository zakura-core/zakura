# As insertion-bump-skipped, on the held-apply witness, whose apply commits
# with its reply held, so the insertion's generation is judged at the
# commit, not at the later delivery. The queue, the reactor and the
# planner decide how the witness's rounds apply, so a change there can
# move the witness off it.
checks = ["crates/zakura-header-chain/src/transition"]

[typed]
harness = "header-sync/storage"
scenario = "crates/zakura-sim/tests/fixtures/header-reset-held-apply.json"
plan = "crates/zakura-sim/tests/fixtures/header-reset-held-apply.plan"
