# The requester's precheck and claim admit a `Services` with no live query, and
# discovery reads it as no answer. The scenario's peer sends a `Services` once
# the node's exchange has its answer.
# Besides the files the patch changes, the rest of discovery decides whether
# the frame reaches the bypass.
checks = ["crates/zakura-network/src/zakura/discovery"]

[typed]
harness = "discovery/wire"
scenario = "qa/planted/discovery/s4v2/services/unsolicited-closes/admit-unreserved-services.scenario.json"
plan = "qa/planted/discovery/s4v2/services/unsolicited-closes/admit-unreserved-services.plan.bin"
