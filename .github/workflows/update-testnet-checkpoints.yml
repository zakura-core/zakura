# Appends new Testnet checkpoints from the Testnet fleet and opens a draft PR.
#
# Generation runs on the self-hosted `zakura-testnet-deployer` runner on
# zakura-testnet-1, using `zakura-checkpoints` RPC mode against its local node.
# Every new hash is then cross-checked against the other fleet nodes. The PR is
# opened from a GitHub-hosted job so the release App key never reaches the
# fleet host. Mainnet checkpoints come from the release-state pipeline instead
# (update-release-state.yml and adopt-release-state.yml).
name: Update Testnet checkpoints
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate and cross-check without opening a PR"
        type: boolean
        default: false
  schedule:
    - cron: "0 5 * * 1"

permissions: {}

concurrency:
  group: update-testnet-checkpoints
  cancel-in-progress: false

env:
  CHECKPOINTS: crates/zakura-chain/src/parameters/checkpoint/test-checkpoints.txt

jobs:
  generate:
    name: Generate and cross-check new Testnet checkpoints
    if: >-
      github.repository == 'zakura-core/zakura' &&
      (github.ref == 'refs/heads/main' || inputs.dry_run)
    runs-on: [self-hosted, "${{ vars.ZAKURA_TESTNET_RUNNER_LABEL || 'zakura-testnet-deployer' }}"]
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      CARGO_TARGET_DIR: /mnt/data/zakura-deployer/checkpoints-target
      LOCAL_RPC: 127.0.0.1:18232
      # The other fleet nodes, as pinned in zakura-testnet-deploy.yml.
      CROSSCHECK_RPCS: ${{ vars.TESTNET_CHECKPOINT_CROSSCHECK_RPCS || 'http://164.92.209.78:18232 http://206.189.148.0:18232' }}
    outputs:
      has_changes: ${{ steps.generate.outputs.has_changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: stable
          cache: false

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get -qq update
          sudo apt-get -qq install -y --no-install-recommends \
            build-essential clang cmake git libclang-dev pkg-config python3

      - name: Self-test the cross-check
        run: python3 .github/scripts/crosscheck-checkpoints.py --self-test

      - name: Build zakura-checkpoints
        run: cargo build --release --locked -p zakura-utils --features zakura-checkpoints --bin zakura-checkpoints

      - name: Generate checkpoints past the committed list
        id: generate
        run: |
          set -euo pipefail
          last=$(tail -n 1 "$CHECKPOINTS" | cut -d ' ' -f 1)
          tip=$(curl -sf -m 30 -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"getblockcount","params":[]}' \
            "http://$LOCAL_RPC" | jq -er '.result')
          new="$RUNNER_TEMP/testnet-checkpoints/new-checkpoints.txt"
          mkdir -p "$(dirname "$new")"
          : > "$new"
          # zakura-checkpoints stops MAX_BLOCK_REORG_HEIGHT (1000) blocks below
          # the tip and refuses to start when that leaves nothing to scan.
          if [ $((last + 1)) -lt $((tip - 1000)) ]; then
            "$CARGO_TARGET_DIR/release/zakura-checkpoints" \
              --transport direct --addr "$LOCAL_RPC" --last-checkpoint "$last" > "$new"
          fi
          count=$(grep -c . "$new" || true)
          echo "Committed list ends at $last, local tip is $tip, $count new checkpoints." \
            | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$count" -gt 0 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cross-check new hashes against the other fleet nodes
        if: steps.generate.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          args=()
          for url in $CROSSCHECK_RPCS; do args+=(--rpc "$url"); done
          python3 .github/scripts/crosscheck-checkpoints.py \
            --checkpoints "$RUNNER_TEMP/testnet-checkpoints/new-checkpoints.txt" "${args[@]}"

      - name: Validate the extended list
        if: steps.generate.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          cat "$RUNNER_TEMP/testnet-checkpoints/new-checkpoints.txt" >> "$CHECKPOINTS"
          .github/scripts/validate-checkpoints.sh "$CHECKPOINTS"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
        if: steps.generate.outputs.has_changes == 'true'
        with:
          name: testnet-checkpoints
          path: ${{ runner.temp }}/testnet-checkpoints/new-checkpoints.txt
          retention-days: 7
          if-no-files-found: error

  open-pr:
    name: Open or update the draft PR
    needs: [generate]
    if: ${{ needs.generate.outputs.has_changes == 'true' && !inputs.dry_run && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-automation
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 #v8.0.2
        with:
          name: testnet-checkpoints
          path: ${{ runner.temp }}/testnet-checkpoints/

      # Re-validate here: the fleet host is less trusted than this runner.
      - name: Append and validate
        id: append
        run: |
          set -euo pipefail
          cat "$RUNNER_TEMP/testnet-checkpoints/new-checkpoints.txt" >> "$CHECKPOINTS"
          .github/scripts/validate-checkpoints.sh "$CHECKPOINTS"
          if [ "$(git diff --name-only HEAD)" != "$CHECKPOINTS" ] \
            || [ -n "$(git ls-files --others --exclude-standard)" ] \
            || [ "$(git diff --numstat HEAD -- "$CHECKPOINTS" | cut -f 2)" != "0" ]; then
            echo "The update must only append to $CHECKPOINTS" >&2
            exit 1
          fi
          {
            echo "from=$(git show "HEAD:$CHECKPOINTS" | tail -n 1 | cut -d ' ' -f 1)"
            echo "to=$(tail -n 1 "$CHECKPOINTS" | cut -d ' ' -f 1)"
            echo "count=$(grep -c . "$RUNNER_TEMP/testnet-checkpoints/new-checkpoints.txt")"
          } >> "$GITHUB_OUTPUT"

      - name: Create release GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 #v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # One rolling branch: an unmerged PR is refreshed in place, never duplicated.
      - name: Open or update the draft pull request
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 #v8.1.2
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: release/testnet-checkpoint-update
          base: main
          title: "chore(chain): update Testnet checkpoints"
          body: |
            TLDR: extends the Testnet checkpoint list from height ${{ steps.append.outputs.from }} to ${{ steps.append.outputs.to }}.

            Adds ${{ steps.append.outputs.count }} checkpoints generated by `zakura-checkpoints` RPC mode on zakura-testnet-1, at least 1,000 blocks below its tip. Each new hash matched at least one other Testnet fleet node, and the diff is append-only. Spot-check the last hash against an independent Testnet node or explorer before merging.
          commit-message: "chore(chain): update Testnet checkpoints to ${{ steps.append.outputs.to }}"
          sign-commits: true
          draft: always-true
          delete-branch: true
