# Refresh the embedded Mainnet checkpoint list, VCT frontier, and subtree roots from one
# immutable, digest-verified R2 bundle produced by the release-state publisher
# (deploy/release-state/), and open a draft PR for human review. Checkpoints
# are consensus-critical: nothing merges or ships from this workflow directly,
# and release creation never consults the moving R2 pointer.
# See docs/design/verified-commitment-trees.md, section 16.
name: Update Mainnet release state

on:
  workflow_dispatch:
    inputs:
      max_age_hours:
        description: "Maximum bundle age in hours"
        required: false
        default: "48"
  schedule:
    # Weekly refresh; the publisher exports daily alongside the snapshot job.
    - cron: "0 6 * * 1"

permissions: {}

concurrency:
  group: update-release-state
  cancel-in-progress: false

jobs:
  update:
    name: Import Mainnet release state
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release-automation
    permissions:
      contents: read
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
          ref: main

      - name: Self-test the release-state tooling
        run: |
          python3 .github/scripts/fetch-release-state.py --self-test
          python3 .github/scripts/import-release-state.py --self-test

      - name: Fetch one immutable bundle
        env:
          LATEST_URL: ${{ vars.MAINNET_RELEASE_STATE_LATEST_URL }}
          MAX_AGE_HOURS: ${{ inputs.max_age_hours || '48' }}
        run: |
          if [ -z "$LATEST_URL" ]; then
            echo "Set the MAINNET_RELEASE_STATE_LATEST_URL repository variable." >&2
            exit 1
          fi
          python3 .github/scripts/fetch-release-state.py \
            --latest-url "$LATEST_URL" \
            --output-dir "$RUNNER_TEMP/release-state-bundle" \
            --metadata-out "$RUNNER_TEMP/release-state-resolution.json" \
            --max-age-hours "$MAX_AGE_HOURS"

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 #v1.17.0
        with:
          toolchain: stable
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: ./.github/actions/setup-zakura-build

      # Subtree roots are interior tree nodes, so framing and append-only checks cannot prove their
      # values. Prove every required subtree artifact against its matching bundle frontier before
      # importing either file.
      - name: Prove the bundle's subtree roots against its own frontier
        env:
          BUNDLE: ${{ runner.temp }}/release-state-bundle
        run: |
          set -euo pipefail
          cargo run --release --locked -p zakura --bin zakurad -- \
            verify-historical-treestates \
            --network Mainnet \
            --subtree-input "$BUNDLE/mainnet-treestate-subtrees.bin" \
            --frontier-input "$BUNDLE/mainnet-frontier.bin"

      - name: Import checkpoints, frontier, subtrees, and provenance
        id: import
        env:
          BUNDLE: ${{ runner.temp }}/release-state-bundle
          RESOLUTION: ${{ runner.temp }}/release-state-resolution.json
        run: |
          set -euo pipefail
          python3 .github/scripts/import-release-state.py \
            --bundle "$BUNDLE" \
            --resolution "$RESOLUTION" \
            --result-out "$RUNNER_TEMP/release-state-import.json"
          jq -r '
            "has_changes=\(.has_changes)",
            "height=\(.height)",
            "block_hash=\(.block_hash)",
            "generated_at=\(.generated_at)",
            "meta_url=\(.meta_url)",
            "meta_sha256=\(.meta_sha256)"
          ' "$RUNNER_TEMP/release-state-import.json" >> "$GITHUB_OUTPUT"

      - name: Validate the imported release state
        if: steps.import.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          .github/scripts/validate-checkpoints.sh \
            crates/zakura-chain/src/parameters/checkpoint/main-checkpoints.txt
          ZAKURA_ALLOW_BOOTSTRAP_RELEASE_STATE=0 scripts/check-release-state.sh

      - name: Re-prove the checkpoint/frontier pairing in cargo
        if: steps.import.outputs.has_changes == 'true'
        run: |
          cargo test -p zakura-state --lib -- frontier sprout_change

      - name: Restrict the generated diff to release-state files
        if: steps.import.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          {
            git diff --name-only HEAD
            git ls-files --others --exclude-standard
          } | sort -u > "$RUNNER_TEMP/actual-files"
          sort > "$RUNNER_TEMP/allowed-files" <<'EOF'
          crates/zakura-chain/src/parameters/checkpoint/main-checkpoints.txt
          crates/zakura-state/src/service/finalized_state/vct/mainnet-frontier.bin
          crates/zakura-state/src/service/finalized_state/vct/mainnet-vct-manifest.json
          crates/zakura-state/src/service/finalized_state/vct/mainnet-subtrees.bin
          crates/zakurad/src/components/sync/end_of_support.rs
          EOF
          UNEXPECTED=$(comm -23 "$RUNNER_TEMP/actual-files" "$RUNNER_TEMP/allowed-files")
          if [ -n "$UNEXPECTED" ]; then
            echo "Import changed files outside the release-state allowlist:" >&2
            echo "$UNEXPECTED" >&2
            exit 1
          fi

          # The checkpoint diff must be append-only.
          REMOVED=$(git diff --numstat HEAD -- \
            crates/zakura-chain/src/parameters/checkpoint/main-checkpoints.txt | cut -f2)
          if [ "${REMOVED:-0}" != "0" ]; then
            echo "Checkpoint update removed ${REMOVED} committed lines; refusing." >&2
            exit 1
          fi
          git diff --stat HEAD

      - name: Create release GitHub App token
        if: steps.import.outputs.has_changes == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 #v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Choose the dated update branch
        if: steps.import.outputs.has_changes == 'true'
        id: update-branch
        run: echo "name=release/checkpoint-update-$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Open or update the draft pull request
        if: steps.import.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 #v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: ${{ steps.update-branch.outputs.name }}
          base: main
          title: "chore(chain): update Mainnet release state"
          body: |
            Updates the embedded Mainnet checkpoint list, matching VCT frontier, subtree roots, and provenance record from one immutable release-state bundle. It also floors the end-of-support estimate.

            - Finalized height: `${{ steps.import.outputs.height }}`
            - Finalized hash: `${{ steps.import.outputs.block_hash }}`
            - Generated at: `${{ steps.import.outputs.generated_at }}`
            - Bundle meta: `${{ steps.import.outputs.meta_url }}`
            - Meta SHA-256: `${{ steps.import.outputs.meta_sha256 }}`

            The checkpoint diff is append-only over the committed list, and CI re-derives the provenance digests from the embedded data on every PR. Review before merging: checkpoints are consensus-critical, so spot-check a few new heights and the terminal hash against an independent node or explorer.
          # `A-release-state` marks this as an automated release-state refresh rather than the
          # release PR itself, so the changelog gate does not require it to consume every
          # pending fragment. `A-release` stays for the release CI paths.
          labels: |
            A-release
            A-release-state
          commit-message: "chore(chain): update Mainnet release state"
          sign-commits: true
          draft: always-true
          delete-branch: true
