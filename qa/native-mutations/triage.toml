# Triage for the mutation loop's non-kills (mutation plan, mut-5). See
# README.md. One record per lane and class that survived or that another
# rule killed. A record matches a lane, or a seed of a generator lane, only
# while that lane's class and other rule are the record's:
#
# [[triage]]
# patch = "<the report's patch>"
# property = "<the case's property>"
# lane = "witness"          # or the generator harness, for every seed
# class = "survived"        # or killed-by-other-rule
# other = "<the other ID>"  # for killed-by-other-rule only, and required there
# stage = "generator"       # generator, schedule, observation, property or unsupported
# reason = "<why the lane stopped there>"
# issue = "#1234"           # optional

