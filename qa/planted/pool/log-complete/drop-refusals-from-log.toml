# Drops refusals from the published change log, so a reader never hears of
# a transaction the core refused, which the indexer reports as today's
# invalidation. The snapshot is unchanged, so only the refusal check sees it.
input = "crates/zakura-sim/tests/fixtures/pool-core.bin"
# The harness drives the pool core and the storage under it.
checks = ["crates/zakura-mempool/src"]
