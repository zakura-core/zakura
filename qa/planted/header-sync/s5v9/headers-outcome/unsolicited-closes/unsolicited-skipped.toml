# The reader skips a response whose header the subscriber's precheck
# refuses because no live subscription answers it, reading and dropping
# its payload, instead of closing the connection. Its input is the focused
# scenario of an outcome with no live subscription, so
# `header-sync/s5v9/headers-outcome/unsolicited-closes` is the only ID it
# breaks.
# Besides the files the patch changes, the rest of these decide which
# frames the input's peers send and when the node judges them. A change
# there can move the input off its frame.
checks = ["crates/zakura-network/src/zakura/transport", "crates/zakura-network/src/zakura/header_sync", "crates/zakura-network/src/zakura/regulation"]

[typed]
harness = "header-sync/wire"
scenario = "crates/zakura-sim/tests/fixtures/header-wire-planted-headers-outcome-unsolicited.json"
plan = "crates/zakura-sim/tests/fixtures/header-wire-default.plan"
