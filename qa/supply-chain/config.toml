[policy.zakura-jsonl-trace]
audit-as-crates-io = false

[policy.zakura-network]
audit-as-crates-io = false

[policy.zakura-node-services]
audit-as-crates-io = false

[policy.zakura-rpc]
audit-as-crates-io = false

[policy.zakura-script]
audit-as-crates-io = false

[policy.zakura-state]
audit-as-crates-io = false

[policy.zakura-test]
audit-as-crates-io = false

[policy.zakura-tower-batch-control]
audit-as-crates-io = false

[policy.zakura-tower-fallback]
audit-as-crates-io = false

[policy.zakura-utils]
audit-as-crates-io = false

[[exemptions.addr2line]]
version = "0.21.0"
criteria = "safe-to-deploy"

[[exemptions.async_io_stream]]
version = "0.3.3"
criteria = "safe-to-deploy"
notes = "Audit held: AsyncBufRead::poll_fill_buf accepts an empty chunk from the wrapped TryStream but leaves its internal state unset, then reaches unreachable!(). A valid empty stream item can therefore panic safe callers; retain this exemption pending an upstream fix or replacement."

[[exemptions.bounded-integer]]
version = "0.5.8"
criteria = "safe-to-deploy"
notes = "Audit hold: the optional bytemuck1 feature implements unsafe Contiguous for every const MIN and MAX without enforcing MIN <= MAX. Bounded<5, 4> therefore violates Bytemuck's explicit inhabited-range contract. Zakura enables only the types feature, so this path is not currently deployed; retain the exemption pending an upstream bound or feature-scoped audit policy."

[[exemptions.canonical-path]]
version = "2.0.2"
criteria = "safe-to-deploy"
notes = "Audit held: safe set_file_name and set_extension methods mutate the wrapped path without re-canonicalizing it, breaking the advertised canonical-path invariant; is_dir also delegates to is_file. A version-wide safe-to-deploy certification is deferred pending an upstream fix."

[[exemptions.chacha20]]
version = "0.10.1"
criteria = "safe-to-deploy"
notes = "Audit hold: the public RNG get_block_pos method subtracts the four-block buffer width without wrapping. After set_block_pos(u64::MAX) followed by one generated word, the internal counter wraps to 3 and get_block_pos panics on 3 - 4 in debug builds. Reproduced with ChaCha20Rng; retain the exemption pending wrapping arithmetic or an upstream fix."

[[exemptions.console]]
version = "0.15.11"
criteria = "safe-to-deploy"

[[exemptions.console-subscriber]]
version = "0.4.1"
criteria = "safe-to-deploy"

[[exemptions.crypto-common]]
version = "0.2.0-rc.1"
criteria = "safe-to-deploy"
notes = "Audit deferred: hazmat::SerializableState uses an 8-byte element width for [u128; N], causing serialize() to panic; reproduced with [u128; 1]."

[[exemptions.crypto_box]]
version = "0.9.1"
criteria = "safe-to-deploy"
notes = "Audit held: the high-level CryptoBox constructor accepts any 32-byte peer public key and derives a key without rejecting a non-contributory X25519 result. A low-order peer key can therefore produce a predictable all-zero shared secret; retain the exemption until the API enforces contributory behavior or clearly delegates that validation to callers."

[[exemptions.data-encoding]]
version = "2.11.0"
criteria = "safe-to-deploy"
notes = "Audit hold: the doc-hidden Encoding tuple field and Encoding::internal_new are safe public APIs that accept arbitrary implementation bytes. A caller can safely supply non-ASCII symbols with an otherwise valid table shape, after which encode_mut_str and encode use unchecked UTF-8 construction. Retain the exemption pending upstream validation or an unsafe constructor boundary."

[[exemptions.diatomic-waker]]
version = "0.2.3"
criteria = "safe-to-deploy"
notes = "Audit deferred: the safe single-sink wrappers preserve the documented exclusivity contract and ordinary tests pass, but the crate's core is a custom unsafe lock-free two-slot Waker state machine. Its published higher-bound Loom slot-reuse exploration did not complete within the batch review window; retain the exemption pending a dedicated concurrency review or completed model run."

[[exemptions.fixedbitset]]
version = "0.5.7"
criteria = "safe-to-deploy"
notes = "Audit hold: the safe grow_and_insert(usize::MAX) path adds one without checked arithmetic. In release builds the length wraps to zero, grow does not allocate, and the method then performs an unchecked out-of-bounds write through get_unchecked_mut. Retain the exemption pending checked overflow handling before the raw write."

[[exemptions.fs_extra]]
version = "1.3.0"
criteria = "safe-to-deploy"
suggest = false
notes = "Audit hold: recursive directory enumeration follows directory symlinks, and move_dir then moves and deletes files reached through them. A local reproduction with source/link pointing outside the source tree returned success, removed the external sentinel, and copied it under the destination. Retain the exemption until traversal uses symlink_metadata or otherwise confines moves to the requested tree."

[[exemptions.hash32]]
version = "0.2.1"
criteria = "safe-to-deploy"
notes = "Audit held: the safe default constructor for the public Murmur3 hasher creates its [u8; 4] buffer with deprecated mem::uninitialized, which is undefined behavior because integer bytes must be initialized even when the current index prevents an immediate read. Retain the exemption pending replacement with initialized storage or MaybeUninit with a proven initialization boundary."

[[exemptions.hickory-proto]]
version = "0.25.2"
criteria = "safe-to-deploy"
notes = "Audit hold: two RustSec advisories are open against this version and cargo audit reports both for this workspace. RUSTSEC-2026-0119 is CPU exhaustion during message encoding from O(n squared) name compression, fixed in 0.26.1; RUSTSEC-2026-0118 is an unbounded loop in NSEC3 closest-encloser proof validation on cross-zone responses, for which no fixed release is listed. Both are reachable from untrusted DNS responses. The crate reaches this tree through hickory-resolver under iroh and iroh-relay, so clearing the exemption means moving past the Iroh 0.92 pin to hickory 0.26 or later. Retain the exemption until then."

[[exemptions.hmac-sha256]]
version = "1.1.14"
criteria = "safe-to-deploy"
notes = "Audit held: HKDF::expand documents a maximum of 8160 output bytes, but rejects exactly 8160 and increments a u8 counter after the final block, which panics with overflow checks for supported lengths 8129 through 8159. A version-wide safe-to-deploy certification is deferred pending an upstream fix."

[[exemptions.icu_normalizer_data]]
version = "2.2.0"
criteria = "safe-to-deploy"
notes = "Audit held: the generated data package embeds 18 unsafe unchecked zerovec and ICU trie/list constructors across 7 opaque .rs.data files. Compilation checks syntax and types but does not establish the byte-layout invariants required by those constructors; retain the exemption pending generator provenance or independent blob validation."

[[exemptions.icu_properties_data]]
version = "2.2.0"
criteria = "safe-to-deploy"
notes = "Audit held: the generated data package embeds 249 unsafe unchecked zerovec and ICU trie/list constructors across 137 opaque .rs.data files. Compilation checks syntax and types but does not establish the byte-layout invariants required by those constructors; retain the exemption pending generator provenance or independent blob validation."

[[exemptions.indicatif]]
version = "0.17.11"
criteria = "safe-to-deploy"

[[exemptions.iroh-metrics]]
version = "0.35.0"
criteria = "safe-to-deploy"
notes = "Audit held: start_metrics_exporter unwraps reading the body of any non-success response from the remote exporter endpoint. A network/body read failure can therefore panic the exporter task; retain the exemption pending fallible error propagation."

[[exemptions.libm]]
version = "0.2.16"
criteria = "safe-to-deploy"
notes = "Audit hold: the internal u256 Shr masks the shift amount instead of saturating, so with debug assertions off, u256::MAX >> 256 evaluates to u256::MAX rather than zero. The crate's own release-mode test asserts zero and fails, reproduced here: cargo test --lib passes 115 tests in debug, where the debug_assert turns the over-shift into the expected panic, and fails shr_u256_overflow in release with 114 passing. Every in-crate caller is expected to keep the shift below the width, which is what the debug assertion encodes, so this is a wrong value in an internal helper rather than a memory-safety problem. Retain the exemption pending an upstream fix or a check that no caller can over-shift."

[[exemptions.libredox]]
version = "0.1.18"
criteria = "safe-to-deploy"
notes = "Audit hold: Fd::new is a safe public ownership constructor for an arbitrary raw descriptor, while Drop always closes it. Safe code can construct duplicate owners for one descriptor and, after descriptor reuse, close an unrelated resource. Retain the exemption until raw ownership construction is unsafe or uses a borrowing or duplication model."

[[exemptions.lru]]
version = "0.13.0"
criteria = "safe-to-deploy"
notes = "Audit hold: two RustSec advisories are open against this version and cargo audit reports both for this workspace. RUSTSEC-2026-0253 is a potential use-after-free from the lack of panic safety in LruCache::pop, and RUSTSEC-2026-0002 is an IterMut Stacked Borrows violation that invalidates an internal pointer. Both are classified unsound rather than exploitable, and the crate reaches this tree only through pkarr and iroh-relay, so clearing the exemption means moving past the Iroh 0.92 pin or an upstream release. Retain the exemption until then."

[[exemptions.nanorand]]
version = "0.7.0"
criteria = "safe-to-deploy"
notes = "Audit held: without the optional getrandom dependency, constructors ignore the success result from direct system-entropy calls; Linux also treats a short getrandom read as success, and Windows reports RtlGenRandom success as false. The public rdseed helper additionally writes full eight-byte chunks into arbitrary output lengths and can panic on a non-multiple-of-eight slice. Zakura currently enables the getrandom feature, but retain the version-wide exemption pending upstream fixes."

[[exemptions.netlink-packet-utils]]
version = "0.5.2"
criteria = "safe-to-deploy"
notes = "Audit held: the public Nla trait permits value_len values above u16::MAX, but Emitable truncates value_len to u16 before constructing the value slice. A large safe custom Nla can therefore panic during emit or produce a truncated header; retain this exemption pending an enforced length bound."

[[exemptions.netlink-proto]]
version = "0.11.5"
criteria = "safe-to-deploy"
notes = "Audit hold: Connection::forward_responses calls unimplemented! for a NetlinkPayload::Overrun response. The kernel can legitimately report an overrun when messages are lost, so valid external input can panic the connection future. Retain the exemption pending fallible handling or forwarding of overrun messages."

[[exemptions.netlink-sys]]
version = "0.8.8"
criteria = "safe-to-deploy"
notes = "Audit hold: the public Socket derives Clone over a bare owned RawFd while every clone closes that descriptor in Drop. Safe cloning can therefore double-close the descriptor and, after descriptor reuse, close an unrelated resource. Retain the exemption pending a dup-based Clone implementation, shared ownership, or removal of Clone."

[[exemptions.ntimestamp]]
version = "1.0.0"
criteria = "safe-to-deploy"
notes = "Audit held: with the base32 feature disabled, TryFrom<String> slices malformed input and can panic instead of returning InvalidEncoding. Zakura currently enables base32 through pkarr, but a version-wide safe-to-deploy certification is deferred pending an upstream fix."

[[exemptions.object]]
version = "0.36.0"
criteria = "safe-to-deploy"

[[exemptions.os_info]]
version = "3.15.0"
criteria = "safe-to-deploy"
notes = "Audit hold: the Windows get_proc_address helper wraps GetProcAddress's nullable FARPROC in another Some, so a missing optional API is treated as present and then transmuted from a null Option<fn> into a non-null callable function pointer. Safe os_info::get() can therefore reach undefined behavior on affected Windows versions. Retain the exemption until the inner FARPROC is flattened and checked."

[[exemptions.pest]]
version = "2.8.7"
criteria = "safe-to-deploy"
notes = "Audit hold: an empty-stack PEEK_ALL succeeds without consuming input, while ParserState::repeat checks its call limit only before entering the loop. A grammar such as PEEK_ALL* can therefore hang indefinitely. Retain the exemption pending a runtime progress guard or complete grammar validation."

[[exemptions.pest_derive]]
version = "2.8.7"
criteria = "safe-to-deploy"
notes = "Audit hold: the derive stack accepts repetitions around empty-stack PEEK_ALL and emits a runtime parser loop that never consumes input or reaches the call limit. Retain the exemption pending a fix in pest and pest_meta."

[[exemptions.pest_generator]]
version = "2.8.7"
criteria = "safe-to-deploy"
notes = "Audit hold: code generation can emit ParserState::repeat around PEEK_ALL after pest_meta misclassifies that empty-stack operation as progressing, producing an unbounded runtime loop. Retain the exemption pending upstream validation or a runtime progress guard."

[[exemptions.pest_meta]]
version = "2.8.7"
criteria = "safe-to-deploy"
notes = "Audit hold: validator.rs explicitly notes that empty-stack PEEK_ALL is non-progressing but classifies it as progressing. Repetitions such as PEEK_ALL* can pass validation and generate a parser that hangs indefinitely. Retain the exemption pending complete progress analysis."

[[exemptions.r-efi]]
version = "5.2.0"
criteria = "safe-to-deploy"
notes = "Audit hold: the UEFI protocol tables expose firmware operations that accept and dereference raw pointers as safe extern function pointers. Safe Rust can therefore invoke them with invalid pointers; version 6.0.0 corrected this by making every firmware callback unsafe. Retain the 5.2.0 exemption until its dependents upgrade."

[[exemptions.redox_users]]
version = "0.4.5"
criteria = "safe-to-deploy"

[[exemptions.rgb]]
version = "0.8.53"
criteria = "safe-to-deploy"
notes = "Audit hold: the default as-bytes feature explicitly provides unsound Pod implementations for mixed-component RGBA, BGRA, ARGB, ABGR, and GrayAlpha types. repr(C) may insert padding between independently chosen Pod component types, but the Pod contract permits that padding to be read as bytes. Retain the exemption until those implementations are removed or constrained to padding-free layouts."

[[exemptions.same-file]]
version = "1.0.6"
criteria = "safe-to-deploy"
suggest = false
notes = "Sentry 0.47 upgrade. Audit held: on Unix, IntoRawFd for a standard-stream Handle removes the File and then Drop unconditionally unwraps the now-empty Option, so the safe consuming conversion panics. A version-wide safe-to-deploy certification is deferred pending an upstream fix."

[[exemptions.self_cell]]
version = "1.2.2"
criteria = "safe-to-deploy"
notes = "Audit hold: the optional old_rust feature deliberately uses a pre-1.51 field-pointer projection that the crate documents as technically undefined behavior. Zakura's MSRV does not execute that branch, but retain the version-wide exemption until the legacy UB path is removed or excluded by feature-scoped policy."

[[exemptions.sentry]]
version = "0.47.0"
criteria = "safe-to-deploy"
suggest = false
notes = "Audit hold: the Retry-After and X-Sentry-Rate-Limits parsers accept unbounded floating-point seconds, cast values such as 1e300 to u64::MAX, and add that duration to SystemTime with panicking arithmetic. Both remote-header paths were reproduced panicking the transport code. Retain the exemption pending finite bounded parsing and checked time addition."

[[exemptions.sentry-core]]
version = "0.47.0"
criteria = "safe-to-deploy"
suggest = false
notes = "Audit hold: on non-main threads, safe Hub::with exposes &Arc<Hub> from a thread-local UnsafeCell while safe HubSwitchGuard::new can mutably swap that same Arc before the callback borrow ends. This permits overlapping shared and mutable access to the Arc storage. Retain the exemption pending a cloned callback value or another design that prevents mutation during the shared borrow."

[[exemptions.sentry-types]]
version = "0.47.0"
criteria = "safe-to-deploy"
suggest = false
notes = "Audit hold: Attachment::to_writer interpolates caller-controlled filename, custom attachment type, and content type directly into a JSON envelope header without escaping. A safe filename containing a quote was reproduced producing invalid JSON, and newline-bearing values can alter envelope framing. Retain the exemption pending serde-based header serialization or validated field characters."

[[exemptions.tar]]
version = "0.4.45"
criteria = "safe-to-deploy"

[[exemptions.time-macros]]
version = "0.2.31"
criteria = "safe-to-deploy"
notes = "Audit held: timestamp parsing rounds arbitrary fractional precision to nanoseconds before calling Timestamp::__new_unchecked. timestamp!(0.9999999999) reproducibly produces 1_000_000_000 nanoseconds and fails the ranged-integer invariant during compilation instead of yielding a valid value or a normal macro diagnostic. Retain the exemption pending explicit carry or truncation handling."

[[exemptions.vergen-gitcl]]
version = "9.1.0"
criteria = "safe-to-deploy"
suggest = false
notes = "Audit deferred in #691: the crate executes the shell and Git selected from the ambient build environment, and Git operations can invoke configured helpers such as core.fsmonitor. PR #619 keeps a fixed describe pattern and writes Git errors to stderr rather than Cargo directives, but that does not remove the broader SHELL, PATH, and Git-configuration authority. Retain this exemption until #691 chooses and verifies a constrained CLI backend, a patched git2 backend, or a reasonably auditable gix backend."

[[exemptions.vergen-lib]]
version = "9.1.0"
criteria = "safe-to-deploy"
notes = "Audit held: the optional emit_and_set feature exposes a safe method that calls unsafe process-environment mutation without requiring callers to guarantee that no other thread reads or writes the environment. Zakura does not enable that feature, but a version-wide safe-to-deploy certification is deferred pending an unsafe API boundary or internal synchronization."

[[exemptions.wait-timeout]]
version = "0.2.0"
criteria = "safe-to-deploy"
notes = "Audit hold: the Unix initializer installs the SIGCHLD handler before publishing the global STATE pointer, so a signal in that window dereferences null. The handler also treats any nonzero previous sa_sigaction as callable, including the SIG_IGN sentinel. Current wait-timeout 0.2.1 retains this design, but its imported delta audit depends on this legacy baseline, so direct replacement review or upstream remediation is required before removing the exemption."

[[exemptions.winapi-i686-pc-windows-gnu]]
version = "0.4.0"
criteria = "safe-to-deploy"
notes = "Audit hold: the package is 1387 prebuilt binary import libraries totalling roughly 50 MB, plus a build script and a src/lib.rs whose entire content is a license header and a no_std attribute. There is nothing reviewable in the source, so certifying it safe-to-deploy would be attesting to binaries that cannot be inspected from the package. The build script adds the bundled lib directory to the linker search path only when the target is i686-pc-windows-gnu, which this workspace does not build, and the bundling can be disabled entirely by setting WINAPI_NO_BUNDLED_LIBRARIES. Retain the exemption; it comes in through winapi 0.3, so it clears when that dependency does."

[[exemptions.winapi-util]]
version = "0.1.9"
criteria = "safe-to-deploy"
notes = "Audit hold: the safe HandleRef::from_file constructor returns a borrowed Windows handle without tying its lifetime to the source File. Safe code can retain the HandleRef after the File closes and then operate on a stale or reused handle. Retain the exemption pending a lifetime-bound borrowed-handle representation."

[[exemptions.winapi-x86_64-pc-windows-gnu]]
version = "0.4.0"
criteria = "safe-to-deploy"
notes = "Audit hold: the package is 1416 prebuilt binary import libraries totalling roughly 53 MB, plus a build script and a src/lib.rs whose entire content is a license header and a no_std attribute. There is nothing reviewable in the source, so certifying it safe-to-deploy would be attesting to binaries that cannot be inspected from the package. The build script adds the bundled lib directory to the linker search path only when the target is x86_64-pc-windows-gnu, which this workspace does not build, and the bundling can be disabled entirely by setting WINAPI_NO_BUNDLED_LIBRARIES. Retain the exemption; it comes in through winapi 0.3, so it clears when that dependency does."

[[exemptions.windows-implement]]
version = "0.60.2"
criteria = "safe-to-deploy"
notes = "Audit hold: #[implement] generates a safe into_outer method in the caller's module even though the crate states safe code must never own the generated COM outer type. Same-module code can create a stack outer, obtain an owned interface through ComObjectInterface::as_interface_ref(...).to_owned(), then drop or move the outer and leave the interface pointing at dead storage. Retain the exemption until outer construction is inaccessible or pinned behind a lifetime-safe wrapper."

[[exemptions.windows-threading]]
version = "0.1.0"
criteria = "safe-to-deploy"
notes = "Audit held: Pool::submit binds a non-'static closure to a freely inferred temporary borrow of &self, then submits it asynchronously. Safe code can therefore let captured borrowed data expire while the pool and callback remain live. Version 0.2.1 replaces this API with 'static submission plus an invariant scoped API that joins before borrowed data can expire."

[[exemptions.windows_aarch64_gnullvm]]
version = "0.52.5"
criteria = "safe-to-deploy"

[[exemptions.windows_aarch64_msvc]]
version = "0.52.5"
criteria = "safe-to-deploy"

[[exemptions.windows_i686_gnu]]
version = "0.52.5"
criteria = "safe-to-deploy"

[[exemptions.windows_i686_gnullvm]]
version = "0.52.5"
criteria = "safe-to-deploy"

[[exemptions.windows_i686_msvc]]
version = "0.52.5"
criteria = "safe-to-deploy"

[[exemptions.windows_x86_64_gnu]]
version = "0.52.5"
criteria = "safe-to-deploy"

[[exemptions.windows_x86_64_gnullvm]]
version = "0.52.5"
criteria = "safe-to-deploy"

[[exemptions.windows_x86_64_msvc]]
version = "0.52.5"
criteria = "safe-to-deploy"

[[exemptions.zerovec]]
version = "0.11.6"
criteria = "safe-to-deploy"
notes = "Audit hold: in an optimized build, collecting into ZeroVec<(u32, char)> produces a buffer of zeros instead of the encoded data. Reproduced two ways: the crate's own ule::tuple::test_pairule_validate passes in debug, where all 77 library tests pass, and fails in release, and a standalone program shows as_bytes() returning 21 zero bytes for three collected tuples in release against the correct bytes in debug. The failure is specific to that shape, the 7-byte Tuple2ULE over RawBytesULE<4> and CharULE; (u16, char), (char, char), (u32, u32), (u32, char, i8), and the plain u32 and char vectors were all correct in both profiles. Because the bytes come back zeroed, validating them as a differently constrained tuple then wrongly succeeds, which is what the upstream test is asserting against. A profile-dependent result in a crate whose whole purpose is unchecked casts over validated bytes should not be certified. Retain the exemption pending an upstream fix."

[[exemptions.zerovec-derive]]
version = "0.11.3"
criteria = "safe-to-deploy"
notes = "Audit hold: make_ule permits some nonzero-starting or gapped repr(u8) enums, but its generated byte validator treats every value between min and max as valid and new_from_u8 checks only the maximum before transmuting. Safe generated APIs can therefore transmute an invalid discriminant. Retain the exemption pending complete discriminant validation."
