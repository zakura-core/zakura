name: Header-prefix original-range profile replay

# Manual branch-only replay on two additional disposable hosts. Existing fleet untouched.
on:
  workflow_dispatch:
concurrency:
  group: isolated-original-range-header-prefix-profile
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  replay:
    name: Profile original and patched nodes in parallel
    if: github.event_name == 'workflow_dispatch' && github.repository == 'zakura-core/zakura'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout isolated harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install DigitalOcean client and SSH key
        uses: ./.github/actions/do-cli
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          ssh_private_key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
      - name: Check capacity for the two authorized additional hosts
        run: |
          set -euo pipefail
          count=$(doctl compute droplet list --output json | jq '[.[] | select(.name | test("^zakura-(genesis-|perf-|sync-variance|sync-fixture)"))] | length')
          if (( count > 4 )); then
            echo "Two-host replay would exceed its six-host campaign ceiling" >&2
            exit 1
          fi
      - name: Create baseline droplet and cloned volume
        id: baseline
        uses: ./.github/actions/do-droplet
        with:
          policy: fixed
          regions: nyc1
          image_id: "244455463"
          state_snapshot_id: f773fe89-aaa0-11f1-9dae-aebfafd73072
          name: zakura-perf-baseline-${{ github.run_id }}
          size: c-16
          ssh_fingerprint: ${{ vars.DO_SSH_KEY_FINGERPRINT }}
          tag: zakura-pr-node
          state_network: mainnet
          volume_name: zakura-pr-perf-vol-${{ github.run_id }}-baseline
      - name: Wait for baseline SSH
        uses: ./.github/actions/do-wait-ssh
        with:
          ip: ${{ steps.baseline.outputs.ip }}
      - name: Preserve baseline resource identity
        run: cp /tmp/out/provisioning.json /tmp/baseline-provisioning.json
      - name: Create primary droplet and cloned volume
        id: primary
        uses: ./.github/actions/do-droplet
        with:
          policy: fixed
          regions: nyc1
          image_id: "244455463"
          state_snapshot_id: f773fe89-aaa0-11f1-9dae-aebfafd73072
          name: zakura-perf-primary-${{ github.run_id }}
          size: c-16
          ssh_fingerprint: ${{ vars.DO_SSH_KEY_FINGERPRINT }}
          tag: zakura-pr-node
          state_network: mainnet
          volume_name: zakura-pr-perf-vol-${{ github.run_id }}-primary
      - name: Wait for primary SSH
        uses: ./.github/actions/do-wait-ssh
        with:
          ip: ${{ steps.primary.outputs.ip }}
      - name: Preserve primary resource identity
        run: cp /tmp/out/provisioning.json /tmp/primary-provisioning.json
      - name: Shared preparation and parallel diagnostic profiles
        env:
          BASELINE_IP: ${{ steps.baseline.outputs.ip }}
          BASELINE_VOLUME: ${{ steps.baseline.outputs.volume_name }}
          PRIMARY_IP: ${{ steps.primary.outputs.ip }}
          PRIMARY_VOLUME: ${{ steps.primary.outputs.volume_name }}
          GH_CLONE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/workflows/scripts/profile-replay-parallel.sh
      - name: Collect both profiles and failure logs
        if: always()
        env:
          BASELINE_IP: ${{ steps.baseline.outputs.ip }}
          PRIMARY_IP: ${{ steps.primary.outputs.ip }}
        run: |
          set -euo pipefail
          mkdir -p replay-out
          for leg in baseline primary; do
            mkdir -p "replay-out/$leg"
            if [ "$leg" = baseline ]; then ip=$BASELINE_IP; else ip=$PRIMARY_IP; fi
            if [ -f "/tmp/$leg-provisioning.json" ]; then cp "/tmp/$leg-provisioning.json" "replay-out/$leg/provisioning.json"; fi
            if [ -n "$ip" ]; then
              scp -r -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i /tmp/do_ssh "root@$ip:/root/out/." "replay-out/$leg/" || true
            fi
          done
          for log in /tmp/profile-*.log; do [ ! -f "$log" ] || cp "$log" replay-out/; done
      - name: Validate matching state and completed profile range
        run: |
          python3 - <<'PYCODE'
          import json, pathlib, re
          root = pathlib.Path('replay-out')
          expected = {'baseline':'1b77bb18a7f4f915d760971e97083896221f70bf', 'primary':'c8cde61726d2822a758ae08815efce3dcdd16bc3'}
          manifests = []
          binaries = []
          for leg, sha in expected.items():
              p = root / leg
              meta = json.loads((p / 'meta.json').read_text())
              assert meta['sha'] == sha, meta
              assert meta['start_height'] == 1709210 and meta['end_height'] == 1750000, meta
              assert meta['blocks'] == 40790 and meta['clean_stop'] and meta['profiled'], meta
              assert meta['p2p_stack'] == 'zakura' and meta['storage_mode'] == 'pruned', meta
              manifests.append((p / 'state.sha256').read_bytes())
              binaries.append((p / 'binary.sha256').read_text().split()[0])
              for name in ['sampling.json','system-timeline.jsonl.gz','perf.data.zst','zakurad-profile-binary.zst','cpu-timeline.perf.txt.gz','scheduling-timeline.perf.txt.gz','zakura-traces.tar.zst']:
                  assert (p / name).stat().st_size > 0, (leg, name)
              counters = re.findall(r'^state_vct_fast_block_count(?:\{[^\n]*\})? ([0-9.eE+\-]+)$', (p / 'metrics-final.prom').read_text(), re.M)
              assert len(counters) == 1 and float(counters[0]) == 40790, (leg, counters)
          assert manifests[0] == manifests[1], 'Prepared state differs between arms'
          assert binaries[0] != binaries[1], 'Different sources unexpectedly produced the same executable'
          (root / 'pair-validation.json').write_text(json.dumps({'status':'passed','start':1709210,'stop':1750000,'blocks':40790,'same_prepared_state':True})+'\n')
          PYCODE
      - name: Upload both captures before deleting the new hosts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: original-range-prefix-profile-${{ github.run_id }}
          path: replay-out/
          if-no-files-found: error
          retention-days: 30
      - name: Delete only the new baseline droplet and volume
        if: always()
        uses: ./.github/actions/do-teardown
        with:
          droplet_id: ${{ steps.baseline.outputs.id }}
          droplet_name: zakura-perf-baseline-${{ github.run_id }}
          volume_ids: ${{ steps.baseline.outputs.volume_id }}
          volume_names: zakura-pr-perf-vol-${{ github.run_id }}-baseline
          enabled: 'true'
      - name: Delete only the new primary droplet and volume
        if: always()
        uses: ./.github/actions/do-teardown
        with:
          droplet_id: ${{ steps.primary.outputs.id }}
          droplet_name: zakura-perf-primary-${{ github.run_id }}
          volume_ids: ${{ steps.primary.outputs.volume_id }}
          volume_names: zakura-pr-perf-vol-${{ github.run_id }}-primary
          enabled: 'true'
