[[audits.abscissa_core]]
who = "Claude Opus 5 <noreply@anthropic.com>"
criteria = "safe-to-deploy"
version = "0.7.0"
notes = "Reviewed all packaged source, manifest, and tests. The application framework holds a single unsafe expression; its ambient capabilities are the ones an application framework needs and each is explicit: it reads the config file the application names, canonicalizing the path first, reads the process environment and arguments, and installs a tracing subscriber and a terminal handler. Secrets in configuration are held in zeroizing wrappers. There is no build script. All 8 tests passed with all features."

