# Publish a complete release-state set before advertising readiness.
# Keep this filename: crates.io Trusted Publishing authorizes this entrypoint.
# Adoption and human review live in adopt-release-state.yml.
name: Update Mainnet release state
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate the candidate without publishing or promoting storage"
        type: boolean
        default: false
  schedule:
    - cron: "0 7 * * *"

permissions: {}

concurrency:
  group: update-release-state
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve one immutable release-state bundle
    if: >-
      github.repository == 'zakura-core/zakura' &&
      (github.ref == 'refs/heads/main' || inputs.dry_run) &&
      (github.event_name == 'workflow_dispatch' || vars.MAINNET_RELEASE_STATE_PUBLICATION_ENABLED == 'true')
    runs-on: ubuntu-latest
    environment: ${{ inputs.dry_run && 'release-dry-run' || 'release-automation' }}
    permissions:
      contents: read
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Self-test the release-state tooling
        run: |
          python3 .github/scripts/fetch-release-state.py --self-test
          python3 .github/scripts/import-release-state.py --self-test
          python3 scripts/pack-assets-crate.py --self-test

      - name: Fetch one immutable bundle
        env:
          LATEST_URL: ${{ vars.MAINNET_RELEASE_STATE_LATEST_URL }}
        run: python3 .github/scripts/release_state.py candidate --state "$RUNNER_TEMP/release-state"

      - name: Preserve the verified candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
        with:
          name: release-state-candidate
          path: ${{ runner.temp }}/release-state/
          retention-days: 7
          if-no-files-found: error

  validate:
    name: Validate the candidate before publication
    needs: [resolve]
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f #v2.0.0
        with:
          toolchain: stable
          cache-save-if: false
      - uses: ./.github/actions/setup-zakura-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 #v8.0.2
        with:
          name: release-state-candidate
          path: ${{ runner.temp }}/release-state/
      - name: Verify append-only history and prove subtree roots
        run: python3 .github/scripts/release_state.py validate --state "$RUNNER_TEMP/release-state"
      - name: Package and verify an already published asset for the dry run
        if: inputs.dry_run
        run: |
          set -euo pipefail
          python3 .github/scripts/release_state.py pack --state "$RUNNER_TEMP/release-state"
          python3 .github/scripts/release_state.py check --expect-published --state "$RUNNER_TEMP/release-state"
          python3 .github/scripts/release_state.py visible --state "$RUNNER_TEMP/release-state"

  publish-assets:
    name: Publish the frontier grid to crates.io
    needs: [resolve, validate]
    # The repository guard matches publish-crates.yml: a staging fork must never reach the real
    # registry, and failing before the OIDC exchange keeps its logs honest.
    if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' && github.repository == 'zakura-core/zakura' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io-assets
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f #v2.0.0
        with:
          toolchain: stable
          # This job packages one dependency-free crate and never builds the workspace.
          cache: false

      - name: Restore the exact validated candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 #v8.0.2
        with:
          name: release-state-candidate
          path: ${{ runner.temp }}/release-state/

      - name: Pack the asset crate
        run: python3 .github/scripts/release_state.py pack --state "$RUNNER_TEMP/release-state"

      - name: Check or refuse the existing asset version
        id: existing
        run: python3 .github/scripts/release_state.py check --state "$RUNNER_TEMP/release-state"

      - name: Authenticate with crates.io
        id: auth
        if: steps.existing.outputs.needed == 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # The token is scoped to this step alone and revoked when the job ends. The payload is
      # gitignored, so --allow-dirty is what lets cargo package the generated files that the
      # crate's explicit `include` list names.
      - name: Publish to crates.io
        if: steps.existing.outputs.needed == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: python3 .github/scripts/release_state.py publish --state "$RUNNER_TEMP/release-state"

      - name: Verify Cargo availability
        run: python3 .github/scripts/release_state.py visible --state "$RUNNER_TEMP/release-state"

  promote:
    name: Promote the verified set to immutable ready storage
    needs: [resolve, validate, publish-assets]
    if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' && github.repository == 'zakura-core/zakura' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-state-storage
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f #v2.0.0
        with:
          toolchain: stable
          cache: false
      - name: Install the pinned storage client
        run: python3 -m pip install --disable-pip-version-check -r .github/scripts/requirements-release-state.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 #v8.0.2
        with:
          name: release-state-candidate
          path: ${{ runner.temp }}/release-state/
      - name: Verify public bytes and advance readiness conditionally
        env:
          RELEASE_STATE_R2_ACCESS_KEY_ID: ${{ secrets.RELEASE_STATE_R2_ACCESS_KEY_ID }}
          RELEASE_STATE_R2_SECRET_ACCESS_KEY: ${{ secrets.RELEASE_STATE_R2_SECRET_ACCESS_KEY }}
        run: python3 .github/scripts/release_state.py promote --state "$RUNNER_TEMP/release-state"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
        with:
          name: published-release-state
          path: ${{ runner.temp }}/release-state/promoted-ready.json
          if-no-files-found: error
