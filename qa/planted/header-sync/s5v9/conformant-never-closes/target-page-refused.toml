# Drops the `!reaches` condition from the subscriber's past-target check,
# so a page that reaches its subscription's target is refused as past it,
# and the node closes the connection with `service_protocol_reject`. The
# page is conformant, and the node judged it before the close. The input
# is a serving adversary: a peer holding 120 headers that serves the node
# at 50 and takes no act. The scenario doesn't mark it honest, so
# `session/honest-never-punished` doesn't apply, and
# `header-sync/s5v9/conformant-never-closes` is the only ID it breaks.
# Besides state.rs, which the patch changes, the rest of header sync
# decides how the peer's pages reach the node. A change there can move the
# input off a page that reaches its target.
checks = ["crates/zakura-network/src/zakura/header_sync"]

[typed]
harness = "header-sync/wire"
scenario = "crates/zakura-sim/tests/fixtures/header-wire-planted-serving-adversary.json"
plan = "crates/zakura-sim/tests/fixtures/header-wire-default.plan"
