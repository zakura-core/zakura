# The reactor drops a body completion that the gate finds stale, so a
# detached submission's holder, slot and decoded bytes stay charged. The
# scenario forks the chain at height 8 once storage holds the third apply,
# with the node's tip reset first, and relinks mirror-0 after it closes.
# mut-6's generator drew it (seed 11, run 14, family reset-mid-flight).
# Besides reactor.rs, which the patch changes, the rest of block sync
# decides when a submission detaches and when its verdict arrives.
checks = ["crates/zakura-network/src/zakura/block_sync"]

[typed]
harness = "block-sync/storage"
scenario = "qa/planted/block-sync/detached-submission-bounded/reactor-drops-stale-verdict.scenario.json"
plan = "qa/planted/block-sync/detached-submission-bounded/reactor-drops-stale-verdict.plan.bin"
