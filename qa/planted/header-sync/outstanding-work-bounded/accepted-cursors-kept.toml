# Acceptance advances a subscription's accepted cursor but doesn't drain
# its unaccepted queue, so the next SubscriberServing still lists cursors
# at or below the accepted one. The reactor and the subscriber decide when
# the witness's pages are claimed and accepted, so a change there can move
# the witness off it.
checks = ["crates/zakura-network/src/zakura/header_sync", "crates/zakura-network/src/zakura/regulation/subscription"]

[typed]
harness = "header-sync/storage"
scenario = "crates/zakura-sim/tests/fixtures/header-authority-forks-sharing-a-header.json"
plan = "crates/zakura-sim/tests/fixtures/header-authority-forks-sharing-a-header.plan"
