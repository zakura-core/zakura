[limits]
budget_usd = 25
unit_bytes = 24000
max_seconds = 3300

[scope]
# Literal file paths, or directory paths ending in / (including descendants).
exclude_paths = [
    # Automation, simulation, test infrastructure, and documentation.
    ".github/",
    "crates/zakura-sim/",
    "crates/zakura-scheduler/",
    "crates/zakura-storage/",
    "crates/zakura-test/",
    "crates/zakura-rt/src/sim/",
    "crates/zakura-quic/src/sim/",
    "crates/zakura-network/src/zakura/testkit/",
    "qa/",
    ".oss-scanner/",
    "docs/",
    "AGENTS.md",
    "README.md",
    "CHANGELOG.md",
    "deploy/",

    # Standalone test and benchmark modules; source remains readable as context.
    "crates/xtask/tests/",
    "crates/zakura-chain/benches/",
    "crates/zakura-chain/src/block/tests/",
    "crates/zakura-chain/src/orchard/tests/",
    "crates/zakura-chain/src/sapling/tests.rs",
    "crates/zakura-chain/src/sapling/tests/",
    "crates/zakura-chain/src/transaction/tests/",
