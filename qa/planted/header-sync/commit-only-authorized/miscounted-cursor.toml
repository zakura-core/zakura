# The subscriber records each claimed page's cursor one byte past what the
# subscription's pages consumed, and acceptance and later updates carry
# that cursor unchanged.
# The reactor, the subscriber and the queue decide how the witness's rounds
# start, stage and are credited, so a change there can move the witness off
# it.
checks = ["crates/zakura-network/src/zakura/header_sync"]

[typed]
harness = "header-sync/storage"
scenario = "crates/zakura-sim/tests/fixtures/header-authority-forks-sharing-a-header.json"
plan = "crates/zakura-sim/tests/fixtures/header-authority-forks-sharing-a-header.plan"
