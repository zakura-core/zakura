name: PR node reaper

# Hourly cleanup backstop for the ephemeral PR-node fleet (zakura-pr-node.yml /
# zakura-pr-node-bake.yml). Run droplets are intentionally kept alive after
# their run for SSH inspection; this deletes them (and every other leaked
# resource) on a TTL so nothing accrues cost indefinitely:
#   - zakura-pr-node and zakura-mempool-load droplets older than
#     max_age_hours (default 24h)
#   - zakura-image-bake droplets older than 6h (failed bakes)
#   - detached zakura-pr-* volumes older than 2h (run/bake leftovers)
#   - zakura-pr-node-* images beyond the newest 2
#   - mainnet/testnet state snapshots beyond their retention windows, while
#     preserving the newest Mainnet snapshot below the current VCT handoff
#   - dedicated VCT approach snapshots beyond the newest 2

on:
  workflow_dispatch:
    inputs:
      max_age_hours:
        description: "Delete run droplets older than this many hours"
        required: false
        default: "24"
  schedule:
    - cron: "17 * * * *" # hourly

permissions:
  contents: read

concurrency:
  group: zakura-pr-node-reaper
  cancel-in-progress: false

jobs:
  reap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Only for the local composite action below; the reap steps need no
      # repository content.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # API-only job: no SSH key needed.
      - name: Install doctl
        uses: ./.github/actions/do-cli
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Reap expired droplets
        env:
          MAX_AGE_HOURS: ${{ inputs.max_age_hours || '24' }}
        run: |
          set -euo pipefail
          # JSON output: `doctl droplet list --format` has no creation-time
          # column (it silently renders `<nil>`), so age-based sweeps must go
          # through `created_at` in the JSON.
          reap_tag() {
            local tag="$1" max_age_secs="$2"
            doctl compute droplet list --tag-name "$tag" --output json | \
              jq -r --argjson now "$(date +%s)" --argjson max "$max_age_secs" \
                '(. // [])[] | select(($now - (.created_at | fromdateiso8601)) > $max)
                 | "\(.id) \(.name) \(.created_at)"' | \
            while read -r id name created; do
              echo "deleting droplet $name (id $id, created $created)"
              doctl compute droplet delete "$id" -f || true
            done
          }
          reap_tag zakura-pr-node    $(( MAX_AGE_HOURS * 3600 ))
          reap_tag zakura-image-bake $(( 6 * 3600 ))
          # Mempool-load droplets normally tear themselves down at the end of
          # the run; this is the backstop for a cancelled or crashed job.
          reap_tag zakura-mempool-load $(( MAX_AGE_HOURS * 3600 ))

      - name: Reap detached state volumes
        env:
          MAX_AGE_HOURS: ${{ inputs.max_age_hours || '24' }}
        run: |
          set -euo pipefail
          # Give volumes from the droplet sweep above a moment to detach.
          sleep 30
          # Detached zakura-pr-* volumes are always garbage in this system:
          # live runs keep theirs attached, and 2h clears the create->attach
          # window with a wide margin. A dispatch with a lower max_age_hours
          # (an emergency sweep) lowers this TTL with it.
          VOL_TTL=$(( MAX_AGE_HOURS * 3600 < 2 * 3600 ? MAX_AGE_HOURS * 3600 : 2 * 3600 ))
          # JSON output: like droplets, the volume table has no usable
          # creation-time column.
          doctl compute volume list --output json | \
            jq -r --argjson now "$(date +%s)" --argjson max "$VOL_TTL" \
              '(. // [])[]
               | select(.name | startswith("zakura-pr-"))
               | select((.droplet_ids // []) == [])
               | select(($now - (.created_at | fromdateiso8601)) > $max)
               | "\(.id) \(.name) \(.created_at)"' | \
          while read -r id name created; do
            echo "deleting detached volume $name (id $id, created $created)"
            doctl compute volume delete "$id" -f || true
          done

      - name: Prune old images and volume snapshots
        run: |
          set -euo pipefail
          doctl compute image list-user --format ID,Name --no-header | \
            awk '$2 ~ /^zakura-pr-node-/ {print $2, $1}' | sort | head -n -2 | \
            while read -r name id; do
              echo "deleting image $name (id $id)"
              doctl compute image delete "$id" -f || true
            done
          MAINNET_C=$(tail -1 zakura-chain/src/parameters/checkpoint/main-checkpoints.txt | cut -d' ' -f1)
          [[ "$MAINNET_C" =~ ^[0-9]+$ ]] || {
            echo "could not determine the current Mainnet handoff height" >&2
            exit 1
          }
          for NET in mainnet testnet; do
            case "$NET" in
              mainnet) KEEP=6 ;;
              testnet) KEEP=3 ;;
            esac
            SNAPSHOTS=$(mktemp)
            KEEP_NAMES=$(mktemp)
            doctl compute snapshot list --resource volume --format ID,Name --no-header | \
              awk -v pre="zakura-pr-state-${NET}-" 'index($2, pre) == 1 {print $2, $1}' | \
              sort > "$SNAPSHOTS"
            tail -n "$KEEP" "$SNAPSHOTS" | awk '{print $1}' > "$KEEP_NAMES"

            # This dynamically pins one approach snapshot. When checkpoints
            # advance, the newest retained snapshot below the new handoff
            # replaces the old pin without duplicating the large volume.
            if [ "$NET" = "mainnet" ]; then
              PINNED_NAME=""
              while read -r name _id; do
                height=$(printf '%s' "$name" | sed -n 's/.*-h\([0-9][0-9]*\)$/\1/p')
                if [ -n "$height" ] && [ "$height" -lt "$MAINNET_C" ]; then
                  PINNED_NAME="$name"
                fi
              done < "$SNAPSHOTS"
              if [ -n "$PINNED_NAME" ]; then
                echo "$PINNED_NAME" >> "$KEEP_NAMES"
                echo "pinning Mainnet approach snapshot $PINNED_NAME below handoff $MAINNET_C"
              else
                APPROACH_AVAILABLE=false
                while read -r name _id; do
                  height=$(printf '%s' "$name" | sed -n 's/.*-h\([0-9][0-9]*\)$/\1/p')
                  if [ -n "$height" ] && [ "$height" -lt "$MAINNET_C" ]; then
                    APPROACH_AVAILABLE=true
                  fi
                done < <(
                  doctl compute snapshot list --resource volume --format ID,Name --no-header | \
                    awk '$2 ~ /^zakura-vct-approach-mainnet-/ {print $2, $1}'
                )
                if [ "$APPROACH_AVAILABLE" != "true" ]; then
                  LEGACY_NAME=$(awk '$1 !~ /-h[0-9]+$/ { print $1; exit }' "$SNAPSHOTS")
                  if [ -n "$LEGACY_NAME" ]; then
                    echo "$LEGACY_NAME" >> "$KEEP_NAMES"
                    echo "pinning transition snapshot $LEGACY_NAME until a verified approach exists"
                  else
                    echo "::warning::no Mainnet snapshot exists below handoff $MAINNET_C"
                  fi
                fi
              fi
            fi

            while read -r name id; do
              if awk -v name="$name" '$0 == name { found=1 } END { exit !found }' "$KEEP_NAMES"; then
                continue
              fi
                echo "deleting volume snapshot $name (id $id)"
                doctl compute snapshot delete "$id" -f || true
            done < "$SNAPSHOTS"
            rm -f "$SNAPSHOTS" "$KEEP_NAMES"
          done
          doctl compute snapshot list --resource volume --format ID,Name --no-header | \
            awk '$2 ~ /^zakura-vct-approach-mainnet-/ {print $2, $1}' | \
            sort | head -n -2 | \
            while read -r name id; do
              echo "deleting old VCT approach snapshot $name (id $id)"
              doctl compute snapshot delete "$id" -f || true
            done
