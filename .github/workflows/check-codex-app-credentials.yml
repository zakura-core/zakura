name: Check Codex App credentials

on:
  push:
    branches: [adam/check-codex-app-credentials]
    paths: [.github/workflows/check-codex-app-credentials.yml]

permissions: {}

jobs:
  verify:
    if: github.repository == 'zakura-core/zakura'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify stored key and read App installation
        env:
          APP_PRIVATE_KEY: ${{ secrets.CODEX_APPROVAL_APP_PRIVATE_KEY }}
          APP_CLIENT_ID: ${{ vars.CODEX_APPROVAL_APP_CLIENT_ID }}
          APP_ID: ${{ vars.CODEX_APPROVAL_APP_ID }}
        run: |
          python3 - <<'PYTHON'
          import base64
          import json
          import os
          import subprocess
          import sys
          import tempfile
          import time
          import urllib.error
          import urllib.request

          def stop(message):
              print(message, flush=True)
              sys.exit(1)

          raw = os.environ.pop("APP_PRIVATE_KEY", "").encode()
          if not raw.strip():
              stop("FAIL: CODEX_APPROVAL_APP_PRIVATE_KEY is missing or empty.")
          parsed = subprocess.run(
              ["openssl", "pkey", "-inform", "PEM", "-passin", "pass:", "-outform", "PEM"],
              input=raw, capture_output=True, timeout=15)
          if parsed.returncode:
              stop("FAIL: The stored secret is not a valid unencrypted PEM private key. No secret content was logged.")
          checked = subprocess.run(
              ["openssl", "rsa", "-check", "-noout", "-passin", "pass:"],
              input=parsed.stdout, capture_output=True, timeout=15)
          if checked.returncode:
              stop("FAIL: The stored secret is not a valid RSA private key.")
          print("PASS: The stored secret is a valid RSA private key.", flush=True)
          client_id = os.environ["APP_CLIENT_ID"]
          app_id = int(os.environ["APP_ID"])
          now = int(time.time())
          def encode(value):
              return base64.urlsafe_b64encode(value).rstrip(b"=")
          unsigned = encode(b'{"alg":"RS256","typ":"JWT"}') + b"." + encode(
              json.dumps({"iat": now - 60, "exp": now + 300, "iss": client_id}).encode())
          with tempfile.NamedTemporaryFile() as key_file:
              key_file.write(parsed.stdout)
              key_file.flush()
              signed = subprocess.run(
                  ["openssl", "dgst", "-sha256", "-sign", key_file.name],
                  input=unsigned, capture_output=True, timeout=15)
          if signed.returncode:
              stop("FAIL: Unable to sign an App authentication request.")
          token = (unsigned + b"." + encode(signed.stdout)).decode()

          def get(path):
              request = urllib.request.Request("https://api.github.com" + path, headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "zakura-app-credential-check"})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      raw_response = response.read(1048577)
                  if len(raw_response) > 1048576:
                      stop("FAIL: GitHub response exceeded the size limit.")
                  return json.loads(raw_response)
              except urllib.error.HTTPError as error:
                  stop(f"FAIL: GitHub GET {path} returned HTTP {error.code}. No response body or credentials were logged.")
              except Exception:
                  stop("FAIL: Unable to read GitHub state. No request details were logged.")

          app = get("/app")
          if (app.get("id") != app_id or app.get("client_id") != client_id
                  or app.get("slug") != "zakura-codex-approver"
                  or (app.get("owner") or {}).get("login") != "zakura-core"):
              stop("FAIL: Authenticated App identity does not match the configured approval App.")
          print("PASS: The key authenticates as zakura-codex-approver and matches the configured IDs.", flush=True)
          installation = get("/repos/zakura-core/zakura/installation")
          details = {
              "repository": "zakura-core/zakura",
              "installation_id": installation.get("id"),
              "app_id": installation.get("app_id"),
              "account": (installation.get("account") or {}).get("login"),
              "repository_selection": installation.get("repository_selection"),
              "permissions": installation.get("permissions"),
              "suspended_at": installation.get("suspended_at"),
          }
          print(json.dumps(details, sort_keys=True), flush=True)
          if details["app_id"] != app_id or details["account"] != "zakura-core":
              stop("FAIL: Repository installation identity mismatch.")
          if details["suspended_at"] is not None:
              stop("FAIL: The App installation is suspended.")
          if (details["permissions"] or {}).get("pull_requests") != "write":
              stop("FAIL: The installation does not grant Pull requests: read and write.")
          print("PASS: The App is installed on zakura-core/zakura with Pull requests: read and write.", flush=True)
          print("Read-only verification complete. No approvals, settings, permissions, or Slack messages were changed.")
          PYTHON
