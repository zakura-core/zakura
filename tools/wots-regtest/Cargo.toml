[package]
name = "zakura-wots-regtest"
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
publish = false

# Keep the disposable-key experiment out of the production wallet dependency graph.
[workspace]

[dependencies]
zcash_address = { package = "zakura-address", git = "https://github.com/zakura-core/common", rev = "172c9c31084e8846514e9e21cfe2cf0967e22b65" }
zcash_primitives = { package = "zakura-primitives", git = "https://github.com/zakura-core/common", rev = "172c9c31084e8846514e9e21cfe2cf0967e22b65", default-features = false, features = ["std", "backend-halo2"] }
zcash_transparent = { package = "zakura-transparent", git = "https://github.com/zakura-core/common", rev = "172c9c31084e8846514e9e21cfe2cf0967e22b65", features = ["transparent-inputs", "experimental-wots"] }
zcash_protocol = { package = "zakura-protocol", git = "https://github.com/zakura-core/common", rev = "172c9c31084e8846514e9e21cfe2cf0967e22b65" }
zcash_script = { git = "https://github.com/p0mvn/zcash_script", rev = "c9c5f0c04961d6313b6ee49b1121c6786223018f" }
getrandom = { version = "0.4", features = ["sys_rng"] }
secp256k1 = { version = "0.33", features = ["std"] }
sha2 = "0.10"
ripemd = "0.1"
hex = "0.4"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
tempfile = "3"

[profile.dev]
debug = 0
