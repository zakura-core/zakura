nu7-experimental = [
    "zakura-chain/nu7-experimental",
]

fuzz-impl = []
test-support = []

[dependencies]
chrono = { workspace = true }
rayon = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
zakura-chain = { path = "../zakura-chain", version = "8.0.0" }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
toml = { workspace = true }
zakura-test = { path = "../zakura-test/", version = "2.1.0" }

[[bench]]
name = "retention"
harness = false
required-features = ["test-support"]

[lints]
workspace = true
