# The reader skips a frame whose header the frame filter refuses as
# shorter than its row's minimum, reading and dropping its payload,
# instead of closing the connection. Its input is the focused scenario of
# a page a byte below the row's minimum, so
# `header-sync/s5v9/headers/short-payload-closes` is the only ID it
# breaks.
# Besides the files the patch changes, the rest of these decide which
# frames the input's peers send and when the node judges them. A change
# there can move the input off its frame.
checks = ["crates/zakura-network/src/zakura/transport", "crates/zakura-network/src/zakura/header_sync"]

[typed]
harness = "header-sync/wire"
scenario = "crates/zakura-sim/tests/fixtures/header-wire-planted-headers-short-payload.json"
plan = "crates/zakura-sim/tests/fixtures/header-wire-default.plan"
