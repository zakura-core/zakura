[[audits.equihash]]
who = "Claude Opus 5 <noreply@anthropic.com>"
criteria = "safe-to-deploy"
version = "0.3.0"
notes = "Reviewed all packaged source, manifest, build script, the verification path, the minimal-encoding codec, and the optional tromp solver bindings. The default verification path is no_std with no unsafe code: is_valid_solution validates the parameters, rejects any solution whose length does not match the encoding, and every allocation downstream is proportional to that length-checked input. The build script compiles the bundled tromp C sources only under the solver feature, which this workspace enables solely through zakura-chain's internal-miner feature; the FFI shims box a blake2b state across the boundary and copy each solution out of solver-owned memory before use. One caller precondition is worth recording: the documented limit that row indices fit in 32 bits is enforced by an assertion, so out-of-range parameters such as n=520,k=9 or n=256,k=3 panic inside indices_from_minimal instead of returning InvalidParams, reproduced with solutions of the matching length. Zakura passes network constants here, not attacker-controlled values. All 6 unit tests passed with all features, including the tromp solver round-trip."

