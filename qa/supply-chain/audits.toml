[[audits.crossbeam-deque]]
who = "Claude Opus 5 <noreply@anthropic.com>"
criteria = "safe-to-deploy"
version = "0.8.7"
notes = "Reviewed all packaged source, manifest, build script, and tests. The Chase-Lev deque's unsafe reads are guarded by the front/back index protocol: the stealer only returns a task after the compare-exchange on the front index succeeds, and the buffer is retired through crossbeam-epoch rather than freed in place. The build script only classifies the target for atomic support and emits cfgs. All 72 tests passed with all features, including the crate's randomized steal-and-push stress tests."

[[audits.crossbeam-epoch]]
who = "Claude Opus 5 <noreply@anthropic.com>"
criteria = "safe-to-deploy"
version = "0.9.20"
notes = "Reviewed the manifest, build script, the epoch-reclamation design documentation, and the unsafe surface. The safety argument rests on the pinning protocol: a Shared pointer borrows from the Guard that produced it, deferred destructors run only once the global epoch has advanced past every pinned participant, and the genuinely unchecked entry points, deref, into_owned, defer_unchecked, and defer_destroy, are all unsafe fn with their preconditions documented. The build script only classifies the target for atomic support and emits cfgs. All 93 tests passed with all features."

[[audits.crossbeam-utils]]
who = "Claude Opus 5 <noreply@anthropic.com>"
criteria = "safe-to-deploy"
version = "0.8.22"
notes = "Reviewed all packaged source, manifest, build script, and tests. AtomicCell is repr(transparent) over UnsafeCell<MaybeUninit<T>> and uses native atomics where the type permits, falling back to an address-indexed seqlock otherwise; CachePadded, Backoff, Parker, ShardedLock, and the scoped threads carry the usual documented invariants, and the build script only classifies the target for atomic support. One thing is worth recording: the seqlock fallback's optimistic read is a data race by the letter of the model even though it discards the value when the stamp check fails, which the source itself flags as a known upstream issue; it affects only types too large or non-atomic for a native instruction. All 220 tests passed with all features."

