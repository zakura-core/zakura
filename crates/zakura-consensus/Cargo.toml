[package]
name = "zakura-consensus"
version = "12.0.0"
authors.workspace = true
description = "Implementation of Zcash consensus checks for the Zakura node. Internal crate, published to support cargo install zakura"
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

# Disable bench auto-discovery so `benches/common.rs` is only compiled when
# explicitly imported via `mod common;` from a bench.
autobenches = false

readme = "../../README.md"
# crates.io is limited to 5 keywords and categories
keywords.workspace = true
# Must be one of <https://crates.io/category_slugs>
categories = ["asynchronous", "cryptography::cryptocurrencies"]

[features]
default = []

# Legacy flags accepted for build compatibility; the progress display is removed.
progress-bar = ["howudoin", "zakura-state/progress-bar"]
howudoin = []

# Test-only features
internal-bench = []
proptest-impl = ["proptest", "proptest-derive", "zakura-chain/proptest-impl", "zakura-state/proptest-impl"]

[dependencies]
blake2b_simd = { workspace = true }
bellman = { workspace = true }
bls12_381 = { workspace = true }
halo2 = { workspace = true }
rand_10 = { workspace = true }
# ed25519-zebra takes `rand_core` 0.6 RNGs.
rand_core = { workspace = true, features = ["getrandom"] }
rayon = { workspace = true }

chrono = { workspace = true }
serde = { workspace = true, features = ["serde_derive"] }
futures = { workspace = true }
futures-core = { workspace = true }
futures-util = { workspace = true }
metrics = { workspace = true }
thiserror = { workspace = true }
pin-project = { workspace = true }
tokio = { workspace = true, features = ["time", "sync", "macros", "rt-multi-thread"] }
tokio-util = { workspace = true }
tower = { workspace = true, features = ["timeout", "util", "buffer"] }
tracing = { workspace = true }
getset = { workspace = true }

sapling-crypto = { workspace = true, features = ["multicore", "pinned-vk-only"] }
orchard.workspace = true

zcash_transparent = { workspace = true }
zcash_script = { workspace = true }
zcash_primitives = { workspace = true }

zakura-script = { path = "../zakura-script", version = "5.0.0" }
zakura-state = { path = "../zakura-state", version = "11.0.0" }
zakura-node-services = { path = "../zakura-node-services", version = "5.0.0" }
zakura-chain = { path = "../zakura-chain", version = "10.0.0" }
zakura-header-chain = { path = "../zakura-header-chain", version = "5.0.0" }

zcash_protocol.workspace = true


# Test-only dependencies
proptest = { workspace = true, optional = true }
proptest-derive = { workspace = true, optional = true }

[dev-dependencies]
eyre = { workspace = true }
ed25519-zebra = { workspace = true }

hex = { workspace = true }
proptest = { workspace = true }
proptest-derive = { workspace = true }
toml = { workspace = true, features = ["display"] }

tokio = { workspace = true, features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "test-util", "time"] }

zakura-state = { path = "../zakura-state", version = "11.0.0", features = ["proptest-impl"] }
zakura-chain = { path = "../zakura-chain", version = "10.0.0", features = ["proptest-impl"] }
zakura-test = { path = "../zakura-test/", version = "4.0.0" }

criterion = { workspace = true }

[[bench]]
name = "groth16"
harness = false

[[bench]]
name = "halo2"
harness = false

[[bench]]
name = "sapling"
harness = false

[[bench]]
name = "worst_case_tx_verification"
harness = false

[[bench]]
name = "state_read_routing"
harness = false
required-features = ["internal-bench"]

[lints]
workspace = true
