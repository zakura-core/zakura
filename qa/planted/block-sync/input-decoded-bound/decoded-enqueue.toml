# Adds an alternate enqueue path that keeps the routine's decoded block
# beside the raw bytes, as the routine did before #1522's fix. The body
# reaches the queue through the same constructor, so the queue's decoded
# gauge stays at zero. Every matched body takes the path, so the input's
# first queued body violates the property.
input = "crates/zakura-sim/tests/fixtures/block-sync-stalled-reset.bin"
# Besides peer_routine.rs and sequencer_task.rs, which the patch changes,
# the rest of block sync decides which path a body takes to the queue. A
# change there can move the input's bodies off the matched path.
checks = ["crates/zakura-network/src/zakura/block_sync"]
