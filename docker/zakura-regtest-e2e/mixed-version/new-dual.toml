# Zakura mixed-version e2e: NEW dual-stack node (the binary under test).
#
# Speaks p2p-v2/5. It dials old-dual over legacy TCP; both advertise the P2P-v2
# service bit, so the upgrade prelude runs, finds no shared protocol version,
# and must leave the legacy connection up. It is the native v2 bootstrap peer
# for new-zakura, so it bridges the two cohorts.

[network]
network = "Regtest"
listen_addr = "127.0.0.1:28433"
p2p_stack = "dual"
cache_dir = false
initial_testnet_peers = ["127.0.0.1:28233"]
max_connections_per_ip = 10
# Log real peer addresses, so the harness can tell which connection a peer-set
# disconnect line names.
expose_peer_addresses = true
# Fixed identity. The harness reads the node ID this key gives under the new
# derivation (the hash of the credential's key list) from the startup log.
zakura_node_secret_key = "3333333333333333333333333333333333333333333333333333333333333333"

[network.zakura]
listen_addr = "127.0.0.1:28434"

[state]
ephemeral = true

[rpc]
listen_addr = "127.0.0.1:28432"
enable_cookie_auth = false

[metrics]
endpoint_addr = "127.0.0.1:29003"

[mining]
internal_miner = false
# Regtest uses testnet address encoding; needed so `generate` can build coinbases.
miner_address = "tmJymvcUCn1ctbghvTJpXBwHiMEB8P6wxNV"

[tracing]
# Plain logs keep the harness greps free of ANSI escapes. The handshake module
# logs each rejected legacy->v2 upgrade at debug level.
use_color = false
filter = "info,zakura_network::zakura=debug,zakura_network::peer::handshake=debug"
