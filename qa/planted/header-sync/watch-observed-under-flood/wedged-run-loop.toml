# The run loop stops for good once the committed watch holds the fixture's
# commit, before it reads it. It then takes no event and reads nothing, so
# the wire flood fills its queue and the run settles with the publication
# unread and no shutdown begun. A correct loop always has its watch arm
# ready then, so the settled end breaks the rule.
input = "crates/zakura-sim/tests/fixtures/header-flood-wire.bin"
# Besides reactor.rs, which the patch changes, the session receiver and the
# queues decide how fast wire events arrive and when the commit lands.
checks = ["crates/zakura-network/src/zakura/header_sync"]
# The wedge leaves the same publication unread under both queues' watch
# rules, so the settled end breaks the other fixture's rule too, about that
# publication: the case's set is both (C6's per-subject end join).
set = ["header-sync/watch-observed-under-lifecycle-flood"]
