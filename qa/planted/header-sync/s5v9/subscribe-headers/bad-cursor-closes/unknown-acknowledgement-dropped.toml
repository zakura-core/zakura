# The publisher drops an update that the subscription rules refuse with
# `UnknownAcknowledgement`, as it drops a crossed update, instead of
# refusing it, so the reader keeps the connection open. Its input is the
# saved bad-cursor Plan, whose adversary's `Grant` acknowledges a cursor
# with its hash changed, so
# `header-sync/s5v9/subscribe-headers/bad-cursor-closes` is the only ID it
# breaks.
# Besides the files the patch changes, the rest of these decide which
# frames the input's peers send and when the node judges them. A change
# there can move the input off its frame.
input = "crates/zakura-sim/tests/fixtures/header-wire-bad-cursor.bin"
checks = ["crates/zakura-network/src/zakura/header_sync", "crates/zakura-network/src/zakura/regulation"]
