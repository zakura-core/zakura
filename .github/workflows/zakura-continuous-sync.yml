name: Zakura continuous genesis sync fleet

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Operation to run"
        required: true
        type: choice
        default: status
        options:
          - deploy
          - status
          - resume
          - audit
          - candidate-start
          - candidate-collect
          - candidate-cleanup
      node:
        description: "Optional node name; blank targets the whole fleet"
        required: false
        type: string
        default: ""
      no_start:
        description: "For deploy: install files but do not start the controller"
        required: false
        type: boolean
        default: false
      candidate_ref:
        description: "Candidate start: branch/tag/SHA; blank uses the selected workflow branch SHA"
        type: string
        default: ""
      baseline_ref:
        description: "Candidate start: baseline branch/tag/SHA, pinned at launch"
        type: string
        default: "main"
      candidate_mode:
        description: "Candidate comparison networking mode"
        type: choice
        options: [dual, zakura]
        default: dual
      candidate_run_id:
        description: "Collect/cleanup: workflow run ID that launched the two temporary hosts"
        type: string
        default: ""
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read

concurrency:
  group: ${{ startsWith(inputs.action, 'candidate-') && 'zakura-genesis-candidates' || 'zakura-continuous-sync' }}
  cancel-in-progress: false

jobs:
  fleet:
    if: ${{ !startsWith(inputs.action, 'candidate-') }}
    name: "Continuous sync ${{ github.event_name == 'schedule' && 'audit' || inputs.action }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - name: Resolve operation
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ACTION: ${{ inputs.action }}
          INPUT_NODE: ${{ inputs.node }}
          INPUT_NO_START: ${{ inputs.no_start }}
        run: |
          set -euo pipefail
          # Reject a node name outside the fleet naming scheme before it reaches
          # $GITHUB_ENV and the later ssh steps. The charset excludes newlines,
          # so a multiline value cannot inject extra environment variables
          # (e.g. overriding ACTION to bypass the audit-only schedule path).
          if [ -n "${INPUT_NODE}" ] && ! [[ "${INPUT_NODE}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "invalid node: allowed chars [A-Za-z0-9._-]" >&2
            exit 1
          fi
          if [ "${EVENT_NAME}" = "schedule" ]; then
            {
              echo "ACTION=audit"
              echo "NODE="
              echo "NO_START=false"
            } >> "$GITHUB_ENV"
          else
            {
              echo "ACTION=${INPUT_ACTION}"
              echo "NODE=${INPUT_NODE}"
              echo "NO_START=${INPUT_NO_START}"
            } >> "$GITHUB_ENV"
          fi

      - name: Configure SSH
        env:
          DO_SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DO_SSH_PRIVATE_KEY}" ]; then
            echo "::error::DO_SSH_PRIVATE_KEY is required for the continuous sync fleet"
            exit 1
          fi

          mapfile -t ssh_targets < <(
            python3 - <<'PY'
          import tomllib

          with open("deploy/continuous-sync/nodes.toml", "rb") as config_file:
              config = tomllib.load(config_file)

          for node in config.get("nodes", []):
              print(node["ssh_string"])
          PY
          )
          if [ "${#ssh_targets[@]}" -eq 0 ]; then
            echo "::error::No continuous sync nodes found in nodes.toml"
            exit 1
          fi

          install -d -m 700 ~/.ssh
          : > ~/.ssh/known_hosts
          for target in "${ssh_targets[@]}"; do
            host="${target##*@}"
            ssh-keyscan -T 30 -H "$host" >> ~/.ssh/known_hosts
          done
          chmod 600 ~/.ssh/known_hosts

          install -m 600 /dev/null ~/.ssh/zakura-continuous-sync
          printf '%s\n' "${DO_SSH_PRIVATE_KEY}" > ~/.ssh/zakura-continuous-sync
          ssh-keygen -y -f ~/.ssh/zakura-continuous-sync >/dev/null
          {
            printf 'Host'
            for target in "${ssh_targets[@]}"; do
              printf ' %s' "${target##*@}"
            done
            printf '\n  IdentityFile ~/.ssh/zakura-continuous-sync\n'
            printf '  IdentitiesOnly yes\n'
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

          for target in "${ssh_targets[@]}"; do
            if ! ssh -o BatchMode=yes -o ConnectTimeout=15 "$target" true; then
              echo "::error::Continuous sync SSH authentication failed for $target; verify the DO_SSH_PRIVATE_KEY secret and zebra-ci authorized key"
              exit 1
            fi
          done

      - name: Deploy controllers
        if: env.ACTION == 'deploy'
        run: |
          set -euo pipefail
          args=(deploy)
          if [ "${NO_START}" = "true" ]; then
            args+=(--no-start)
          fi
          if [ -n "${NODE}" ]; then
            python3 deploy/continuous-sync/deploy.py --node "${NODE}" "${args[@]}"
          else
            python3 deploy/continuous-sync/deploy.py "${args[@]}"
          fi

      - name: Show status
        if: env.ACTION == 'status'
        run: |
          set -euo pipefail
          if [ -n "${NODE}" ]; then
            python3 deploy/continuous-sync/deploy.py --node "${NODE}" status
          else
            python3 deploy/continuous-sync/deploy.py status
          fi

      - name: Resume controllers
        if: env.ACTION == 'resume'
        run: |
          set -euo pipefail
          if [ -z "${NODE}" ]; then
            echo "::error::resume requires a single node input"
            exit 1
          fi
          python3 deploy/continuous-sync/deploy.py --node "${NODE}" resume

      # The audit runs every 30 minutes but must not re-page an unchanged failure
      # that often, so its alert state is carried between runs through the cache.
      # Each run saves under a unique key and restores the most recent one by prefix.
      - name: Restore audit alert state
        if: env.ACTION == 'audit'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: .audit-alert-state
          key: continuous-sync-audit-state-${{ github.run_id }}
          restore-keys: |
            continuous-sync-audit-state-

      - name: Audit controllers
        if: env.ACTION == 'audit'
        run: |
          set -euo pipefail
          mkdir -p .audit-alert-state
          args=(audit)
          args+=(--state-file .audit-alert-state/state.json)
          args+=(--reminder-interval "${REMINDER_INTERVAL}")
          args+=(--max-completion-age "${MAX_COMPLETION_AGE}")
          if [ -n "${NODE}" ]; then
            python3 deploy/continuous-sync/deploy.py --node "${NODE}" "${args[@]}"
          else
            python3 deploy/continuous-sync/deploy.py "${args[@]}"
          fi
        env:
          SLACK_WEB_HOOK: ${{ secrets.SLACK_WEB_HOOK }}
          # Remind about an unresolved failure daily; routine summaries have a host timer.
          REMINDER_INTERVAL: "86400"
          # A run is capped at 48h, so only flag a node that has not completed one
          # in four days -- long enough that a legitimately long run cannot trip it.
          MAX_COMPLETION_AGE: "345600"

      # Runs even when the audit exits non-zero, or a persistent failure would
      # never record its `last_sent` and would re-page on every cycle.
      - name: Save audit alert state
        if: always() && env.ACTION == 'audit'
        # Routine summary cursors live on the sender; this cache only tracks audit alerts.
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: .audit-alert-state
          key: continuous-sync-audit-state-${{ github.run_id }}

      - name: Check daily summary delivery
        if: always() && env.ACTION == 'audit'
        run: python3 deploy/continuous-sync/deploy.py summary-status

  candidate:
    name: "Isolated genesis comparison"
    if: ${{ github.event_name == 'workflow_dispatch' && startsWith(inputs.action, 'candidate-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/do-cli
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          ssh_private_key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
      - name: Start, collect, or clean only the isolated pair
        env:
          CANDIDATE_ACTION: ${{ inputs.action }}
          CANDIDATE_REF: ${{ inputs.candidate_ref || github.sha }}
          BASELINE_REF: ${{ inputs.baseline_ref || 'main' }}
          MODE: ${{ inputs.candidate_mode }}
          LAUNCH_RUN_ID: ${{ inputs.candidate_run_id }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          HARNESS_SHA: ${{ github.sha }}
          FINGERPRINT: ${{ vars.DO_SSH_KEY_FINGERPRINT }}
        run: |
          set -euo pipefail
          operation="${CANDIDATE_ACTION#candidate-}"
          args=("$operation" --out candidate-results)
          if [[ "$operation" == start ]]; then
            git fetch --depth=1 -- origin "$BASELINE_REF"
            baseline_sha=$(git rev-parse --verify 'FETCH_HEAD^{commit}')
            git fetch --depth=1 -- origin "$CANDIDATE_REF"
            candidate_sha=$(git rev-parse --verify 'FETCH_HEAD^{commit}')
            args+=(--run-id "$CURRENT_RUN_ID" --mode "$MODE" --baseline-sha "$baseline_sha"
              --candidate-sha "$candidate_sha" --harness-sha "$HARNESS_SHA" --fingerprint "$FINGERPRINT")
          else
            args+=(--run-id "$LAUNCH_RUN_ID")
          fi
          python3 deploy/continuous-sync/candidate.py "${args[@]}"
      - name: Preserve launch or collected evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: genesis-candidate-${{ github.run_id }}
          path: candidate-results/
          if-no-files-found: warn
      - name: Show result
        if: always()
        run: |
          if [[ -f candidate-results/summary.md ]]; then
            cat candidate-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
