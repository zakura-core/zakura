name: PR node

# Ephemeral 1-hour real-node test for a PR (or any ref) on DigitalOcean.
#
# Boots a droplet from the pre-baked PR-node image (deps + warm cargo cache,
# see zakura-pr-node-bake.yml), attaches a clone of the chosen chain-state
# volume snapshot, builds zakurad from the PR branch incrementally, runs it for
# `duration_minutes`, and posts a metrics summary as a PR comment.
#
# The droplet is kept alive afterwards for SSH inspection and is deleted by
# zakura-pr-node-reaper.yml within 24h (or immediately with
# teardown_after_run=true).

on:
  workflow_call:
    inputs:
      pr_number:
        description: "PR number to test (exactly one of pr_number / ref)"
        required: false
        type: string
        default: ""
      ref:
        description: "Branch, tag, or SHA to test (exactly one of pr_number / ref)"
        required: false
        type: string
        default: ""
      snapshot_mode:
        description: "Chain state to start from"
        required: false
        type: string
        default: tip
      network:
        description: "Network"
        required: false
        type: string
        default: mainnet
      duration_minutes:
        description: "Maximum time to monitor the running node"
        required: false
        type: string
        default: "60"
      droplet_size:
        description: "DigitalOcean droplet size"
        required: false
        type: string
        default: c-8
      teardown_after_run:
        description: "Delete the droplet immediately after the run"
        required: false
        type: boolean
        default: true
      p2p_stack:
        description: "P2P stack to exercise"
        required: false
        type: string
        default: default
    outputs:
      target_sha:
        value: ${{ jobs.node.outputs.target_sha }}
      max_checkpoint:
        value: ${{ jobs.node.outputs.max_checkpoint }}
      start_height:
        value: ${{ jobs.node.outputs.start_height }}
      end_height:
        value: ${{ jobs.node.outputs.end_height }}
      verdict:
        value: ${{ jobs.node.outputs.verdict }}
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to test (exactly one of pr_number / ref)"
        required: false
      ref:
        description: "Branch, tag, or SHA to test (exactly one of pr_number / ref)"
        required: false
      snapshot_mode:
        description: "Chain state to start from (pre-checkpoint: newest retained tip snapshot below the last checkpoint)"
        type: choice
        options: [tip, pre-checkpoint, sandblast, genesis]
        default: tip
      network:
        description: "Network (sandblast is mainnet-only)"
        type: choice
        options: [mainnet, testnet]
        default: mainnet
      duration_minutes:
        description: "How long to monitor the running node"
        required: false
        default: "60"
      droplet_size:
        description: "Droplet size (disk must be >= the baked image's disk)"
        required: false
        default: c-8
      p2p_stack:
        description: "P2P stack to exercise"
        type: choice
        options: [default, legacy, zakura, dual]
        default: default
      teardown_after_run:
        description: "Delete the droplet immediately after the run"
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: zakura-pr-node-${{ inputs.pr_number || inputs.ref }}
  cancel-in-progress: false

jobs:
  node:
    runs-on: ubuntu-latest
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
      max_checkpoint: ${{ steps.target.outputs.max_ckpt }}
      start_height: ${{ steps.result.outputs.start_height }}
      end_height: ${{ steps.result.outputs.end_height }}
      verdict: ${{ steps.result.outputs.verdict }}
    # duration_minutes (<=60 typically) + incremental build + provisioning overhead.
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate inputs and resolve target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REF: ${{ inputs.ref }}
          MODE: ${{ inputs.snapshot_mode }}
          NETWORK: ${{ inputs.network }}
        run: |
          set -euo pipefail
          if [ "${MODE}" = "sandblast" ] && [ "${NETWORK}" != "mainnet" ]; then
            echo "snapshot_mode=sandblast is mainnet-only (the spam region is a mainnet range)" >&2
            exit 1
          fi
          if { [ -n "${PR_NUMBER}" ] && [ -n "${REF}" ]; } || { [ -z "${PR_NUMBER}" ] && [ -z "${REF}" ]; }; then
            echo "provide exactly one of pr_number / ref" >&2
            exit 1
          fi
          if [ -n "${PR_NUMBER}" ]; then
            SHA=$(gh pr view "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --json headRefOid --jq .headRefOid)
            REFSPEC="refs/pull/${PR_NUMBER}/head"
            PR="${PR_NUMBER}"
            SLUG="pr${PR_NUMBER}"
          else
            SHA=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${REF}" --jq .sha)
            if [ "${REF}" = "${SHA}" ]; then
              REFSPEC="${SHA}"
            else
              REFSPEC="${REF}"
            fi
            # Best-effort: post the summary to an open PR whose head is this ref.
            PR=$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${REF}" --state open \
                   --json number --jq '.[0].number // empty' 2>/dev/null || true)
            SLUG=$(echo "${REF}" | tr -c 'a-zA-Z0-9' '-' | tr -s '-' | sed 's/^-//; s/-$//' | cut -c1-24)
          fi
          echo "Testing ${SHA} (${REFSPEC}), PR: ${PR:-none}"
          # pre-checkpoint needs the target tree's max checkpoint to pick a
          # state snapshot below it.
          MAX_CKPT=""
          if [ "${MODE}" = "pre-checkpoint" ]; then
            case "${NETWORK}" in
              mainnet) CKPT_PATH=zakura-chain/src/parameters/checkpoint/main-checkpoints.txt ;;
              testnet) CKPT_PATH=zakura-chain/src/parameters/checkpoint/test-checkpoints.txt ;;
            esac
            MAX_CKPT=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${CKPT_PATH}?ref=${SHA}" \
              -H "Accept: application/vnd.github.raw" | tail -1 | cut -d' ' -f1)
            [[ "${MAX_CKPT}" =~ ^[0-9]+$ ]] || {
              echo "could not read the target tree's max checkpoint" >&2
              exit 1
            }
            echo "Target max checkpoint: ${MAX_CKPT}"
          fi
          {
            echo "sha=${SHA}"
            echo "refspec=${REFSPEC}"
            echo "pr=${PR}"
            echo "slug=${SLUG}"
            echo "max_ckpt=${MAX_CKPT}"
          } >> "$GITHUB_OUTPUT"

      - name: Install doctl
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          DOCTL_VERSION=1.120.0
          curl -sL "https://github.com/digitalocean/doctl/releases/download/v${DOCTL_VERSION}/doctl-${DOCTL_VERSION}-linux-amd64.tar.gz" | tar -xz -C /tmp
          sudo install /tmp/doctl /usr/local/bin/doctl
          doctl auth init -t "${DIGITALOCEAN_ACCESS_TOKEN}"

      - name: Write SSH key
        env:
          DO_SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
        run: |
          install -m 600 /dev/null /tmp/do_ssh
          printf '%s\n' "${DO_SSH_PRIVATE_KEY}" > /tmp/do_ssh

      - name: Pick baked image and state snapshot
        id: baked
        env:
          MODE: ${{ inputs.snapshot_mode }}
          NETWORK: ${{ inputs.network }}
          MAX_CKPT: ${{ steps.target.outputs.max_ckpt }}
        run: |
          set -euo pipefail
          IMAGE=$(doctl compute image list-user --format ID,Name --no-header | \
            awk '$2 ~ /^zakura-pr-node-/ {print $2, $1}' | sort | tail -1 | awk '{print $2}')
          if [ -z "${IMAGE}" ]; then
            echo "no zakura-pr-node-* image found; run the 'PR node image bake' workflow first" >&2
            exit 1
          fi
          echo "image_id=${IMAGE}" >> "$GITHUB_OUTPUT"
          if [ "${MODE}" = "genesis" ]; then
            echo "vol_snap_id=" >> "$GITHUB_OUTPUT"
            echo "snapshot_height=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SNAPS=$(doctl compute snapshot list --resource volume --format ID,Name --no-header | \
            awk -v pre="zakura-pr-state-${NETWORK}-" 'index($2, pre) == 1 {print $2, $1}' | sort)
          APPROACH_SNAPS=""
          if [ "${MODE}" = "pre-checkpoint" ] && [ "${NETWORK}" = "mainnet" ]; then
            APPROACH_SNAPS=$(doctl compute snapshot list --resource volume --format ID,Name --no-header | \
              awk '$2 ~ /^zakura-vct-approach-mainnet-/ {print $2, $1}' | sort)
          fi
          if [ -z "${SNAPS}" ] && [ -z "${APPROACH_SNAPS}" ]; then
            echo "no zakura-pr-state-${NETWORK}-* volume snapshot found; run the bake workflow first" >&2
            exit 1
          fi
          if [ "${MODE}" = "pre-checkpoint" ]; then
            # Newest retained snapshot whose baked state height (the -h<height>
            # name suffix) is below the target's max checkpoint: guarantees a
            # handoff crossing with the shortest possible sync.
            SEARCH_SNAPS=$(printf '%s\n%s\n' "${SNAPS}" "${APPROACH_SNAPS}" | awk 'NF' | sort)
            CANDIDATES=$(echo "${SEARCH_SNAPS}" | while read -r name id; do
              h=$(printf '%s' "$name" | sed -n 's/.*-h\([0-9][0-9]*\)$/\1/p')
              [ -n "$h" ] && [ "$h" -lt "${MAX_CKPT}" ] && echo "$h $name $id"
            done | sort -n || true)
            if [ -n "${CANDIDATES}" ]; then
              SELECTED=$(echo "${CANDIDATES}" | tail -1)
              SNAP=$(echo "${SELECTED}" | awk '{print $3}')
              SNAP_NAME=$(echo "${SELECTED}" | awk '{print $2}')
              echo "picked ${SNAP_NAME} (below max checkpoint ${MAX_CKPT})"
            else
              # Transition fallback for pre-existing date-only assets. The
              # restored DB tip is verified directly before the node starts.
              LEGACY_SNAPS=$(echo "${SNAPS}" | awk '$1 !~ /-h[0-9]+$/')
              if [ -z "${LEGACY_SNAPS}" ]; then
                echo "no retained ${NETWORK} snapshot is below the target's max checkpoint ${MAX_CKPT}; a handoff crossing is impossible" >&2
                exit 1
              fi
              SELECTED=$(echo "${LEGACY_SNAPS}" | head -1)
              SNAP=$(echo "${SELECTED}" | awk '{print $2}')
              SNAP_NAME=$(echo "${SELECTED}" | awk '{print $1}')
            fi
          else
            SELECTED=$(echo "${SNAPS}" | tail -1)
            SNAP=$(echo "${SELECTED}" | awk '{print $2}')
            SNAP_NAME=$(echo "${SELECTED}" | awk '{print $1}')
          fi
          echo "vol_snap_id=${SNAP}" >> "$GITHUB_OUTPUT"
          SNAPSHOT_HEIGHT=$(printf '%s' "${SNAP_NAME}" | sed -n 's/.*-h\([0-9][0-9]*\)$/\1/p')
          echo "snapshot_height=${SNAPSHOT_HEIGHT}" >> "$GITHUB_OUTPUT"

      - name: Create droplet (+ state volume)
        id: droplet
        env:
          MODE: ${{ inputs.snapshot_mode }}
          DROPLET_SIZE: ${{ inputs.droplet_size || 'c-8' }}
          SSH_FINGERPRINT: ${{ vars.DO_SSH_KEY_FINGERPRINT }}
          IMAGE_ID: ${{ steps.baked.outputs.image_id }}
          VOL_SNAP_ID: ${{ steps.baked.outputs.vol_snap_id }}
          SLUG: ${{ steps.target.outputs.slug }}
        run: |
          set -euo pipefail
          VOLUME_ARGS=()
          VOLUME_NAME=""
          VOLUME_ID=""
          if [ "${MODE}" != "genesis" ]; then
            VOLUME_NAME="zakura-pr-vol-${GITHUB_RUN_ID}"
            echo "volume_name=${VOLUME_NAME}" >> "$GITHUB_OUTPUT"
            SIZE=$(doctl compute snapshot get "${VOL_SNAP_ID}" --format MinDiskSize --no-header)
            VOLUME_ID=$(doctl compute volume create "${VOLUME_NAME}" \
              --region nyc3 --snapshot "${VOL_SNAP_ID}" --size "${SIZE}GiB" \
              --format ID --no-header)
            echo "volume_id=${VOLUME_ID}" >> "$GITHUB_OUTPUT"
            VOLUME_ARGS=(--volumes "${VOLUME_ID}")
          fi
          NAME="zakura-pr-${SLUG}-${GITHUB_RUN_ID}"
          echo "droplet_name=${NAME}" >> "$GITHUB_OUTPUT"
          doctl compute droplet create "$NAME" \
            --region nyc3 \
            --size "${DROPLET_SIZE}" \
            --image "${IMAGE_ID}" \
            --ssh-keys "${SSH_FINGERPRINT}" \
            "${VOLUME_ARGS[@]}" \
            --tag-name zakura-pr-node \
            --wait --format ID,PublicIPv4 --no-header > /tmp/droplet.txt
          {
            echo "id=$(awk '{print $1}' /tmp/droplet.txt)"
            echo "ip=$(awk '{print $2}' /tmp/droplet.txt)"
          } >> "$GITHUB_OUTPUT"

      - name: Wait for SSH
        id: sshwait
        env:
          IP: ${{ steps.droplet.outputs.ip }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 -i /tmp/do_ssh "root@${IP}" true 2>/dev/null; then
              echo "SSH up"; exit 0
            fi
            sleep 10
          done
          echo "SSH did not come up in time"; exit 1

      - name: Build, deploy, and monitor the node
        env:
          IP: ${{ steps.droplet.outputs.ip }}
          GH_CLONE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ inputs.snapshot_mode }}
          NETWORK: ${{ inputs.network }}
          SHA: ${{ steps.target.outputs.sha }}
          REFSPEC: ${{ steps.target.outputs.refspec }}
          DURATION_MINUTES: ${{ inputs.duration_minutes || '60' }}
          VOLUME_NAME: ${{ steps.droplet.outputs.volume_name }}
          P2P_STACK: ${{ inputs.p2p_stack || 'default' }}
          MAX_CKPT: ${{ steps.target.outputs.max_ckpt }}
          SNAPSHOT_HEIGHT: ${{ steps.baked.outputs.snapshot_height }}
        run: |
          set -euo pipefail
          umask 077
          {
            printf 'GH_REPO=%q\n'           "${GITHUB_REPOSITORY}"
            printf 'GH_CLONE_TOKEN=%q\n'    "${GH_CLONE_TOKEN}"
            printf 'MODE=%q\n'              "${MODE}"
            printf 'NETWORK=%q\n'           "${NETWORK}"
            printf 'SHA=%q\n'               "${SHA}"
            printf 'REFSPEC=%q\n'           "${REFSPEC}"
            printf 'DURATION_MINUTES=%q\n'  "${DURATION_MINUTES}"
            printf 'VOLUME_NAME=%q\n'       "${VOLUME_NAME}"
            printf 'P2P_STACK=%q\n'         "${P2P_STACK}"
            printf 'MAX_CKPT=%q\n'           "${MAX_CKPT}"
            printf 'SNAPSHOT_HEIGHT=%q\n'     "${SNAPSHOT_HEIGHT}"
          } > /tmp/run.env
          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i /tmp/do_ssh \
            /tmp/run.env \
            .github/workflows/scripts/pr-node-run.sh \
            .github/workflows/scripts/pr-node-monitor.py \
            "root@${IP}:/root/"
          rm -f /tmp/run.env
          # Keepalives: the monitored hour is long and low-output.
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=240 -i /tmp/do_ssh "root@${IP}" \
            'set -euo pipefail; set -a; . /root/run.env; set +a; bash /root/pr-node-run.sh'

      - name: Collect run outputs
        id: result
        if: always() && steps.droplet.outputs.ip != ''
        env:
          IP: ${{ steps.droplet.outputs.ip }}
        run: |
          set +e
          mkdir -p /tmp/out
          scp -r -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i /tmp/do_ssh \
            "root@${IP}:/root/out/*" /tmp/out/
          ls -la /tmp/out
          {
            if [ -f /tmp/out/summary.json ]; then
              echo "start_height=$(jq -r '.start_height // ""' /tmp/out/summary.json)"
              echo "end_height=$(jq -r '.end_height // ""' /tmp/out/summary.json)"
              echo "verdict=$(jq -r '.verdict // ""' /tmp/out/summary.json)"
            else
              echo "start_height="
              echo "end_height="
              echo "verdict="
            fi
          } >> "$GITHUB_OUTPUT"
          true

      - name: Write step summary
        if: always() && steps.droplet.outputs.ip != ''
        env:
          IP: ${{ steps.droplet.outputs.ip }}
          TEARDOWN: ${{ inputs.teardown_after_run }}
        run: |
          set -euo pipefail
          {
            if [ -f /tmp/out/summary.md ]; then
              cat /tmp/out/summary.md
            else
              printf '## Zakura PR node run\n\nNo summary was produced — see the job log.\n'
            fi
            echo ""
            if [ "${TEARDOWN}" = "true" ]; then
              echo "_Droplet deleted after the run (teardown_after_run=true)._"
            else
              echo "**Inspect the node:** \`ssh root@${IP}\` (deleted by the reaper ~24h after creation)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post PR comment
        if: always() && steps.target.outputs.pr != '' && steps.droplet.outputs.ip != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR: ${{ steps.target.outputs.pr }}
          MODE: ${{ inputs.snapshot_mode }}
          NETWORK: ${{ inputs.network }}
          IP: ${{ steps.droplet.outputs.ip }}
          TEARDOWN: ${{ inputs.teardown_after_run }}
        with:
          script: |
            const fs = require('fs');
            const marker = `<!-- zakura-pr-node:${process.env.MODE}:${process.env.NETWORK} -->`;
            let summary;
            try {
              summary = fs.readFileSync('/tmp/out/summary.md', 'utf8');
            } catch {
              summary = '## Zakura PR node run\n\nNo summary was produced — see the workflow log.';
            }
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const footer = process.env.TEARDOWN === 'true'
              ? '_Droplet deleted after the run._'
              : `**Inspect the node:** \`ssh root@${process.env.IP}\` (deleted by the reaper ~24h after creation).`;
            const body = `${marker}\n${summary}\n\n${footer}\n\n[Workflow run](${runUrl})`;
            const issue_number = Number(process.env.PR);
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.startsWith(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }

      - name: Upload artifacts
        if: always() && steps.droplet.outputs.ip != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: zakura-pr-node-${{ github.run_id }}
          path: /tmp/out/
          retention-days: 14
          if-no-files-found: ignore

      - name: Teardown (immediate or on unreachable droplet)
        if: always()
        env:
          DROPLET_ID: ${{ steps.droplet.outputs.id }}
          DROPLET_NAME: ${{ steps.droplet.outputs.droplet_name || format('zakura-pr-{0}-{1}', steps.target.outputs.slug, github.run_id) }}
          VOLUME_ID: ${{ steps.droplet.outputs.volume_id }}
          VOLUME_NAME: ${{ steps.droplet.outputs.volume_name || (inputs.snapshot_mode != 'genesis' && format('zakura-pr-vol-{0}', github.run_id)) || '' }}
          TEARDOWN: ${{ inputs.teardown_after_run }}
          SSH_FAILED: ${{ steps.sshwait.outcome == 'failure' }}
          PROVISION_FAILED: ${{ steps.droplet.outcome == 'failure' }}
        run: |
          set +e
          if [ -z "${DROPLET_ID}" ] && [ -n "${DROPLET_NAME}" ]; then
            DROPLET_ID=$(doctl compute droplet list --tag-name zakura-pr-node \
              --format ID,Name --no-header | awk -v name="$DROPLET_NAME" '$2 == name { print $1; exit }')
          fi
          if [ -z "${VOLUME_ID}" ] && [ -n "${VOLUME_NAME}" ]; then
            VOLUME_ID=$(doctl compute volume get "${VOLUME_NAME}" --format ID --no-header 2>/dev/null)
          fi
          # A droplet we can never SSH into is useless to keep for inspection.
          if [ "${TEARDOWN}" != "true" ] \
            && [ "${SSH_FAILED}" != "true" ] \
            && [ "${PROVISION_FAILED}" != "true" ]; then
            echo "Droplet kept for inspection; the reaper deletes it ~24h after creation."
            exit 0
          fi
          if [ -n "${DROPLET_ID}" ]; then
            for _ in 1 2 3; do
              doctl compute droplet delete "${DROPLET_ID}" -f && break
              sleep 5
            done
          fi
          if [ -n "${VOLUME_ID}" ]; then
            # The volume detaches asynchronously after the droplet delete.
            for _ in $(seq 1 12); do
              doctl compute volume delete "${VOLUME_ID}" -f && break
              sleep 10
            done
          fi
          true
