# The subscription primitive opens each subscription at sequence 1, and
# its later updates count on from there, so each Grant is one more than
# the Open's but the Open isn't 0. The reactor, the subscriber, the
# subscription primitive and the queue decide how the witness's rounds
# start, stage and are credited, so a change there can move the witness
# off it.
checks = ["crates/zakura-network/src/zakura/header_sync", "crates/zakura-network/src/zakura/regulation/subscription"]

[typed]
harness = "header-sync/storage"
scenario = "crates/zakura-sim/tests/fixtures/header-authority-multi-page-sync.json"
plan = "crates/zakura-sim/tests/fixtures/header-authority-multi-page-sync.plan"
