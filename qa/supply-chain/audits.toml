[[audits.lock_api]]
who = "Claude Opus 5 <noreply@anthropic.com>"
criteria = "safe-to-deploy"
version = "0.4.14"
notes = "Reviewed all packaged source, manifest, and tests. The crate contains no concrete locking logic: it wraps a caller-supplied raw lock in Mutex, RwLock, and ReentrantLock along with their guards, and the safety of the whole crate rests on the RawMutex, RawRwLock, and related traits being unsafe with their exclusion guarantees stated as trait-level obligations. The guards are the interesting part and they hold up: mapped and mutably-mapped guards keep the lifetime of the originating guard, the guard types are not Send unless the raw lock says its unlock may cross threads, and every early-unlock path either consumes the guard or restores the lock before returning. There is no build script and no ambient capability. All 1 test passed with all features; the crate delegates its real coverage to parking_lot."

[[audits.log]]
