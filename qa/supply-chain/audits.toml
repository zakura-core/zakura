[[audits.zcash_script]]
who = "Claude Opus 5 <noreply@anthropic.com>"
criteria = "safe-to-deploy"
version = "0.4.5"
notes = "Reviewed all packaged source, manifest, and tests. This is the pure-Rust transparent script implementation, no_std with a single unsafe expression and no build script. The interpreter is written for adversarial input: the stack and altstack are bounded by the consensus limits, opcode and script size limits are enforced before execution, disabled opcodes are rejected outright, and numeric operands go through a checked conversion that rejects overlong encodings rather than wrapping. All 8 tests passed with all features."

