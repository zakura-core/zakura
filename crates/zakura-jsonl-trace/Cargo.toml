[package]
name = "zakura-jsonl-trace"
version = "1.3.0"
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories = ["development-tools::debugging"]
edition.workspace = true
rust-version.workspace = true
description = "Shared non-blocking JSONL tracing support for the Zakura node. Internal crate, published to support cargo install zakura"

[dependencies]
crossbeam-channel.workspace = true
pin-project.workspace = true
rand.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "sync", "time", "rt", "macros"] }
tokio-util = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", features = ["thread", "time"] }

[dev-dependencies]
futures.workspace = true
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
