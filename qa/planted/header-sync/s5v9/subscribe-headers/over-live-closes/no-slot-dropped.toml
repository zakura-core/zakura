# The publisher drops an `Open` that the subscription rules refuse with
# `NoSlot`, past twice the row's `max_live`, as it drops a crossed update,
# instead of refusing it, so the reader keeps the connection open. Its
# input is the saved over-live Plan, whose adversary opens a third
# subscription beside two the node holds, so
# `header-sync/s5v9/subscribe-headers/over-live-closes` is the only ID it
# breaks.
# Besides the files the patch changes, the rest of these decide which
# frames the input's peers send and when the node judges them. A change
# there can move the input off its frame.
input = "crates/zakura-sim/tests/fixtures/header-wire-over-live.bin"
checks = ["crates/zakura-network/src/zakura/header_sync", "crates/zakura-network/src/zakura/regulation"]
