name: Isolate the baseline checkpoint experiment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/do-cli
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          ssh_private_key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
      - name: Restart only the disposable baseline seed and isolate its later native serving phase
        run: |
          set -euo pipefail
          NODE=$(doctl compute droplet list -o json | jq -ce '[.[] | select(.name | endswith("-34626268029"))] | if length == 1 then .[0] else error("expected one baseline task node") end')
          IP=$(jq -r '.networks.v4[] | select(.type == "public") | .ip_address' <<< "$NODE")
          jq '{id,name,region:.region.slug}' <<< "$NODE"
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i /tmp/do_ssh "root@${IP}" 'bash -se' <<'REMOTE'
          set -euo pipefail
          test "$(git -C /root/zakura rev-parse HEAD)" = a623e048f043265a0f5d8c3555a28455c5ed24c1
          test ! -e /root/out/paired/events.jsonl
          mkdir -p /root/out/seed-preparation-diagnostic
          cp /var/log/zakura/zakura.log /root/out/seed-preparation-diagnostic/before-restart.log
          python3 - <<'PYTHON'
          from pathlib import Path
          p=Path('/root/zakura/deploy/deployer/templates/zakura.toml')
          s=p.read_text()
          assert 'p2p_stack = "{{P2P_STACK}}"' in s
          p.write_text(s.replace('p2p_stack = "{{P2P_STACK}}"', 'p2p_stack = "zakura"'))
          Path('/root/out/seed-preparation-diagnostic/README.txt').write_text('Baseline legacy seed restarted during preparation after peer starvation. The later serving phase uses native-only P2P with the isolated cohort to prevent incidental compatibility requests from waking the client state service. The unopened client fixture and binary are unchanged.\n')
          PYTHON
          git -C /root/zakura diff -- deploy/deployer/templates/zakura.toml > /root/out/seed-preparation-diagnostic/template.patch
          systemctl restart zakurad
          systemctl is-active zakurad
          REMOTE
