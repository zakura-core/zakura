# Settling a storage call reports success but keeps its entry in the
# reactor's pending calls, so the next unit of work lists a call that
# already ended. The reactor and the queue decide when the witness's calls
# and rounds run, so a change there can move the witness off it.
checks = ["crates/zakura-network/src/zakura/header_sync"]

[typed]
harness = "header-sync/storage"
scenario = "crates/zakura-sim/tests/fixtures/header-authority-forks-sharing-a-header.json"
plan = "crates/zakura-sim/tests/fixtures/header-authority-forks-sharing-a-header.plan"
