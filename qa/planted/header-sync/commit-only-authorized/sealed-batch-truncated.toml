# Preparation seals a batch without the request's last header, keeping its
# owner, parent and target, so the apply's sealed headers aren't the
# prepare's dispatched ones.
# The reactor, the queue and the storage port decide how the witness's
# rounds stage, prepare and apply, so a change there can move the witness
# off it.
checks = ["crates/zakura-network/src/zakura/header_sync", "crates/zakura-storage/src/header"]

[typed]
harness = "header-sync/storage"
scenario = "crates/zakura-sim/tests/fixtures/header-authority-forks-sharing-a-header.json"
plan = "crates/zakura-sim/tests/fixtures/header-authority-forks-sharing-a-header.plan"
