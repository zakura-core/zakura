# The codec admits a wanted list that names one service twice, so the node
# answers such a `GetServices` instead of closing. mut-6's generator drew
# the scenario (seed 11, run 18, family get-services-bad-content).
# Besides wire.rs, which the patch changes, the rest of discovery decides
# whether the frame reaches the codec.
checks = ["crates/zakura-network/src/zakura/discovery"]

[typed]
harness = "discovery/wire"
scenario = "qa/planted/discovery/s4v2/get-services/bad-content-closes/admit-repeated-wanted-service.scenario.json"
