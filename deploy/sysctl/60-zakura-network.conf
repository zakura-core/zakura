# Zakura node network defaults. The continuous-sync deployer and the node
# deployer install this file to /etc/sysctl.d/ and load it with
# `sysctl --load`.

# Zakura P2P runs QUIC over one UDP socket shared by every peer. iroh binds it
# through netwatch, which requests 7 MiB SO_RCVBUF and SO_SNDBUF. The kernel
# caps each request at rmem_max / wmem_max (212992 bytes on stock Ubuntu) and
# doubles it, so the socket reports 425984 bytes. The kernel drops datagrams
# that overflow the buffer, and QUIC treats each drop as congestion loss.
# Raising the caps lets the full request through: the socket then reports
# 14 MiB (2 x 7 MiB).
net.core.rmem_max = 67108864
net.core.wmem_max = 67108864

# Legacy Zcash P2P runs over TCP. With this setting enabled, TCP resets its
# congestion window between block requests. zakurad warns at startup when it
# is enabled.
net.ipv4.tcp_slow_start_after_idle = 0
