name: PR 966 test cleanup verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/do-cli
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Verify both task-owned droplets and volumes were deleted
        run: |
          set -euo pipefail
          doctl compute droplet list -o json | jq -e '[.[] | select(.id == 599561515 or .id == 599567186 or .name == "zakura-pr-e3328340aa040971681ed222-34570859516" or .name == "zakura-pr-e3328340aa040971681ed222-34572860726")] | length == 0'
          doctl compute volume list -o json | jq -e '[.[] | select(.id == "9111088e-adab-11f1-8db9-6afac2c46685" or .id == "5c2ecf57-adaf-11f1-9fb3-0ef0b0171da1" or .name == "zakura-pr-vol-34570859516-nyc1" or .name == "zakura-pr-vol-34572860726-nyc1")] | length == 0'
          echo "Both disposable test droplets and their cloned state volumes are deleted."
