# The publisher sizes each page one header past its subscription's unspent
# credit, and `reserve_page` no longer checks that credit, so the node
# sends the held subscriber a page over its object credit, which the
# peer's models label `OverCredit`. Its input is the held subscription:
# the adversary subscribes from 50 with one page of credit, holds every
# grant and takes no act, while the node holds 120 headers, so
# `header-sync/s5v9/subscribe-headers/sender-within-credit` is the only ID
# it breaks.
# Besides the files the patch changes, the rest of these decide which
# frames the input's peers send and when the node judges them. A change
# there can move the input off its frame.
checks = ["crates/zakura-network/src/zakura/header_sync", "crates/zakura-network/src/zakura/regulation"]

[typed]
harness = "header-sync/wire"
scenario = "crates/zakura-sim/tests/fixtures/header-wire-planted-held-subscription.json"
plan = "crates/zakura-sim/tests/fixtures/header-wire-default.plan"
