# Discovery samples the most records a `Peers` may carry, whatever limit the
# `GetPeers` asks for. The scenario's first peer asks for one record, and the
# node has authenticated three peers, so its answer carries more than one.
# Besides the files the patch changes, the rest of discovery decides whether
# the frame reaches the bypass.
checks = ["crates/zakura-network/src/zakura/discovery"]

[typed]
harness = "discovery/wire"
scenario = "qa/planted/discovery/s4v2/peers/sender-within-owed/ignore-peers-limit.scenario.json"
plan = "qa/planted/discovery/s4v2/peers/sender-within-owed/ignore-peers-limit.plan.bin"
