[package]
name = "zakura-node-services"
version = "5.0.0-rc2"
authors.workspace = true
description = "The interfaces of some Zakura node services. Internal crate, published to support cargo install zakura"
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

readme = "../../README.md"
# crates.io is limited to 5 keywords and categories
keywords.workspace = true
# Must be one of <https://crates.io/category_slugs>
categories = ["asynchronous", "cryptography::cryptocurrencies", "network-programming"]

[features]
default = []

# Production features that activate extra dependencies, or extra features in dependencies

# Tool and test features

# Retain the published feature name after removing its unused dependency.
color-eyre = []

rpc-client = [
    "color-eyre",
    "dep:base64",
    "dep:bytes",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "serde",
    "serde_json",
    "tokio/net",
]

# Retain the published feature name after removing its dependency.
reqwest = []

[dependencies]
zakura-chain = { path = "../zakura-chain" , version = "10.0.0-rc0" }
zakura-header-chain = { path = "../zakura-header-chain", version = "5.0.0-rc2" }
tower = { workspace = true }

# Optional dependencies

# Tool and test feature rpc-client
base64 = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
hyper = { workspace = true, features = ["client", "http1"], optional = true }
hyper-util = { workspace = true, features = ["tokio"], optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "time", "sync"] }

[dev-dependencies]

base64 = { workspace = true }
bytes = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }

[lints]
workspace = true
