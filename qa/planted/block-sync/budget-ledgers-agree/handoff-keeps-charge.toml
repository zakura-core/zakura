# Drops the budget release after a routine hands a received body to the
# sequencer. The work queue already released the body's reservation, so
# at the next quiescence boundary the budget counts more than the work
# queue's tally.
input = "crates/zakura-sim/tests/fixtures/block-sync-handoff.bin"
# Besides peer_routine.rs, which the patch changes, the harness drives the
# rest of block sync and the Zakura transport under it. A change there can
# move the input off the handoff.
checks = ["crates/zakura-network/src/zakura"]
# Each leaked charge stays in the budget, so a run that leaks enough of them
# takes the budget past `M + 2·B + h·B` too, often before it first rests.
also_violates = ["block-sync/reserved-byte-bound"]
