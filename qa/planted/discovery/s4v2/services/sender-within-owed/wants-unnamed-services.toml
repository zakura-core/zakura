# `GetServices::wants` inverts its list check, so a request that names
# header sync alone gets the discovery summary instead. The scenario's peer
# asks for header sync alone. mut-6's generator drew it (seed 11, run 32,
# family get-header-sync-service).
# Besides protocol.rs, which the patch changes, the rest of discovery
# decides which summaries the node reports.
checks = ["crates/zakura-network/src/zakura/discovery"]

[typed]
harness = "discovery/wire"
scenario = "qa/planted/discovery/s4v2/services/sender-within-owed/wants-unnamed-services.scenario.json"
