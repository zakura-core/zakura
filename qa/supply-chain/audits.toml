[[audits.bitvec]]
who = "Claude Opus 5 <noreply@anthropic.com>"
criteria = "safe-to-deploy"
version = "1.1.1"
notes = "Reviewed the manifest, the module-level documentation, and the unsafe surface, which is large because the crate encodes a bit index and an element pointer into a single reference-shaped value. The design states its invariants explicitly: a BitPtr carries a bit index that is always less than the element width, region descriptors are constructed only through checked constructors that reject a length past the addressable maximum, and the aliasing rules for split borrows are expressed in the type system through the Alias and Unalias markers rather than by convention. There is no build script and no ambient capability. All 444 tests passed with all features."

[[audits.blake2b_simd]]
who = "Claude Opus 5 <noreply@anthropic.com>"
criteria = "safe-to-deploy"
version = "1.0.4"
notes = "Reviewed all packaged source, manifest, dynamic dispatch, portable and SIMD compression, and tests. There is no build script and no I/O; the only ambient capability is CPU feature detection, and every SSE4.1/AVX2 entry point is reached through Implementation::detect, which gates each platform on a compile-time target_feature or is_x86_feature_detected. Hashing was differentially compared against an independent RFC 7693 BLAKE2b transcription over 30000 random inputs spanning 3000 distinct lengths, including block-boundary lengths and randomly chunked update calls, covering the one-shot, incremental, and many::hash_many paths with zero mismatches, and the runtime-detected implementation matched benchmarks::force_portable on every input. All 23 unit and 11 documentation tests passed on aarch64, and all 28 unit tests passed on x86_64 where the SSE4.1 path is selected. The AVX2 compression routines were reviewed by reading only; no AVX2-capable host was available to execute them."

[[audits.blake2s_simd]]
who = "Claude Opus 5 <noreply@anthropic.com>"
criteria = "safe-to-deploy"
version = "1.0.4"
notes = "Reviewed all packaged source, manifest, dynamic dispatch, portable and SIMD compression, and tests. The crate is the BLAKE2s sibling of blake2b_simd and shares its structure: no build script, no I/O, and SIMD entry points reachable only through Implementation::detect, which gates each platform on a compile-time target_feature or is_x86_feature_detected. The runtime-detected implementation was differentially compared against benchmarks::force_portable over 30000 random inputs spanning 3000 distinct lengths with randomly chunked update calls and zero mismatches. All 25 unit and 11 documentation tests passed on aarch64, and all 30 unit tests passed on x86_64 where the SSE4.1 path is selected. The AVX2 compression routines were reviewed by reading only; no AVX2-capable host was available to execute them."

[[audits.blake3]]
who = "Claude Opus 5 <noreply@anthropic.com>"
criteria = "safe-to-deploy"
version = "1.8.5"
notes = "Reviewed all packaged source, manifest, build script, and the portable and SIMD implementations. The build script is the notable capability: it compiles vendored assembly for SSE2, SSE4.1, AVX2, and AVX-512 and C intrinsics for NEON and AVX-512, so a build of this crate invokes a C toolchain over sources shipped inside the package; the assembly is reached only through the runtime feature detection in the platform module, and the pure feature bypasses all of it. The published package cannot run its own tests, since tests/ imports a reference_impl module that is not part of the crate, so the implementations were compared directly instead: the official empty-input vector was reproduced, and hashing, keyed hashing, extendable output, and randomly chunked incremental updates over 636 input lengths, chosen to straddle the 1024-byte chunk size and the first twelve subtree boundaries, produced an identical digest under the default assembly build, the pure Rust build, and an x86_64 build, with incremental hashing matching one-shot hashing at every length."

