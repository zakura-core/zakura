[package]
name = "zakura-p2p-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
zakura-network = { path = "../../../crates/zakura-network", features = ["p2p-fuzz"] }

[[bin]]
name = "service_session"
path = "fuzz_targets/service_session.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cadence"
path = "fuzz_targets/cadence.rs"
test = false
doc = false
bench = false

[[bin]]
name = "block_query"
path = "fuzz_targets/block_query.rs"
test = false
doc = false
bench = false

[[bin]]
name = "block_fill"
path = "fuzz_targets/block_fill.rs"
test = false
doc = false
bench = false

[workspace]
