notes = "Reviewed all packaged source, manifest, build script, and tests. This crate switches stacks with hand-written assembly, so it is as unsafe as a crate gets, and the review is about whether the machinery is coherent rather than whether it avoids unsafe: each supported architecture has its own context-switch routine, the stack is allocated with a guard page and its size is checked on every yield with a canary that panics on overflow rather than corrupting the neighbouring mapping, and a generator that is dropped while suspended unwinds its stack before freeing it. The build script compiles external assembly only for powerpc64 and otherwise just emits a cfg. All 33 tests passed with all features."

[[audits.generic-array]]
who = "Claude Opus 5 <noreply@anthropic.com>"
criteria = "safe-to-deploy"
version = "0.14.7"
notes = "Reviewed all packaged source, manifest, build script, and tests. GenericArray is repr(transparent) over a repr(C) binary tree whose leaves are all T, so the slice::from_raw_parts in Deref and DerefMut sees the contiguous layout it assumes; both slice-to-reference conversions assert the length against N::USIZE first, and ArrayBuilder and ArrayConsumer track a position so a panic mid-construction drops exactly the initialized elements. The build script only asks version_check for the compiler version and emits one cfg. Two things are worth recording: the doc-hidden pub unsafe fn transmute reinterprets A as B through ptr::read without a size check, so it is sound only for the equally sized instantiations the macros produce; and two arr! documentation examples no longer compile on current rustc because they use generic parameters in const position. All 6 unit tests passed."

[[audits.getrandom]]
who = "Claude Opus 5 <noreply@anthropic.com>"
criteria = "safe-to-deploy"
version = "0.2.15"
notes = "Reviewed all packaged source, manifest, and tests, with attention to the Linux, macOS, and Windows backends this workspace can reach. The crate never substitutes insecure bytes for a failed system call: every backend returns an Error instead, the shared fill loop retries only on EINTR and treats a zero or unexpected return as an error, and the destination is a MaybeUninit slice that is assumed initialized only after a backend reports success. On Linux the getrandom(2) syscall is probed once and falls back to /dev/urandom only after polling /dev/random so an early-boot read cannot return unseeded output, with the descriptor opened O_CLOEXEC under a pthread mutex and cached; macOS chunks getentropy(2) to its 256-byte limit; Windows calls BCryptGenRandom with the system-preferred RNG and only then RtlGenRandom, reporting an OS error if both fail. The custom feature, which lets a downstream register its own source, is not enabled anywhere in this tree. All 6 tests passed with the std and custom features; all-features cannot build on stable because it enables rustc-dep-of-std."

[[audits.getrandom]]
