notes = "Reviewed all packaged source and manifest content. This no_std crate defines authenticated-encryption traits, bounded buffer adapters, and stream constructions; stream nonces reserve the final bytes for a checked counter and reject overflow before reuse. No unsafe code, build script, runtime I/O, or ambient authority. All-feature library targets compiled; the package contains no active tests."

[[audits.aes]]
who = "Claude Opus 5 <noreply@anthropic.com>"
criteria = "safe-to-deploy"
version = "0.8.4"
notes = "Reviewed all packaged source, manifest, and tests. The hardware backends are reached only through the autodetect module, which stores the AES-NI or ARMv8 state and the bitsliced software state in a union and selects between them with a cpufeatures token cached from a single CPUID probe, so the intrinsics variant is read only when the instructions are present; aarch64 hardware support additionally requires the builder to pass the aes_armv8 cfg, so the default aarch64 build uses the software backend. That software backend is the fixsliced constant-time implementation, with no data-dependent table lookups or branches on key material. There is no build script and no ambient capability beyond feature detection. The backends were compared directly: the FIPS-197 appendix C vectors for AES-128, AES-192, and AES-256 were reproduced, and 600000 encryptions over random keys and blocks produced an identical ciphertext digest on aarch64 with the software backend, on x86_64 with AES-NI, and on both again with aes_force_soft, with decryption inverting encryption and the parallel block API agreeing with single-block calls throughout. All 11 tests passed with all features."

[[audits.ahash]]
who = "Claude Opus 5 <noreply@anthropic.com>"
criteria = "safe-to-deploy"
version = "0.8.12"
notes = "Reviewed all packaged source, manifest, build script, and tests. The hash itself is a folded multiply or AES-round permutation chosen by the build script from the target architecture; the build script reads only the target and the compiler version and emits two cfgs. The security-relevant part is the key material, and it holds up: with the default runtime-rng feature the per-process keys come from getrandom, and the documented fallbacks, a compile-time constant or an address-and-counter permutation, are reached only when that feature is off. This crate is not used for anything consensus-visible in this tree. All 62 tests passed."

[[audits.aho-corasick]]
who = "Claude Opus 5 <noreply@anthropic.com>"
criteria = "safe-to-deploy"
version = "1.1.3"
notes = "Reviewed the manifest, the module-level documentation, and the unsafe surface, which is the state-transition tables of the noncontiguous, contiguous, and DFA automata plus the vectorized prefilters. Transition lookups are bounds-derived from state identifiers that the builder allocates, and the identifier types reject values past the table size at construction rather than at use. Automaton construction is bounded by an explicit size limit the caller can set. There is no build script and no ambient capability. All 252 tests passed with all features."

[[audits.anstream]]
who = "Claude Opus 5 <noreply@anthropic.com>"
criteria = "safe-to-deploy"
