# The codec admits a `GetPeers` whose limit is 0, so the node serves it an
# empty `Peers` instead of closing. mut-6's generator drew the scenario
# (seed 11, run 42, family get-peers-bad-content).
# Besides wire.rs, which the patch changes, the rest of discovery decides
# whether the frame reaches the codec.
checks = ["crates/zakura-network/src/zakura/discovery"]

[typed]
harness = "discovery/wire"
scenario = "qa/planted/discovery/s4v2/get-peers/bad-content-closes/admit-zero-peer-limit.scenario.json"
plan = "qa/planted/discovery/s4v2/get-peers/bad-content-closes/admit-zero-peer-limit.plan.bin"
