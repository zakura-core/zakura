# The committed fuzz input `block-sync-reset-mid-flight.bin`: the harness
# that runs it, the generator version it was built for, and its SHA-256. Its
# first two bytes, `ff 0c`, pick the reset-mid-flight scenario: two mirrors
# serve sixteen bodies, and the chain resets to a fork from height 8 once the
# node submits its third body. The rest encodes each step's pick up to step
# 11,659, then the defaults run. It is the old seed-7 input steered at four
# picks: from step 11,410 the connection-1 routine waits while other tasks
# run. It writes epoch-1 requests for heights 10, 12 and 14 before it handles
# the reset's view change, so the view change returns them and connection 2
# requests them again. Connection 1's late bodies then cross while
# connection 2's requests are open, and first-completion-wins credits a
# submission to a connection-2 request.
harness = "block-sync/storage"
generator = 2
sha256 = "462edb51109ffd7f4c6b6ee2a6322352483bedac5e3eea0678bbaa10d482ab4f"
scenario_sha256 = "ef7a2693943a5f576cfab7e8029e9ceef242b4bd6c02d7d5b726c360bf127914"
source = "crates/zakura-sim/tests/block_semantic_properties.rs"

[[witness]]
property = "block-sync/submit-only-requested"
expect = "holds"
