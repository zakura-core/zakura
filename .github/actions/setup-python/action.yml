name: Set up locked Python tooling
description: Install the repository's Python toolchain and an optional locked dependency group.
inputs:
  group:
    description: Dependency group to install; empty installs only the toolchain for auditing.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        version: '0.11.8'
        python-version: '3.12'
        enable-cache: 'false'
        activate-environment: ${{ inputs.group != '' }}
        working-directory: scripts
        venv-path: ${{ github.workspace }}/scripts/.venv
    - name: Install Python
      shell: bash
      working-directory: scripts
      run: uv python install 3.12
    - name: Install the selected dependency group
      if: inputs.group != ''
      shell: bash
      working-directory: scripts
      env:
        DEPENDENCY_GROUP: ${{ inputs.group }}
      run: uv sync --locked --no-build --only-group "$DEPENDENCY_GROUP"
