# The committed fuzz input `block-sync-stale-request-body.bin`: the harness
# that runs it, the generator version it was built for, and its SHA-256. Its
# first two bytes, `ff 0c`, pick the reset-mid-flight scenario. The rest is
# Plan bytes from a seeded random search on the remote host (mut-7.4), the
# shortest of three whose run violated
# `block-sync/s6v3/block/receiver-work-authorized` with
# `qa/native-mutations/submit-only-requested/stale-body-credits-current-owner`
# applied: a routine reads an old-epoch body for a height past the fork
# while its old request is still local, after another routine's fork request
# reserved that height.
harness = "block-sync/storage"
generator = 2
sha256 = "0cf040544446e674316e6a22398cc0a2318a2e613523f5afa9c09d774cf96f83"
scenario_sha256 = "ef7a2693943a5f576cfab7e8029e9ceef242b4bd6c02d7d5b726c360bf127914"
source = "crates/zakura-sim/tests/block_table.rs"
