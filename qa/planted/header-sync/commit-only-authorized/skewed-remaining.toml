# `HeaderCountReservation::consume` stores one header fewer than a page
# left in the reservation. The budget's counts stay right, so only the
# reservation's own balance is wrong, and the staging report carries the
# skew while the reservation is live. The required failure is
# `OverReservation`. The reactor, the subscriber and the queue decide how
# the witness's rounds reserve and stage, so a change there can move the
# witness off it.
checks = ["crates/zakura-network/src/zakura/header_sync"]

[typed]
harness = "header-sync/storage"
scenario = "crates/zakura-sim/tests/fixtures/header-authority-forks-sharing-a-header.json"
plan = "crates/zakura-sim/tests/fixtures/header-authority-forks-sharing-a-header.plan"
