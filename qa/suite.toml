# The full property suite (campaign.md, C1): what the suite runs beyond the
# harness registry. `cargo xtask sim-suite` joins this file with the
# registered harnesses and their properties, the coverage manifest, the
# planted cases under qa/planted/, the committed seeds, the fuzz targets
# under qa/fuzz/ and the test sources, and fails if any of them is missing
# here. A new harness, fuzz target or ignored test fails the check until
# this file runs it, excludes it with a reason, or lists it as missing.
#
# Timeouts are generous upper bounds for a cold build on an 8-vCPU host.
# The campaign's calibration run replaces them with measured values.

schema = 1
planted-timeout-secs = 3600
seed-timeout-secs = 1800

# Packages whose tests the simulator build runs, as CI's `zakura_sim build`
# job does: the library's unit tests and every test binary.
[[sim-package]]
name = "zakura-rt"
timeout-secs = 1800

[[sim-package]]
name = "zakura-scheduler"
timeout-secs = 1800

[[sim-package]]
name = "zakura-sim"
timeout-secs = 1800

[[sim-package]]
name = "zakura-storage"
timeout-secs = 1800

[[sim-package]]
name = "zakura-quic"
timeout-secs = 1800

# zakura-network's unit tests name tokio's types, so only its simulator
# test binaries build under the flag.
[[sim-package]]
name = "zakura-network"
lib = false
tests = ["sim_header_sync", "sim_block_sync"]
timeout-secs = 2700

# Packages whose ordinary-build property suites run: each source file with a
# `proptest!` block, or a call of a macro that expands to a property suite,
# is one row, which runs that file's module. `stream_conformance_suite`
# checks every session layout's properties over real QUIC; the other two
# check each wire family's codec.
[[property-package]]
name = "zakura-network"
suite-macros = ["item_suite", "message_suite", "stream_conformance_suite"]
# Block sync's conformance suite builds only with the testkit.
features = ["zakura-testkit"]
timeout-secs = 1800

# Every ignored test in the sources above. CI keeps them out of its
# blocking path because each takes a minute or more. The suite runs them
# with `--ignored` and the `planted` profile.
[[ignored]]
file = "crates/zakura-sim/tests/block_semantic_properties.rs"
test = "the_decoded_input_stall_input_holds_input_decoded_bound"
run = true
timeout-secs = 3600

[[ignored]]
file = "crates/zakura-sim/tests/block_semantic_properties.rs"
test = "the_frontier_first_input_holds_capacity_release_wakes"
run = true
timeout-secs = 3600

[[ignored]]
file = "crates/zakura-sim/tests/block_semantic_properties.rs"
test = "the_reply_first_input_holds_capacity_release_wakes"
run = true
timeout-secs = 3600

[[ignored]]
file = "crates/zakura-sim/tests/block_resource_properties.rs"
test = "the_stuck_floor_fills_the_commit_window_within_retained_byte_bound"
run = true
timeout-secs = 3600

[[ignored]]
file = "crates/zakura-sim/tests/block_resource_properties.rs"
test = "every_floor_churn_plan_asks_for_the_floor_before_the_reset"
run = true
timeout-secs = 1800

[[ignored]]
file = "crates/zakura-sim/tests/block_resource_properties.rs"
test = "the_above_window_input_holds_lookahead_overshoot_bound"
run = true
timeout-secs = 3600

[[ignored]]
file = "crates/zakura-sim/tests/block_resource_properties.rs"
test = "every_worker_count_holds_the_lookahead_bound_above_the_window"
run = true
timeout-secs = 3600

[[ignored]]
file = "crates/zakura-sim/tests/block_resource_properties.rs"
test = "lookahead_estimate_to_wire_growth"
run = true
timeout-secs = 3600

[[ignored]]
file = "crates/zakura-sim/tests/discovery.rs"
test = "regenerate_wait_complete_input"
run = false
reason = "a tool, not a test: it rewrites the committed input, and needs the lost-wakeup patch applied"

[[ignored]]
file = "crates/zakura-sim/tests/header_wire_lifecycle.rs"
test = "regenerate_saved_plans"
run = false
reason = "a tool, not a test: it rewrites the committed saved Plans"

# Commands the package rows don't cover: the doc tests, and the release and
# AddressSanitizer runs of the scheduler and runtime that CI's
# `zakura_sim release` and `zakura_sim asan` jobs make. The ASan lane needs
# `llvm-symbolizer` on the host.
[[lane]]
id = "sim-doc/zakura-sim"
build = "sim-doc"
args = "test --locked -p zakura-sim --doc"
timeout-secs = 1800

[[lane]]
id = "sim-release/zakura-rt-zakura-scheduler"
build = "sim-release"
args = "test --locked -p zakura-rt -p zakura-scheduler --release"
timeout-secs = 2700

[[lane]]
id = "sim-asan/zakura-rt-zakura-scheduler"
build = "sim-asan"
args = "test --locked -p zakura-rt -p zakura-scheduler --features zakura-scheduler/sanitizer --target x86_64-unknown-linux-gnu --tests"
timeout-secs = 2700

# Fuzz targets. A `sim` target runs one harness, and starts from that
# harness's admitted seeds. Its smoke run is short; the campaign sets each
# target's search budget after calibration.
[[target]]
package = "sim"
name = "discovery_wait_complete"
harness = "discovery/wait-complete"
smoke-secs = 60
timeout-secs = 1800

# `fixtures/all` picks any race fixture in any variant, so the target's runs
# cover each fixture's own harness and the fixed variants. Its report must
# account for each fixture and variant.
[[target]]
package = "sim"
name = "race_fixtures"
harness = "fixtures/all"
covers = [
    "race/lost-update",
    "race/snapshot-reserve",
    "race/missed-notify",
    "race/timer-cancel",
    "race/ab-ba",
    "race/abort-without-join",
    "fixtures/fixed",
]
smoke-secs = 60
timeout-secs = 1800

# The header-chain targets, with header-fuzz.yml's limits.
[[target]]
package = "header-chain"
name = "fork_transitions"
smoke-secs = 60
args = ["-rss_limit_mb=4096", "-max_len=512", "-detect_leaks=1"]
timeout-secs = 2700

[[target]]
package = "header-chain"
name = "header_codec_v9"
smoke-secs = 60
args = ["-rss_limit_mb=2048", "-max_len=2097152", "-detect_leaks=1"]
timeout-secs = 2700

[[target]]
package = "header-chain"
name = "header_pursuit"
smoke-secs = 60
args = ["-rss_limit_mb=2048", "-max_len=512", "-detect_leaks=1"]
timeout-secs = 2700

[[target]]
package = "header-chain"
name = "recovery_rows"
smoke-secs = 60
args = ["-rss_limit_mb=4096", "-max_len=256", "-detect_leaks=0"]
timeout-secs = 2700

[[excluded-target]]
package = "rpc"
name = "json_rpc_request"
reason = "JSON-RPC parsing isn't a P2P DoS property; rpc-fuzz.yml keeps fuzzing it nightly"

# Harnesses no target runs yet. Each stays in the report as unimplemented.
[[missing-target]]
harness = "header-sync/smoke"
owner = "E5a"
reason = "no target: the harness has a fixed scenario, and no plan maps it to a target"

[[missing-target]]
