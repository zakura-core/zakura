# Reverts #2001's early return: when a prepare or apply fails after its
# round retired, the reactor returns before it classifies the failure, so
# a header-peer fault that settles late reports no `Misbehavior`. The
# required failure is `UnpenalizedFault`. The input is the late-fault
# fixture, scripted because no Plan bytes reach it: steering picks the
# peer's disconnect while the node's storage holds the preparation of its
# invalid tip, so the preparation fails `InvalidHeader` after the session
# ended, and the reactor takes that failure only through the early return.
# Besides reactor.rs, which the patch changes, the rest of header sync
# decides when the node submits that preparation and when the disconnect
# retires its round. A change there can move the script off its late fault.
checks = ["crates/zakura-network/src/zakura/header_sync"]

[typed]
harness = "header-sync/wire"
scenario = "crates/zakura-sim/tests/fixtures/header-wire-late-fault.json"
script = "crates/zakura-sim/tests/fixtures/header-wire-late-fault.script.json"
