name: PR 966 sync diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/do-cli
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          ssh_private_key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
      - name: Read the exact task-owned node
        env:
          EXPECTED_NAME: "zakura-pr-e3328340aa040971681ed222-34570859516"
          IP: "159.65.222.14"
        run: |
          set -euo pipefail
          doctl compute droplet list --tag-name zakura-pr-node -o json | jq -e --arg name "$EXPECTED_NAME" --arg ip "$IP" '[.[] | select(.name == $name and any(.networks.v4[]; .ip_address == $ip))] | length == 1' > /dev/null
          mkdir -p /tmp/inspect
          ssh -i /tmp/do_ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new "root@$IP" 'python3 -' > /tmp/inspect/live.txt <<'PYREMOTE'
          import json, subprocess, urllib.request
          sha = subprocess.check_output(['git', '-C', '/root/zakura', 'rev-parse', 'HEAD'], text=True).strip()
          assert sha == 'e3328340aa040971681ed222a5bfc63fe43d8991', sha
          print('TARGET_SHA', sha)
          print(subprocess.check_output(['systemctl', 'show', 'zakurad', '--property=ActiveState,NRestarts,MainPID,ExecStart'], text=True))
          for command in [['head', '-n', '100', '/var/log/zakura/zakura.log'], ['tail', '-n', '400', '/var/log/zakura/zakura.log']]:
              output = subprocess.check_output(command, text=True)
              print('\n'.join(line for line in output.splitlines() if 'ZakuradConfig' not in line))
          for method in ['getblockchaininfo', 'getpeerinfo']:
              request = urllib.request.Request('http://127.0.0.1:8232', data=json.dumps({'jsonrpc':'2.0','id':1,'method':method,'params':[]}).encode(), headers={'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(request, timeout=10) as response: print(method, response.read().decode())
              except Exception as error: print(method, str(error))
          for port in [9999, 19999]:
              try:
                  with urllib.request.urlopen(f'http://127.0.0.1:{port}/metrics', timeout=5) as response: data = response.read().decode()
                  print('METRICS', port)
                  print('\n'.join(line for line in data.splitlines() if not line.startswith('#') and any(key in line for key in ['sync_', 'peer_', 'state_', 'header_', 'zakura_'])))
              except Exception as error: print('METRICS', port, str(error))
          PYREMOTE
          cat /tmp/inspect/live.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr966-sync-diagnostics-${{ github.run_id }}
          path: /tmp/inspect/
      - name: Remove temporary runner key
        if: always()
        run: rm -f /tmp/do_ssh
