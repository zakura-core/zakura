name: Header-chain fuzzing

on:
  # Run the normative budgets Monday through Saturday.
  # Run the longer campaign on Sunday.
  schedule:
    - cron: "13 5 * * 1-6"
    - cron: "13 5 * * 0"
  workflow_dispatch:

concurrency:
  # One group per run, so a manual run never cancels a scheduled one on `main`.
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/fuzz-campaign.yml
    with:
      package: header-chain
      label: header
      weekly_cron: "13 5 * * 0"
      timeout_minutes: 180
      nightly: nightly-2026-07-15
