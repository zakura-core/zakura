[package]
name = "zakura-script"
version = "6.0.0"
authors.workspace = true
description = "Zakura transparent script verification. Internal crate, published to support cargo install zakura"
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

readme = "../../README.md"
# crates.io is limited to 5 keywords and categories
keywords.workspace = true
# Must be one of <https://crates.io/category_slugs>
categories = ["cryptography::cryptocurrencies"]

[dependencies]
zcash_script = { workspace = true }
zcash_primitives = { workspace = true }
zakura-chain = { path = "../zakura-chain", version = "17.0.0" }

thiserror = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
ripemd = { workspace = true }
secp256k1 = { workspace = true }
sha2 = { workspace = true }
zakura-test = { path = "../zakura-test", version = "4.0.0" }
# The NU7.1 branch ID that v7 test transactions commit to exists only in test builds.
zakura-chain = { path = "../zakura-chain", version = "17.0.0", features = ["zakura-test"] }

[lints]
workspace = true
