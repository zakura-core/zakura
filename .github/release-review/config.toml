    "crates/zakura-consensus/src/transaction/tests.rs",
    "crates/zakura-header-chain/src/transition/recovery/tests/",
    "crates/zakura-network/src/protocol/external/codec/tests/",
    "crates/zakura-network/src/zakura/block_sync/regulated/session/tests.rs",
    "crates/zakura-network/src/zakura/block_sync/regulated/session/tests/",
    "crates/zakura-network/src/zakura/block_sync/sequencer_task/tests/",
    "crates/zakura-network/src/zakura/block_sync/tests.rs",
    "crates/zakura-network/src/zakura/block_sync/tests/",
