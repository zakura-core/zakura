# The reader skips a frame whose header the frame filter refuses for
# reserved flags, reading and dropping its payload, instead of closing the
# connection. Its input is the saved reserved-flags Plan, whose adversary
# sends one `Status` with a reserved flag set, so
# `header-sync/s5v9/status/reserved-flags-closes` is the only ID it
# breaks.
# Besides the files the patch changes, the rest of these decide which
# frames the input's peers send and when the node judges them. A change
# there can move the input off its frame.
input = "crates/zakura-sim/tests/fixtures/header-wire-reserved-flags.bin"
checks = ["crates/zakura-network/src/zakura/transport", "crates/zakura-network/src/zakura/header_sync"]
