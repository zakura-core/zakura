[[audits.bls12_381]]
who = "Claude Opus 5 <noreply@anthropic.com>"
criteria = "safe-to-deploy"
version = "0.8.0"
notes = "Reviewed all packaged source, manifest, and tests. The crate is no_std-capable with a single unsafe expression and no build script; field and group arithmetic is written to run in constant time, using subtle's Choice and CtOption rather than branching on secret values, and decompression checks both the curve equation and subgroup membership before yielding a point. Curve behaviour was checked directly rather than only read: over random points and scalars the group law was verified for commutativity, associativity, identity, inverse, doubling against self-addition, and distributivity of scalar and point multiplication, and every encoding was required to round-trip while a single-bit mutation of an encoding was required never to decode back to the original point. Pairing bilinearity was checked over random inputs, confirming that pairing(aP, Q) equals pairing(P, aQ) and that a pairing with the identity is degenerate. All 124 tests passed with all features."

