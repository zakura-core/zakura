[package]
name = "zakura-sim"
authors.workspace = true
description = "Deterministic simulator for Zakura's P2P stack. Internal test crate, not published"
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories = ["development-tools::testing"]
# Only tests and the `zakura-sim` binary use it, and no published crate does.
publish = false
# `cargo run -p zakura-sim` runs the simulator, beside `header-acceptance`.
default-run = "zakura-sim"

# The crate is empty outside the simulator build, `RUSTFLAGS="--cfg zakura_sim"`.
[target.'cfg(zakura_sim)'.dependencies]
zakura-scheduler = { path = "../zakura-scheduler" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
# O_NOFOLLOW and O_NONBLOCK, so the trace reader never follows a symlink or
# blocks on a FIFO.
libc = { workspace = true }
# The harness registry's scenarios: the race fixtures, discovery, header
# sync and block sync. Mirror storage returns block sync's boxed read
# future.
futures = { workspace = true }
zakura-rt = { path = "../zakura-rt" }
# Header times and the scenario clock, for the header admission time rule.
chrono = { workspace = true }
zakura-chain = { path = "../zakura-chain" }
zakura-network = { path = "../zakura-network", features = ["p2p-fuzz"] }
zakura-node-services = { path = "../zakura-node-services" }
# The pool core and its storage, for the pool harness.
zakura-mempool = { path = "../zakura-mempool" }
zakura-quic = { path = "../zakura-quic" }
# Scripted peers draw their handshake nonces from the runtime's RNG, whose
# traits come from `rand`.
rand_10 = { workspace = true }
# Header storage as an action source, and its owner types for the
# observation encoding.
zakura-storage = { path = "../zakura-storage" }
zakura-header-chain = { path = "../zakura-header-chain" }
# The sidecars of committed fuzz seeds.
toml = { workspace = true }

[target.'cfg(zakura_sim)'.dev-dependencies]
proptest = { workspace = true }
# The run-thread test checks that header preparation never started rayon's
# global pool.
rayon = { workspace = true }
# zakura-rpc turns this on in workspace builds, so the trace tests run with it
# to check that equal records still write equal bytes.
serde_json = { workspace = true, features = ["preserve_order"] }
tempfile = { workspace = true }
# The header-acceptance checks read test items from source tokens, with
# line numbers.
proc-macro2 = { version = "1", features = ["span-locations"] }
# The header-acceptance scan also parses the crate's own source to find
# every `NotApplicable` construction.
syn = { version = "2", features = ["full", "visit"] }
# A runtime for the serving tool in the model agreement tests.
tokio = { workspace = true, features = ["rt", "time"] }
tokio-stream = { workspace = true }

# build.rs hashes the source for trace `meta` records.
[build-dependencies]
sha2 = { workspace = true }

[lints]
workspace = true
