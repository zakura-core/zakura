[package]
name = "zakura-quic"
version = "0.1.0"
authors.workspace = true
description = "Direct QUIC transport for Zakura's native P2P stack, built on noq. Internal crate, published to support cargo install zakura"
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords.workspace = true
categories = ["cryptography::cryptocurrencies", "network-programming"]

[features]
default = []

# Per-connection qlog output (SPEC CTRL-25). Release builds leave it off.
qlog = ["noq/qlog"]

[dependencies]
# SPEC DEP-2 lists every allowed direct dependency. Adding one needs a spec change.
bytes = { workspace = true }
ed25519-dalek = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
metrics = { workspace = true }
noq = { workspace = true }
ring = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
serde = { workspace = true, features = ["serde_derive"] }
socket2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "sync", "time", "macros"] }
tracing = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["net"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile = { workspace = true }

[lints]
workspace = true
