name: Refresh the disposable baseline seed peers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/do-cli
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          ssh_private_key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
      - name: Use verified public mainnet peers for the disposable baseline seed
        run: |
          set -euo pipefail
          NODE=$(doctl compute droplet list -o json | jq -ce '[.[] | select(.name | endswith("-34626268029"))] | if length == 1 then .[0] else error("expected one baseline task node") end')
          IP=$(jq -r '.networks.v4[] | select(.type == "public") | .ip_address' <<< "$NODE")
          jq '{id,name,region:.region.slug}' <<< "$NODE"
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i /tmp/do_ssh "root@${IP}" 'bash -se' <<'REMOTE'
          set -euo pipefail
          test "$(git -C /root/zakura rev-parse HEAD)" = a623e048f043265a0f5d8c3555a28455c5ed24c1
          test ! -e /root/out/paired/events.jsonl
          mkdir -p /root/out/seed-preparation-diagnostic
          cp /var/log/zakura/zakura.log /root/out/seed-preparation-diagnostic/before-restart.log
          test ! -e /root/out/seed-priming/summary.json
          python3 - <<'PYTHON'
          from pathlib import Path
          import json,urllib.request
          q=urllib.request.Request('http://127.0.0.1:8232/',data=b'{"jsonrpc":"2.0","id":"seed","method":"getblockcount","params":[]}',headers={'Content-Type':'application/json'})
          with urllib.request.urlopen(q,timeout=5) as r: height=json.load(r)['result']
          assert height < 3476010, height
          p=Path('/etc/zakura/zakura.toml')
          s=p.read_text()
          assert 'p2p_stack = "legacy"' in s
          assert 'initial_mainnet_peers' not in s
          s=s.replace('[network]\n', '[network]\ninitial_mainnet_peers = ["104.131.184.123:8233", "143.244.184.176:8233", "159.203.38.10:8233"]\n',1)
          p.write_text(s)
          with Path('/root/out/seed-preparation-diagnostic/README.txt').open('a') as f:
              f.write('Preparation peer discovery remained slow after restart. Added three public mainnet peers from deploy/gateway/mainnet/backends.toml, each freshly verified at height 3479904 with an open P2P port. Only the disposable seed configuration changed. The later native-only serving configuration is regenerated by deploy.py.\n')
          PYTHON
          systemctl restart zakurad
          systemctl is-active zakurad
          REMOTE
