name: Inspect instrumented checkpoint runs
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/do-cli
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          ssh_private_key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
      - name: Read only process and sync diagnostics from the two task nodes
        run: |
          set -euo pipefail
          mkdir -p /tmp/diagnostics
          for RUN in 34624030205 34623964556; do
            NODE=$(doctl compute droplet list -o json | jq -ce --arg run "$RUN" '[.[] | select(.name | endswith("-" + $run))] | if length == 1 then .[0] else error("expected one task node") end')
            IP=$(jq -r '.networks.v4[] | select(.type == "public") | .ip_address' <<< "$NODE")
            jq '{id,name,region:.region.slug}' <<< "$NODE"
            ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i /tmp/do_ssh "root@${IP}" 'date -u; git -C /root/zakura rev-parse HEAD; ps -eo pid,pcpu,pmem,comm --sort=-pcpu | head -12; tail -5 /root/out/paired/events.jsonl 2>/dev/null || true; tail -100 /root/out/paired/downloader.log 2>/dev/null || true; tail -80 /var/log/zakura/zakura.log 2>/dev/null || true' | tee "/tmp/diagnostics/${RUN}.txt"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: handoff-live-${{ github.run_id }}
          path: /tmp/diagnostics/
          retention-days: 14
