name: Header serving seed peer correction
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - droplet: '599702107'
            owner_run: '34627879665'
          - droplet: '599702290'
            owner_run: '34627881215'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/do-cli
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          ssh_private_key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
      - name: Correct peers only on owned disposable test seeds
        env:
          DROPLET_ID: ${{ matrix.droplet }}
          OWNER_RUN: ${{ matrix.owner_run }}
        run: |
          set -euo pipefail
          doctl compute droplet get "$DROPLET_ID" -o json > /tmp/owned-droplet.json
          IP=$(python3 - <<'PY'
          import json, os
          d=json.load(open('/tmp/owned-droplet.json'))[0]
          assert str(d['id']) == os.environ['DROPLET_ID']
          assert d['name'].startswith('zakura-pr-adam-header-serving-')
          assert d['name'].endswith('-'+os.environ['OWNER_RUN'])
          print(next(n['ip_address'] for n in d['networks']['v4'] if n['type']=='public'))
          PY
          )
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -i /tmp/do_ssh "root@$IP" python3 - < .github/workflows/scripts/header-serving-peer-correction.py
