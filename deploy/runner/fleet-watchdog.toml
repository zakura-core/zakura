# The Mainnet release-state pipeline. Watching the published pointer rather than the
# generator's unit is deliberate: it catches a timer that silently stopped firing and
# a host that vanished, neither of which a systemd OnFailure would report. The
# generator exports daily, and the 48h default window matches
# fetch-release-state.py's --max-age-hours, so an alert fires before the weekly
# import would refuse the bundle rather than after.
[[release_state]]
name = "mainnet"
url = "https://zakura-release.valargroup.dev/release-state/latest.json"

# zcashd-compat health on the dedicated compatibility host, probed over SSH with
# the zakura-compat-check installed there (deploy/runner/zakura_monitoring). The
# lane only runs once monitoring cutover sets ZAKURA_COMPAT_MONITORING=1 in a
# systemd drop-in. Every probe, SSH included, is bounded by `timeout`.
[[compatibility]]
name = "zakura-compat"
ssh_target = "root@159.203.113.196"
checker = "/opt/zakura-monitoring/current/zakura-compat-check"
env_file = "/etc/zakura-monitoring/compat.env"
known_hosts = "/etc/zakura-fleet-watchdog/known_hosts"
interval = 60
timeout = 120
remote_deadline = 100
# Same as the checker default and the deployed Rust watchdog.
height_max_drift = 10
