[workspace]
members = [
        "crates/zakurad",
        "crates/zakura-chain",
        "crates/zakura-mmr-tree",
        "crates/zakura-header-chain",
        "crates/zakura-network",
        "crates/zakura-quic",
        "crates/zakura-rt",
        "crates/zakura-scheduler",
        "crates/zakura-sim",
        "crates/zakura-state",
        "crates/zakura-script",
        "crates/zakura-consensus",
        "crates/zakura-rpc",
        "crates/zakura-node-services",
        "crates/zakura-test",
        "crates/zakura-utils",
        "crates/xtask",
        "crates/zakura-jsonl-trace",
]

# The asset packaging crate publishes on the release-state cadence rather than with the
# workspace, and its payload is generated rather than committed, so it is deliberately not a
# member. Zakura consumes the published crate from crates.io like any other dependency.
exclude = ["crates/zakura-assets"]

# Use the edition 2021 dependency resolver in the workspace, to match the crates
resolver = "2"

[workspace.package]
authors = ["Zakura Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/zakura-core/zakura"
keywords = ["zakura", "zcash"]
rust-version = "1.97"
edition = "2021"

[workspace.dependencies]
# Zakura's published binary assets: the reviewed Mainnet historical frontier grid, which is too
# large to carry in git history at the weekly cadence the release state advances.
#
# The version is `0.<last_checkpoint>.<revision>`, so the pin states which checkpoint the payload
# covers and `scripts/check-release-state.sh` can hold it against the committed provenance
# manifest without fetching anything. The requirement is exact because these are reviewed bytes,
# not a compatible range; `Cargo.lock` carries the registry checksum that pins them.
#
# Published from `crates/zakura-assets/` in this repository. The dependency name and the
# published name now match, so no `package` rename is needed: every consumer, script, and
# gate refers to `zakura-assets` and nothing else.
zakura-assets = { version = "=0.3524060.0" }
incrementalmerkletree = { version = "0.8.2", features = ["legacy-api"] }
orchard = { version = "=4.0.0", package = "zakura-orchard", default-features = false, features = ["backend-halo2", "circuit", "multicore", "std"] }
sapling-crypto = { version = "=4.0.0", package = "zakura-sapling-crypto", default-features = false, features = ["circuit", "multicore"] }
zcash_address = { version = "=4.0.0", package = "zakura-address", default-features = false, features = ["std"] }
zakura-mmr-tree = { path = "crates/zakura-mmr-tree", version = "0.1.0" }
zcash_primitives = { version = "=4.0.0", package = "zakura-primitives", default-features = false, features = ["std", "circuits", "multicore", "backend-halo2"] }
zcash_transparent = { version = "=4.0.0", package = "zakura-transparent", default-features = false, features = ["std"] }
zcash_protocol = { version = "=4.0.0", package = "zakura-protocol", default-features = false, features = ["std"] }
base64 = "0.22.1"
bech32 = "0.11.0"
bellman = { version = "=4.0.0", package = "zakura-bellman" }
bitflags = "2.9"
bitvec = "1.0"
blake2b_simd = "1.0"
blake2s_simd = "1.0"
bls12_381 = { version = "=4.0.0", package = "zakura-bls12-381" }
bs58 = "0.5"
byteorder = "1.5"
bytes = "1.10"
chrono = { version = "0.4.45", default-features = false, features = ["now"] }
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage", "error-context"] }
corosensei = "=0.3.4"
criterion = { version = "0.8.2", default-features = false, features = ["rayon", "cargo_bench_support"] }
curve25519-dalek = "4.1"
derive-new = "0.7"
ed25519-zebra = "4.2"
equihash = { version = "=4.0.0", package = "zakura-equihash" }
eyre = { version = "0.6.12", default-features = false, features = ["auto-install"] }
futures = "0.3.31"
futures-core = "0.3.31"
futures-util = "0.3.31"
getset = "0.1.7"
group = "0.14"
halo2 = { version = "=4.0.0", package = "zakura-halo2-proofs" }
hex = "0.4.3"
http-body = "1.0.1"
http-body-util = "0.1.3"
hyper = "1.6"
hyper-util = "0.1.11"
indexmap = "2.8"
insta = "1.42"
itertools = "0.14"
jubjub = { version = "=4.0.0", package = "zakura-jubjub" }
async-trait = "0.1.89"
lazy_static = "1.4"
libc = "0.2"
log = "0.4.27"
metrics = "0.24"
once_cell = "1.21"
pin-project = "1.1.10"
pin-project-lite = "0.2.17"
# Property tests run in-process; subprocess forking and per-case timeouts are unused.
proptest = { version = "1.6", default-features = false, features = ["std"] }
proptest-derive = "0.5"
prost = "0.14"
rand_core = "0.6"
rand_10 = { package = "rand", version = "0.10" }
rand_chacha_10 = { package = "rand_chacha", version = "0.10" }
rand_core_10 = { package = "rand_core", version = "0.10" }
rayon = "1.10"
reddsa = { version = "=4.0.0", package = "zakura-reddsa" }
redjubjub = { version = "=4.0.0", package = "zakura-redjubjub" }
regex = "1.11"
# SPEC DEP-4: the sans-I/O QUIC state machine only. zakura-quic owns the socket
# layer and the async driver, so neither `quinn` nor `quinn-udp` is a dependency.
quinn-proto = { version = "0.11.19", default-features = false, features = ["rustls-ring"] }
ripemd = "0.1"
ring = "0.17.14"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1.12"
# Zakura's fork of rocksdb 0.24.0 (https://github.com/zakura-core/rust-rocksdb-wrapper).
# It compiles the bundled RocksDB C++ as a unity build, 16 sources per
# translation unit. The library is still named `rocksdb`, so no code changes
# are needed.
#
# `full` compiles all of RocksDB. Without it, zakura-librocksdb-sys 0.17.5 skips
# the sources of features Zakura does not use, but still compiles
# utilities/transactions/snapshot_checker.cc, which calls into the skipped
# write-prepared transaction code. Whether that dangling reference survives
# the link depends on the C++ toolchain: GCC 16 keeps it, and `zakurad` fails
# to link with an undefined `WritePreparedTxnDB::GetCommitEntry`. Keep `full`
# until a fork release removes the reference.
#
# `bindgen-runtime` makes zakura-librocksdb-sys's bindgen load libclang itself.
# Without it, a build that resolves a second bindgen version elsewhere (for
# example the fresh placeholder project cargo-semver-checks generates) unifies
# clang-sys into runtime mode while this bindgen never loads the library, and
# the build script panics with "a `libclang` shared library is not loaded on
# this thread".
rocksdb = { version = "=0.24.2", package = "zakura-rocksdb", default-features = false, features = ["bindgen-runtime", "full"] }
secp256k1 = "0.33"
semver = "1.0.26"
serde = "1.0.219"
serde_json = "1.0.140"
sha2 = "0.10"
socket2 = "0.6"
sinsemilla = { version = "=4.0.0", package = "zakura-sinsemilla" }
anyhow = "1.0"
subtle = { version = "2.6", default-features = false }
tempfile = "3.20"
thiserror = "2.0"
tokio = "1.44"
tokio-stream = "0.1.17"
tokio-util = "0.7.14"
# Production code only parses TOML; tests that serialize it enable `display`.
toml = { version = "1.0", default-features = false, features = ["parse", "serde", "std"] }
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = "0.14"
# `cleanup-markdown` only rewrites doc comments, and pulls in pulldown-cmark,
# pulldown-cmark-to-cmark and unicase; xtask does not need it.
tonic-prost-build = { version = "0.14", default-features = false, features = ["transport"] }
tower = "0.5.3"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
uint = "0.10"
zcash_note_encryption = { version = "=4.0.0", package = "zakura-note-encryption" }
zcash_script = "0.6"
zeroize = "1.8"

# All cargo-release configuration lives in this table. Do not add a root
# release.toml: it would silently shadow every setting here (cargo-release
# reads a workspace release.toml in preference to this metadata table).
[workspace.metadata.release]

# Only allow releases from the main branch or a hotfix release branch
# (see docs/security-hotfix-release.md)
allow-branch = ["main", "hotfix/v*"]

# Workspace crate versions are deliberately independent: a crate is bumped and
# published only when it has changes to publish. Do not configure
# `shared-version` groups.

# Verify releases with release features
#
# TODO: add this feature to all crates
#enable-features = ["default-release-binaries"]

# Don't do a git push or tag: `v*` tags are created only by the release App
# via the `Create release` workflow (see docs/release-tag-protection.md)
push = false
tag = false

# Owners for new crates
owners = ["valardragon", "p0mvn", "evan-forbes", "czarcas7ic", "ebfull"]

# Only rewrite dependent version requirements when the existing requirement
# no longer matches: unchanged crates must stay untouched (and unpublished)
# when a dependency takes a compatible bump.
dependent-version = "fix"

# Compilation settings

[profile.dev]
# panic = "unwind" (NOT "abort") is REQUIRED for Zakura peer-pipe panic
# containment: a panicking peer task must be caught and disconnect only that
# peer, never abort the whole node (a trivial remote DoS otherwise). Because we
# now unwind, every shared/consensus-state critical section must stay panic-free
# (no `.await`/`.expect()`/`.unwrap()`/indexing under a lock) — a panic mid-
# mutation would unwind through it instead of aborting. zakura-network enforces
# unwind with a `#[cfg(panic = "abort")] compile_error!`. See
# security_requirements.md SR-1 and SR-2.
panic = "unwind"

# Speed up tests by optimizing performance-critical crates. The parameters
# values are the ones from the `release` profile
# (https://doc.rust-lang.org/cargo/reference/profiles.html#release)

# Cryptographic crates

[profile.dev.package.blake2b_simd]
opt-level = 3
debug-assertions = false
overflow-checks = false
incremental = false
codegen-units = 16

[profile.dev.package.ff]
opt-level = 3
debug-assertions = false
overflow-checks = false
incremental = false
codegen-units = 16

[profile.dev.package.group]
opt-level = 3
debug-assertions = false
overflow-checks = false
incremental = false
codegen-units = 16

[profile.dev.package.zakura-pasta-curves]
opt-level = 3
debug-assertions = false
overflow-checks = false
incremental = false
codegen-units = 16

[profile.dev.package.zakura-halo2-proofs]
opt-level = 3
debug-assertions = false
overflow-checks = false
incremental = false
codegen-units = 16

[profile.dev.package.zakura-halo2-gadgets]
opt-level = 3
debug-assertions = false
overflow-checks = false
incremental = false
codegen-units = 16

[profile.dev.package.zakura-bls12-381]
opt-level = 3
debug-assertions = false
overflow-checks = false
incremental = false
codegen-units = 16

[profile.dev.package.byteorder]
opt-level = 3
debug-assertions = false
overflow-checks = false
incremental = false
codegen-units = 16

[profile.dev.package.zakura-equihash]
opt-level = 3
debug-assertions = false
overflow-checks = false
incremental = false
codegen-units = 16

[profile.dev.package.ring]
opt-level = 3
debug-assertions = false
overflow-checks = false
incremental = false
codegen-units = 16

[profile.dev.package.untrusted]
opt-level = 3
debug-assertions = false
overflow-checks = false
incremental = false
codegen-units = 16

[profile.dev.package.bitvec]
opt-level = 3
debug-assertions = false
overflow-checks = false
incremental = false
codegen-units = 16

# Block sync hashes every body's transaction ids on its peer tasks.
[profile.dev.package.sha2]
opt-level = 3
debug-assertions = false
overflow-checks = false
incremental = false
codegen-units = 16

[profile.test]
# Match CI, where the toolchain action sets CARGO_PROFILE_DEV_DEBUG=0. Full
# debuginfo slows each test build by about 25%. Panic messages still name the
# panicking file and line. `cargo build` keeps full debuginfo for debugging.
debug = 0

[profile.release]
# See [profile.dev]: panic = "unwind" is required for peer-pipe panic containment
# (security_requirements.md SR-1); do not set "abort". Enforced by a
# compile_error guard in zakura-network.
panic = "unwind"

# Speed up release builds and sync tests using link-time optimization.
# Some of Zakura's code is CPU-intensive, and needs extra optimizations for peak performance.
#
# TODO:
# - add "-Clinker-plugin-lto" in .cargo/config.toml to speed up release builds
#     - add "-Clinker=clang -Clink-arg=-fuse-ld=lld" in .cargo/config.toml
# - also use LTO on C/C++ code:
#     - use clang to compile all C/C++ code
#     - add "-flto=thin" to all C/C++ code builds
#     - see https://doc.rust-lang.org/rustc/linker-plugin-lto.html#cc-code-as-a-dependency-in-rust
lto = "thin"

# Each codegen unit gets its own copy of the generic code and drop glue it uses,
# and thin LTO does not merge those copies. 4 units instead of the default 16
# shrinks zakurad's .text by about 5% while still using 4 cores per crate, the
# size of the standard CI runners.
codegen-units = 4

# Enable line numbers in stack traces. Note that we re-disable it for dependencies below.
debug = "line-tables-only"

[profile.release.package."*"]
# Disable debug info for dependencies to reduce binary size.
debug = false
# Dependencies rarely rebuild and compile in parallel with each other, so one
# codegen unit each costs little build time. It removes the extra per-unit
# copies of the generic code they use, shrinking zakurad's .text by about 2%.
# Workspace crates keep 4 units so edit-and-rebuild stays parallel.
codegen-units = 1

[profile.ci-tests]
inherits = "release"
# Unit tests need optimized execution, but do not need the production profile's
# most expensive code generation or cross-crate optimization.
opt-level = 2
lto = "off"

[workspace.lints.rust]
# The linter should ignore these expected config flags/values
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(zcash_unstable, values("zfuture", "nu6.1", "nu7"))', # Used in Zakura and librustzcash
    'cfg(zakura_sim)', # The deterministic P2P simulator build of zakura-rt
] }

# High-risk code
unsafe_code = "deny"
non_ascii_idents = "deny"

# Compatibility
rust_2021_compatibility = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
future_incompatible = { level = "warn", priority = -1 }

# Documentation
missing_docs = "warn"

[workspace.lints.clippy]
# Async code
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"

# Pointers
cast_ptr_alignment = "warn"
fn_to_numeric_cast_any = "warn"

# Integers
checked_conversions = "warn"
implicit_saturating_sub = "warn"
invalid_upcast_comparisons = "warn"
range_minus_one = "warn"
range_plus_one = "warn"
unnecessary_cast = "warn"

# Incomplete code
dbg_macro = "warn"
todo = "warn"

# Manual debugging output — use tracing::trace!() or tracing::debug!() instead
print_stdout = "warn"
print_stderr = "warn"

# Code styles we want to accept
try_err = "allow"

# Clippy 1.99 reports these in code that `derive-new`, `thiserror` and `tonic`
# generate, which we can't change.
double_must_use = "allow"
redundant_field_names = "allow"

# Panics
fallible_impl_from = "warn"
unwrap_in_result = "warn"

# TODOs: fix this lint eventually
result_large_err = "allow"
