who = "OpenAI Codex <noreply@openai.com>"
criteria = "safe-to-deploy"
version = "0.4.1"
notes = "Reviewed all packaged source and manifest, including Unix account lookup, XDG parsing, Redox lookup, and Windows known-folder APIs. getpwuid_r receives a live capacity-sized buffer and its returned C string is copied before the buffer drops; Windows checks the API result, bounds the returned string by lstrlenW, and frees COM memory on both paths. Runtime authority is limited to documented environment, account, XDG file, and known-folder reads. There is no build script, network access, or process execution, and the host library target passed."

