# The reactor returns by itself once its last session ends, after an idle
# grace period in which it polls none of its calls, and its teardown drops
# the calls still in flight. The input is the late-fault fixture, scripted
# because no Plan bytes reach it: the peer disconnects while the node's
# storage holds the preparation of its invalid tip, so the reactor starts
# its grace period with that call in flight. The hold ends during the
# grace period, the preparation fails `InvalidHeader`, and its reply
# reaches the reactor, which returns without taking it. The tap records
# `ReactorExited`, not a `Shutdown`, so the drop doesn't clear the owed
# penalty (hf-3's rule): the run settles, and the end replay keeps it as
# the required `DroppedFault`. This is C2's owed penalty concluding
# violated at the drain's end, through a node-side abandonment. The drop
# ends the call, so its released round still settles and
# `teardown-returns-baseline` holds.
# Besides reactor.rs, which the patch changes, the rest of header sync
# decides when the node submits that preparation and when the disconnect
# retires its round. A change there can move the script off its late fault.
checks = ["crates/zakura-network/src/zakura/header_sync"]

[typed]
harness = "header-sync/wire"
scenario = "crates/zakura-sim/tests/fixtures/header-wire-late-fault.json"
script = "crates/zakura-sim/tests/fixtures/header-wire-late-fault.script.json"
