[package]
name = "zakura-profile-explorer"
version = "0.1.0"
publish = false
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Local block profile collector and explorer"

[dependencies]
zakura-jsonl-trace = { path = "../zakura-jsonl-trace", version = "1.3.0" }
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
clap = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
axum = "0.8"
rusqlite = { version = "0.40.2", features = ["bundled", "hooks"] }
zstd = "0.13"
rand.workspace = true
hex.workspace = true
fs2 = "0.4"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
