[package]
name = "zakura-fork-txload"
version = "0.1.0"
authors.workspace = true
description = "Drives fee-bearing transactions onto the NU7 fork testnet, to exercise NU7 fee recycling"
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

# This crate is deploy/operator tooling, not a published library.
publish = false

[dependencies]
clap = { workspace = true, features = ["derive", "env"] }
color-eyre = { workspace = true }
blake2b_simd = { workspace = true }
hex = { workspace = true }
rand_10 = { workspace = true }
reddsa = { workspace = true }
secp256k1 = { workspace = true, features = ["global-context"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
zcash_address = { workspace = true }

# `proving` pulls in the Halo2 prover. Shielding a transparent coinbase output is
# the only way to spend it: consensus requires a transaction that spends
# transparent coinbase to have no transparent outputs.
orchard = { workspace = true, features = ["circuit"] }
zakura-chain = { path = "../../../crates/zakura-chain" }
zakura-network = { path = "../../../crates/zakura-network" }
zakura-node-services = { path = "../../../crates/zakura-node-services", features = ["rpc-client"] }
zakura-rpc = { path = "../../../crates/zakura-rpc" }

[lints]
workspace = true
