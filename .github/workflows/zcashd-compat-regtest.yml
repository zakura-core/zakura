name: zcashd-compat Regtest

# Runs the managed zcashd-compat Regtest integration suite.
#
# The test harness spawns a fresh zakurad and zcashd on randomised ports, so no
# external infrastructure is required. It uses the P2P sidecar zcashd that
# crates/zakurad/zcashd-compat-manifest.json pins.
#
# It runs once with each pool: today's, and the pool core behind the
# `[mempool] implementation` switch. It runs for pull requests that change the
# zcashd-compat code, its tests, the manifest or the pool core, nightly, and on
# demand.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
  pull_request:
    paths:
      - ".github/workflows/zcashd-compat-regtest.yml"
      - "crates/zakurad/src/components/zcashd_compat/**"
      - "crates/zakurad/tests/common/zcashd_compat/**"
      - "crates/zakurad/tests/common/zcashd_compat.rs"
      - "crates/zakurad/zcashd-compat-manifest.json"
      - "crates/zakurad/src/components/mempool/core/**"
      - "crates/zakura-mempool/**"
      - "scripts/make/zcashd-compat.mk"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_LIB_BACKTRACE: 1
  RUST_LOG: info
  COLORBT_SHOW_HIDDEN: 1

jobs:
  zcashd-compat-regtest:
    name: zcashd-compat regtest suite (${{ matrix.pool }} pool)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        pool: [classic, core]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f #v2.0.0
        with:
          toolchain: stable
          cache-key: zcashd-compat-regtest
          cache-on-failure: true
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 #v2.88.0
        with:
          tool: cargo-nextest

      - uses: ./.github/actions/setup-zakura-build

      # Uses the embedded zcashd download (TEST_ZCASHD_PATH unset).
      - name: Run zcashd-compat regtest suite
        env:
          # zakurad reads `ZAKURA_SECTION__KEY` over its config file, and the
          # suite's zakurad inherits this.
          ZAKURA_MEMPOOL__IMPLEMENTATION: ${{ matrix.pool }}
        run: make compat-test-regtest
