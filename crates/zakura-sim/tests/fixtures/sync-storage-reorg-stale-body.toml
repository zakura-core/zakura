# The committed fuzz input `sync-storage-reorg-stale-body.bin`: the harness
# that runs it, the generator version it was built for, and its SHA-256. Its
# first two bytes pick the saved `reorg` scenario: the mirrors fork from
# height 4 once the node has admitted four bodies. The rest is Plan bytes
# from the simulator tests' fuzz inputs: `regenerate_reorg_stale_body_input`
# in sync_harness.rs writes the first one whose run delivers an old-epoch
# body after the sequencer applied the new epoch, which the sequencer
# refuses as stale. Rerun it when a sync change moves the input off that
# order, as #2321 moved `sync-storage-reorg.bin`.
harness = "sync/storage"
generator = 3
sha256 = "be81fccf6976351c4ba4ccaec4707bbb0789c158c7ce0df31bf507a8a7aadcc9"
scenario_sha256 = "1e0c39c5352f2d8048d7eafbd745cd88c100008f80125e405adaa9f0d8cfda20"
source = "crates/zakura-sim/tests/sync_harness.rs"

[[witness]]
property = "sync/header-reorg-retires-block-work"
expect = "holds"
