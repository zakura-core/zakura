[package]
name = "zakura-script"
version = "5.0.0"
authors.workspace = true
description = "Zakura transparent script verification in Rust. Internal crate, published to support cargo install zakura"
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

readme = "../../README.md"
# crates.io is limited to 5 keywords and categories
keywords.workspace = true
# Must be one of <https://crates.io/category_slugs>
categories = ["cryptography::cryptocurrencies"]

[features]
default = []

[dependencies]
zcash_script = { workspace = true }
zcash_primitives = { workspace = true }
zakura-chain = { path = "../zakura-chain", version = "9.0.0" }

thiserror = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
lazy_static = { workspace = true }
ripemd = { workspace = true }
secp256k1 = { workspace = true }
sha2 = { workspace = true }
zakura-test = { path = "../zakura-test", version = "2.2.0" }

[lints]
workspace = true
