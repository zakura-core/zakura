name: Mac verifier

on:
  pull_request:
    paths:
      - 'deploy/mac-verifier/**'
      - 'deploy/runner/zakura-cluster-status.py'
      - 'deploy/runner/zakura-cluster-watchdog.py'
      - 'deploy/runner/test_zakura_cluster_watchdog.py'
      - 'deploy/runner/test_zakura_cluster_status.py'
      - '.github/workflows/mac-verifier.yml'
      - '.github/workflows/deploy-mac-verifier.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/mac-verifier/**'
      - 'deploy/runner/zakura-cluster-status.py'
      - 'deploy/runner/zakura-cluster-watchdog.py'
      - 'deploy/runner/test_zakura_cluster_watchdog.py'
      - 'deploy/runner/test_zakura_cluster_status.py'
      - '.github/workflows/mac-verifier.yml'
      - '.github/workflows/deploy-mac-verifier.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cranelift-candidate:
    uses: ./.github/workflows/deploy-mac-verifier.yml

  tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s deploy/mac-verifier/tests -v
      - run: python3 -m unittest discover -s deploy/mac-verifier/cranelift -p 'test_*.py' -v
      - run: python3 deploy/runner/test_zakura_cluster_status.py
      - run: python3 deploy/runner/test_zakura_cluster_watchdog.py
