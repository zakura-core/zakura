# A node round's apply installs its transition and also makes the selected
# projection the whole path to a held side branch's tip, ancestry intact,
# keeping the engine's selected frontier.
# The fixture's own preload applies faithfully. The reactor, the queue, the
# storage adapter and the engine decide how the witness's rounds apply, so a
# change there can move the witness off it.
checks = ["crates/zakura-network/src/zakura/header_sync", "crates/zakura-storage/src/header", "crates/zakura-header-chain/src/transition"]

[typed]
harness = "header-sync/storage"
scenario = "crates/zakura-sim/tests/fixtures/header-authority-forks-sharing-a-header.json"
plan = "crates/zakura-sim/tests/fixtures/header-authority-forks-sharing-a-header.plan"
