notes = "Reviewed all packaged source, manifest, the decoder, encoder, and the word and SIMD backends. The crate is no_std with no build script and no capability beyond the buffers it is given; the portable-SIMD backend is behind the non-default nightly feature, so this workspace uses the word-at-a-time backend. Its unchecked slice reads are each preceded by an explicit bound check, and the surrogate reconstruction cannot underflow because the four-byte validation mask pins the high surrogate to 0xD800..=0xDBFF and the low surrogate to 0xDC00..=0xDFFF before the subtraction. The decoder ends in String::from_utf8_unchecked, so it was exercised directly: 200000 random byte strings through decode, decode_lossy, and both MUTF-8 counterparts produced no panic and output that re-validated as UTF-8 every time, in debug and release, and the encode-decode round trip was exact for ASCII, multibyte, and supplementary-plane inputs. All 32 documentation tests passed; the packaged tests/random.rs cannot run because it imports a path dev-dependency that is not part of the published crate."

[[audits.simdutf8]]
who = "Claude Opus 5 <noreply@anthropic.com>"
criteria = "safe-to-deploy"
version = "0.1.5"
notes = "Reviewed all packaged source, manifest, the dispatch layer, and tests. The crate has no build script and no capability beyond the slice it validates; x86 selects between AVX2, SSE4.2, and the std fallback through is_x86_feature_detected behind an AtomicPtr cache, aarch64 uses NEON only where it is a baseline target feature, and every other architecture falls through to core::str::from_utf8. Because basic::from_utf8 hands its result to from_utf8_unchecked, validation was checked differentially against core::str::from_utf8 over 400000 inputs, half uniformly random bytes and half bit-flipped valid UTF-8 so that near-miss encodings are reached; basic agreed on validity and compat agreed on validity, valid_up_to, and error_len for all of them, on aarch64 with NEON and on x86_64 with SSE4.2. All 11 integration and 3 documentation tests passed on both. The AVX2 implementation was reviewed by reading only; no AVX2-capable host was available to execute it. Note that all-features does not build on stable, since the aarch64_neon feature requires a nightly compiler feature gate."

