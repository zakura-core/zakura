# Default configuration for zakurad.
#
# This file can be used as a skeleton for custom configs.
#
# Unspecified fields use default values. Optional fields are Some(field) if the
# field is present and None if it is absent.
#
# This file is generated as an example using zakurad's current defaults.
# You should set only the config options you want to keep, and delete the rest.
# Only a subset of fields are present in the skeleton, since optional values
# whose default is None are omitted.
#
# The config format (including a complete list of sections and fields) is
# documented here:
# https://docs.rs/zakura/latest/zakurad/config/struct.ZakuradConfig.html
#
# CONFIGURATION SOURCES (in order of precedence, highest to lowest):
#
# 1. Environment variables with ZAKURA_ prefix (highest precedence)
#    - Format: ZAKURA_SECTION__KEY (double underscore for nested keys)
#    - Examples:
#      - ZAKURA_NETWORK__NETWORK=Testnet
#      - ZAKURA_RPC__LISTEN_ADDR=127.0.0.1:8232
#      - ZAKURA_STATE__CACHE_DIR=/path/to/cache
#      - ZAKURA_TRACING__FILTER=debug
#      - ZAKURA_METRICS__ENDPOINT_ADDR=0.0.0.0:9999
#
# 2. Environment variables with deprecated ZEBRA_ prefix
#
# 3. Configuration file (TOML format)
#    - At the path specified via -c flag, e.g. `zakurad -c myconfig.toml start`, or
#    - At the default path in the user's preference directory (platform-dependent, see below)
#
# 4. Hard-coded defaults (lowest precedence)
#
# The user's preference directory and the default path to the `zakurad` config
# are platform dependent:
#
# | Platform | Value                                 | Example                                        |
# | -------- | ------------------------------------- | ---------------------------------------------- |
# | Linux    | `$XDG_CONFIG_HOME` or `$HOME/.config` | `/home/alice/.config/zakura.toml`              |
# | macOS    | `$HOME/Library/Preferences`           | `/Users/Alice/Library/Preferences/zakura.toml` |
# | Windows  | `{FOLDERID_LocalAppData}`           | `C:\Users\Alice\AppData\Local\zakura.toml`     |

[consensus]
checkpoint_sync = true

[health]
enforce_on_test_networks = false
min_connected_peers = 1
ready_max_blocks_behind = 2
ready_max_tip_age = "5m"

[memory]
# "auto" (default): the tightest host or cgroup limit. Or a byte size: "16 GiB".
budget = "auto"

# Optional. Shares of the bulk pool when consumers contend. Default: equal.
[memory.weight]
block_sync = 1
serving = 1
sessions = 1
tx = 1

[mempool]
eviction_memory_time = "1h"
implementation = "default"
max_datacarrier_bytes = 83
max_transaction_bytes = 250000
tx_cost_limit = 80000000

[metrics]

[mining]
internal_miner = false
miner_mesh = false
optimistic_block_inventory = true

[network]
# Announce to the initial group immediately, then everyone else after one delay.
# The initial group shrinks from the small-block to the full-block window between
# the block-size thresholds below. Zero delay announces to all peers immediately.
advert_delay = "500ms"
advert_window_full_block = 32
advert_window_full_size_bytes = 1572864
advert_window_small_block = 64
advert_window_small_size_bytes = 102400
cache_dir = true
crawl_new_peer_interval = "1m 1s"
expose_peer_addresses = false
identity_dir = "@NETWORK_IDENTITY_DIR@"
initial_mainnet_peers = [
    "dnsseed.str4d.xyz:8233",
    "dnsseed.z.cash:8233",
    "mainnet.seeder.shieldedinfra.net:8233",
    "mainnet.seeder.zfnd.org:8233",
]
initial_testnet_peers = [
    "dnsseed.testnet.z.cash:18233",
    "testnet.seeder.zfnd.org:18233",
]
listen_addr = "[::]:8233"
max_connections_per_ip = 1
network = "Mainnet"
# The peer-to-peer stack to run:
# - "legacy": the legacy TCP Zcash P2P stack only.
# - "zakura": the experimental native Zakura P2P v2 stack only.
# - "dual": both stacks, enabling experimental v2 with legacy fallback.
# - "default": Zakura's default for this network, which can change between
#   releases. Currently "legacy" on Mainnet, and "dual" everywhere else.
p2p_stack = "default"
peerset_initial_target_size = 100
push_relayed_blocks = false
unconditional_peers = []

# Send padded pings on new legacy TCP connections to help grow their send window
# before the first full block. Needs net.ipv4.tcp_slow_start_after_idle = 0.
[network.tcp_warmup]
chunk_timeout = "5s"
enabled = false
first_chunk_bytes = 800000
max_chunk_bytes = 1600000
max_concurrent = 16
peer_cooldown = "1day"
tip_quiet = "2s"

# When several idle legacy peers announced a block, ask the one expected to
# answer sooner, from its recent ping and block answer times, instead of the
# less loaded one, and also ask a later announcer expected to deliver it
# clearly sooner than the first.
[network.block_download_score_and_hedge]
enabled = false

[network.zakura]
bootstrap_peers = [
    "a5f148b592404c5fcdc27f06919681c1dceddb274336abf5c91e70780471bc12@165.22.54.66:8234",
    "10e8b19b6aabb5ccd80d2df14fabc991602aea0cfb82783ebdabb3b1b699e9b7@104.131.184.123:8234",
    "ca22584f4392a26c46f9553e45db00fc8de06f1ff8f2c48f5d28b5cd58f134b6@159.65.183.89:8234",
    "27fec1ed7f52ca389f8ad09e79e896fe6f0097dea6d74b71628dce992cb50b57@143.244.184.176:8234",
    "a4ef400514ea1eaceea73e2b1a86f4102264e88cfc8b3ace9da73d43c7ccb7c2@159.203.38.10:8234",
    "9addeca7e4ea8aced48fcf9e3a9f8ce21056fecf9c0bbce368b61ec35b4e5bdc@64.227.44.93:8234",
    "5f0cc2933a058472140348ebe708ff7a10167cd7e9cd96fa19263ecdf62a3fbe@161.35.156.226:8234",
    "6a13975563f5883fda0b8b0b1cee54163dedf786dc8f1b4990d2130e7cc56b51@139.59.64.115:8234",
    "a8a2de1c199100dcd1e7985a30a6a07858d45ee3703794d9d214827724067431@168.144.173.250:8234",
]
listen_addr = "0.0.0.0:8234"
# Connection policy cap (defaults to 256 when unset; funded by [memory] budget).
# max_connections = 256
max_connections_per_ip = 16
max_pending_handshakes = 32
message_rate_per_second = 2048
nat_traversal = false
stream_open_rate_per_second = 32
# Optional IP-to-name labels for peers in gossip traces.
trace_peer_names = {}

[network.zakura.quic]
ack_frequency = false
congestion_controller = "cubic"
dial_stagger_ms = 250
gso = true
handshake_timeout_secs = 10
idle_timeout_secs = 150
incoming_buffer_bytes = 10485760
incoming_buffer_total_bytes = 104857600
initial_mtu = 1200
keep_alive_interval_secs = 10
kernel_drop_poll_secs = 10
max_incoming = 65536
mtu_discovery = true
recv_buffer_bytes = 7340032
retry_threshold = 8
send_buffer_bytes = 7340032
send_window_bytes = 33554432
stream_receive_window_bytes = 16777216

[rpc]
# Takes effect when enable_cookie_auth = false. The administrator is expected
# to have correctly configured firewall rules restricting access to trusted clients.
# Requests from web browsers (with an Origin header) are rejected.
allow_unauthenticated_admin = false
cookie_dir = "@RPC_COOKIE_DIR@"
cookie_file_name = ".cookie"
debug_force_finished_sync = false
enable_cookie_auth = true
# Follows enable_cookie_auth; restrict unauthenticated access to trusted clients.
# Validate the exact final block first; peers can ban relays of invalid blocks.
enable_trusted_block_submission = false
max_response_body_size = 52428800
parallel_cpu_threads = 0

[state]
cache_dir = "@STATE_CACHE_DIR@"
debug_skip_non_finalized_state_backup_task = false
delete_old_database = true
ephemeral = false
read_concurrency_limit = 64
should_backup_non_finalized_state = true
storage_mode = "archive"

[sync]
checkpoint_verify_concurrency_limit = 1000
download_concurrency_limit = 100
full_verify_concurrency_limit = 20
parallel_cpu_threads = 0
zakura_block_apply_concurrency_limit = 32

[tracing]
buffer_limit = 128000
force_use_color = false
use_color = true

[zcashd_compat]
block_gossip_peer_ips = []
enabled = false
manage_zcashd = false
restart_backoff = "2s"
restart_backoff_max = "5m"
restart_reset_after = "1h"
shutdown_grace_period = "5m"
startup_delay = "1s"
zcashd_extra_args = []
zcashd_source = "path"
