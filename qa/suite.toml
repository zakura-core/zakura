# The full property suite (campaign.md, C1): what the suite runs beyond the
# harness registry. `cargo xtask sim-suite` joins this file with the
# registered harnesses and their properties, the coverage manifest, the
# QA store's planted cases and seeds when $ZAKURA_QA_STORE names one, the
# test and fuzz targets `cargo metadata` reports and their sources, and fails if any of
# them is missing here. A new harness, fuzz target or ignored test fails
# the check until this file runs it, excludes it with a reason, or lists it
# as missing.
#
# Timeouts are generous upper bounds for a cold build on an 8-vCPU host.
# The campaign's calibration run replaces them with measured values.

schema = 1
planted-timeout-secs = 3600
seed-timeout-secs = 1800

# Packages whose tests the simulator build runs, as CI's `zakura_sim build`
# job does: the library's unit tests and every test binary.
# zakura-rt's library has no unit tests, so only its test binaries run.
[[sim-package]]
name = "zakura-rt"
lib = false
timeout-secs = 1800

[[sim-package]]
name = "zakura-scheduler"
timeout-secs = 1800

[[sim-package]]
name = "zakura-sim"
timeout-secs = 1800

[[sim-package]]
name = "zakura-storage"
timeout-secs = 1800

[[sim-package]]
name = "zakura-quic"
timeout-secs = 1800

# zakura-network's unit tests name tokio's types, so only its simulator
# test binaries build under the flag.
[[sim-package]]
name = "zakura-network"
lib = false
tests = ["sim_header_sync", "sim_block_sync"]
timeout-secs = 2700

# Packages whose ordinary-build property suites run: each source file with a
# `proptest!` block, or a call of a macro that expands to a property suite,
# is one row, which runs that file's module. `stream_conformance_suite`
# checks every session layout's properties over real QUIC; the other two
# check each wire family's codec.
[[property-package]]
name = "zakura-network"
suite-macros = ["item_suite", "message_suite", "stream_conformance_suite"]
# Block sync's conformance suite builds only with the testkit.
features = ["zakura-testkit"]
timeout-secs = 1800

# Every ignored test in the sources above, and in the child modules a
# property suite's filter selects. CI keeps them out of its blocking path
# because each takes a minute or more. The suite runs them with
# `--ignored`, and a simulator test with the `planted` profile.
[[ignored]]
file = "crates/zakura-sim/tests/block_semantic_properties.rs"
test = "the_decoded_input_stall_input_holds_input_decoded_bound"
run = true
timeout-secs = 3600

[[ignored]]
file = "crates/zakura-sim/tests/block_semantic_properties.rs"
test = "the_frontier_first_input_holds_capacity_release_wakes"
run = true
timeout-secs = 3600

[[ignored]]
file = "crates/zakura-sim/tests/block_resource_properties.rs"
test = "the_stuck_floor_fills_the_commit_window_within_retained_byte_bound"
run = true
timeout-secs = 3600

[[ignored]]
file = "crates/zakura-sim/tests/block_resource_properties.rs"
test = "every_floor_churn_plan_asks_for_the_floor_before_the_reset"
run = true
timeout-secs = 1800

[[ignored]]
file = "crates/zakura-sim/tests/block_resource_properties.rs"
test = "the_above_window_input_holds_lookahead_overshoot_bound"
run = true
timeout-secs = 3600

[[ignored]]
file = "crates/zakura-sim/tests/block_resource_properties.rs"
test = "every_worker_count_holds_the_lookahead_bound_above_the_window"
run = true
timeout-secs = 3600

[[ignored]]
file = "crates/zakura-sim/tests/block_resource_properties.rs"
test = "lookahead_estimate_to_wire_growth"
run = true
timeout-secs = 3600

# Header serving under every default session slot, which full-coverage CI
# runs with `--run-ignored`. Its 40-session sibling runs in the property
# suite's row.
[[ignored]]
file = "crates/zakura-network/src/zakura/header_sync/v9/publisher/tests/load.rs"
test = "maximum_sessions_keep_header_serving_bounded"
run = true
timeout-secs = 1800

[[ignored]]
file = "crates/zakura-sim/tests/header_wire_witness.rs"
test = "regenerate_planted_scenarios"
run = false
reason = "a tool, not a test: it rewrites the QA store's planted scenarios from their builders"

[[ignored]]
file = "crates/zakura-sim/tests/discovery_wire_planted.rs"
test = "regenerate_planted_reader_scenarios"
run = false
reason = "a tool, not a test: it rewrites the QA store's planted scenarios"

[[ignored]]
file = "crates/zakura-sim/tests/discovery_wire_planted_guards.rs"
test = "regenerate_planted_guard_scenarios"
run = false
reason = "a tool, not a test: it rewrites the QA store's planted scenarios"

# Commands the package rows don't cover: the doc tests, and the release and
# AddressSanitizer runs of the scheduler and runtime that CI's
# `zakura_sim release` and `zakura_sim asan` jobs make. The ASan lane needs
# `llvm-symbolizer` on the host.
[[lane]]
id = "sim-doc/zakura-sim"
build = "sim-doc"
args = "test --locked -p zakura-sim --doc"
timeout-secs = 1800

[[lane]]
id = "sim-release/zakura-rt-zakura-scheduler"
build = "sim-release"
args = "test --locked -p zakura-rt -p zakura-scheduler --release"
timeout-secs = 2700

[[lane]]
id = "sim-asan/zakura-rt-zakura-scheduler"
build = "sim-asan"
args = "test --locked -p zakura-rt -p zakura-scheduler --features zakura-scheduler/sanitizer --target x86_64-unknown-linux-gnu --tests"
timeout-secs = 2700

# zakura-sim's own release and AddressSanitizer runs (sim-7.2): the
# library's unit tests and the scheduler, race and replay test targets.
# `cli` spawns the `zakura-sim` binary, which Cargo builds with the same
# flags.
[[lane]]
id = "sim-release/zakura-sim"
build = "sim-release"
args = "test --locked -p zakura-sim --release --lib --test draws --test race_fixtures --test discovery --test witness --test cli --test replay_exact --test idle --test time --test race_schedules"
timeout-secs = 2700

[[lane]]
id = "sim-asan/zakura-sim"
build = "sim-asan"
args = "test --locked -p zakura-sim --features zakura-scheduler/sanitizer --target x86_64-unknown-linux-gnu --lib --test draws --test race_fixtures --test discovery --test witness --test cli --test race_schedules"
timeout-secs = 2700

# Fuzz targets. A `sim` target runs the one harness that
# qa/fuzz/sim/Cargo.toml's `[package.metadata.zakura-sim.targets]` table
# maps it to, and starts from that harness's admitted seeds. Its smoke run
# is short; the campaign sets each target's search budget after
# calibration. `cargo xtask sim-targets` runs each `sim` target on those
# seeds alone, with the row's arguments and variables, and needs at least
# one seed that applies a property of the harness's own.
[[target]]
package = "sim"
name = "discovery_wait_complete"
smoke-secs = 60
timeout-secs = 1800

# The action grammar is built for 4,096-byte inputs, as qa/fuzz/sim's README
# says. Each run takes tens to hundreds of milliseconds, so libFuzzer's
# default length control would keep mutations under the 344-byte scenario
# prefix for hours. `-len_control=0` lets them reach the whole input at once.
[[target]]
package = "sim"
name = "header_sync_storage"
smoke-secs = 60
args = ["-max_len=4096", "-len_control=0"]
timeout-secs = 1800

# `sync/storage`'s two-byte prefix picks a saved scenario or the default
# one, so the target fuzzes the schedule of each.
[[target]]
package = "sim"
name = "sync_storage"
smoke-secs = 60
args = ["-len_control=0"]
timeout-secs = 1800

# `sync/wire`'s two-byte prefix picks a saved scenario, fuzz-13's combined
# actions (a chain change at a pipeline stage, a connection replacement and
# a read stall), or the honest scenario. The target fuzzes the schedule of
# each.
[[target]]
package = "sim"
name = "sync_wire"
smoke-secs = 60
args = ["-len_control=0"]
timeout-secs = 1800

# `sync/composed` runs `sync/wire`'s node and mirrors with the topology,
# chain, closes, growths, reorgs, block holds and teardown its 27-byte
# prefix composes, so the target fuzzes how many of each a run takes and in
# what order.
[[target]]
package = "sim"
name = "sync_composed"
smoke-secs = 60
args = ["-max_len=4096", "-len_control=0"]
timeout-secs = 1800

# `block-sync/storage`'s two-byte prefix picks a saved scenario or the
# default one. A generated run takes about 96 s and needs about 7 GB, so the
# row raises the RSS limit to 8 GiB, and its smoke and scheduled campaign run
# the admitted seeds alone. libFuzzer runs the whole corpus before it checks
# `-max_total_time`, and one second has passed by then, so it generates no
# input, and the cached corpus never grows past the seeds. Long campaigns on a
# remote host search the harness, as qa/fuzz/sim's README says under Long runs.
[[target]]
package = "sim"
name = "block_sync_storage"
smoke-secs = 1
campaign-seconds = 1
campaign-weekly-seconds = 1
args = ["-rss_limit_mb=8192", "-len_control=0"]
timeout-secs = 3600

# `discovery/wire` runs the discovery node behind its real transport on
# simulated QUIC. Its two-byte prefix picks a saved Plan's scenario or the
# default one, so the target fuzzes the schedule of each.
[[target]]
package = "sim"
name = "discovery_wire"
smoke-secs = 60
args = ["-len_control=0"]
timeout-secs = 1800

# `discovery/composed` runs `discovery/wire`'s node with one peer whose
# script, holds, links and node limits its 17-byte prefix composes, so the
# target fuzzes the order, count and mix of the peer's exchanges.
[[target]]
package = "sim"
name = "discovery_composed"
smoke-secs = 60
args = ["-max_len=4096", "-len_control=0"]
timeout-secs = 1800

# `discovery/spam` runs `discovery/wire`'s node with one to three
# spammers, which act without a rate limit and dial again after every
# close, beside an honest peer whose requests must never close it.
[[target]]
package = "sim"
name = "discovery_spam"
smoke-secs = 60
args = ["-max_len=4096", "-len_control=0"]
timeout-secs = 1800

# `header-sync/wire` runs the header-sync node behind its real transport on
# simulated QUIC. Its two-byte prefix picks a saved Plan's scenario or the
# default one, so the target fuzzes the schedule of each.
[[target]]
package = "sim"
name = "header_sync_wire"
smoke-secs = 60
args = ["-len_control=0"]
timeout-secs = 1800

# `handshake/wire` runs the node's control handshake behind its real
# transport on simulated QUIC. Its 32-byte prefix picks one of fifteen
# scenario families, and the rest of the input picks the schedule.
[[target]]
package = "sim"
name = "handshake_wire"
smoke-secs = 60
args = ["-max_len=4096", "-len_control=0"]
timeout-secs = 1800

# `handshake/counts` drives the production admission machine. Each
# three-byte operation picks an action, an owner slot and an address.
[[target]]
package = "sim"
name = "handshake_counts"
smoke-secs = 60
args = ["-max_len=512"]
timeout-secs = 1800

# `fixtures/all` picks any race fixture in any variant, so the target's runs
# cover each fixture's own harness and the fixed variants. Its report must
# account for each fixture and variant.
[[target]]
package = "sim"
name = "race_fixtures"
covers = [
    "race/lost-update",
    "race/snapshot-reserve",
    "race/missed-notify",
    "race/timer-cancel",
    "race/ab-ba",
    "race/abort-without-join",
    "fixtures/fixed",
]
smoke-secs = 60
timeout-secs = 1800

# Each package's scheduled campaign. `scripts/check-fuzz-campaign.py --matrix` joins
# these defaults with each target's `campaign-*` overrides and its `args`, so a
# target's limits have one home. A target without `-max_len` lets libFuzzer choose.
[campaign.header-chain]
seconds = 900
weekly-seconds = 3600
rss-mb = 2048

[campaign.p2p]
seconds = 900
weekly-seconds = 3600
rss-mb = 2048

# The simulator's scheduled run is a smoke: it shows each target still builds
# and runs, and isn't meant to find bugs. Sunday's run is the same smoke. Long
# campaigns run on a remote host, as qa/fuzz/sim's README says under Long runs.
[campaign.sim]
seconds = 120
weekly-seconds = 120
rss-mb = 4096

# The header-chain targets. Their `args` also set their campaign's limits.
[[target]]
package = "header-chain"
name = "fork_transitions"
smoke-secs = 60
campaign-seconds = 1800
campaign-weekly-seconds = 7200
args = ["-rss_limit_mb=4096", "-max_len=512", "-detect_leaks=1"]
timeout-secs = 2700

[[target]]
package = "header-chain"
name = "header_codec_v9"
smoke-secs = 60
args = ["-rss_limit_mb=2048", "-max_len=2097152", "-detect_leaks=1"]
timeout-secs = 2700

[[target]]
package = "header-chain"
name = "header_pursuit"
smoke-secs = 60
args = ["-rss_limit_mb=2048", "-max_len=512", "-detect_leaks=1"]
timeout-secs = 2700

# RocksDB keeps process-global allocations after each temporary database
# closes, so the exit-time leak check is off too, as the package's README
# says.
[[target]]
package = "header-chain"
name = "recovery_rows"
smoke-secs = 60
args = ["-rss_limit_mb=4096", "-max_len=256", "-detect_leaks=0"]
env = ["ASAN_OPTIONS=detect_leaks=0"]
timeout-secs = 2700

# The P2P machine targets, with qa/fuzz/p2p's input limit. Each replay reads
# at most 512 bytes.
[[target]]
package = "p2p"
name = "service_session"
smoke-secs = 60
args = ["-rss_limit_mb=2048", "-max_len=512"]
timeout-secs = 1800

[[target]]
package = "p2p"
name = "cadence"
smoke-secs = 60
args = ["-rss_limit_mb=2048", "-max_len=512"]
timeout-secs = 1800

[[excluded-target]]
package = "rpc"
name = "json_rpc_request"
reason = "JSON-RPC parsing isn't a P2P DoS property; rpc-fuzz.yml keeps fuzzing it nightly"

[[excluded-target]]
package = "sim"
name = "feedback_probe"
reason = "runs no registered harness; `cargo xtask sim-feedback` builds it to check that libFuzzer keeps an input for a semantic feature alone"

# Harnesses no target runs by design (phase F of the property wrap-up).
# Each is a fixed fixture whose input picks among a handful of scenarios,
# so a target would fuzz only its schedule. Its tests still run in the
# suite. The reach report (`scripts/suite_fuzz_run.py reach`) lists any
# property that only these fixtures apply as a reach finding.
[[excluded-harness]]
harness = "header-sync/smoke"
reason = "no peers and no storage scenario: it checks only the sim/* properties, which every harness checks"

[[excluded-harness]]
harness = "header-sync/flood"
reason = "two fixed flood fixtures: header-sync/storage's grammar can't express 17 mirrors, Flood, Churn, Commit or an All trigger, so watch-observed-under-flood and watch-observed-under-lifecycle-flood stay witness-only; its storage properties are header-sync/storage's, which that grammar searches"

[[excluded-harness]]
harness = "header-sync/release-wake"
reason = "two fixed wake fixtures: the grammar can't express their long chains, the HeadroomWait trigger or the Settle source, and capacity-release-wakes needs the WakeFixture evidence its prepare arms; its storage properties are header-sync/storage's"

[[excluded-harness]]
harness = "header-sync/repair"
reason = "four fixed repair fixtures: the grammar can't express RepairStatus, SessionEnded or Retired, or the checkpoint ceiling its prepare sets; it registers only header-sync/storage's properties, which that grammar searches"

[[excluded-harness]]
harness = "header-sync/liveness"
reason = "42 fixed liveness fixtures: the grammar can't express an All trigger, hold deadlines, or the evidence and sources its prepare and build add, so hold-release-wakes stays witness-only; bounded-adversary-progress and the storage properties are header-sync/storage's"

