[[audits.zerocopy]]
who = "Claude Opus 5 <noreply@anthropic.com>"
criteria = "safe-to-deploy"
version = "0.8.54"
notes = "Reviewed the manifest, build script, and the unsafe surface. Like bytemuck, the whole design rests on unsafe marker traits, here TryFromBytes, FromZeros, FromBytes, IntoBytes, KnownLayout, and Unaligned, whose obligations are documented per trait and whose safe implementations come from the derive rather than by hand. The conversion functions check size and alignment before any reinterpretation and return an error type that names which of the two failed, and the try_ family additionally validates the bit pattern. The build script only probes the compiler version to emit cfgs. All 109 library tests passed in a debug build; five error-formatting tests fail in release because they assert the richer diagnostic text that only debug builds produce."

[[audits.zerocopy-derive]]
who = "Claude Opus 5 <noreply@anthropic.com>"
criteria = "safe-to-deploy"
version = "0.8.54"
notes = "Reviewed all packaged source and manifest. This is the derive half of zerocopy and it is where the safety of the whole scheme is decided, since it emits the unsafe impls that the traits' obligations rest on. The generated code checks what it must at compile time: repr is validated against what each trait requires, padding is detected through a size comparison against the sum of the field sizes rather than assumed absent, and enums get a discriminant validity check rather than a blanket impl. It runs at compile time only, with no build script and no I/O. All 22 library tests passed; the UI test suite cannot run from the published package because it imports a renamed zerocopy dev-dependency that is not resolvable standalone."

[[audits.zerofrom]]
who = "OpenAI Codex <noreply@openai.com>"
criteria = "safe-to-deploy"
version = "0.1.8"
notes = "Reviewed all packaged source and manifest content. This no_std crate implements safe zero-copy borrowing traits and type, array, and tuple conversions whose lifetimes are enforced by the compiler. There is no unsafe code, build script, runtime I/O, or ambient authority. All-feature targets and the documentation test passed."

[[audits.zerofrom-derive]]
who = "OpenAI Codex <noreply@openai.com>"
criteria = "safe-to-deploy"
version = "0.1.7"
notes = "Reviewed all packaged source and manifest content. The proc macro only parses and folds tokens and emits safe, type-checked ZeroFrom implementations; it contains no unsafe code, build script, runtime I/O, or ambient authority. Both library unit tests passed. The published example omits workspace-only development dependencies, but that packaging defect does not affect the deployed proc macro."

[[audits.zeroize]]
who = "OpenAI Codex <noreply@openai.com>"
criteria = "safe-to-deploy"
version = "1.9.0"
notes = "Reviewed all packaged source, manifest, and tests. Volatile writes plus optimization barriers cover scalar, slice, allocation, option, and MaybeUninit implementations; architecture SIMD values use valid zero bit patterns, and the unsafe flat-type helper states its caller contract. No build script, I/O, or ambient authority. All 45 active all-feature tests and doctests passed; one test is intentionally ignored."

[[audits.zeroize_derive]]
who = "OpenAI Codex <noreply@openai.com>"
criteria = "safe-to-deploy"
version = "1.5.0"
notes = "Reviewed all packaged source, manifest, and tests. The safe procedural macros generate field-wise Zeroize and Drop matches, honor explicit skip and bound attributes, reject unsupported unions and misplaced attributes, and introduce no behavior beyond calls to separately policy-checked zeroize traits. No build script, I/O, or ambient capability. All 27 unit tests passed."

[[audits.zerotrie]]
who = "Claude Opus 5 <noreply@anthropic.com>"
criteria = "safe-to-deploy"
version = "0.2.4"
notes = "Reviewed all packaged source, manifest, and tests. The crate stores string-to-int maps in a compact byte trie; its unsafe is unchecked UTF-8 over key spans the trie walk has already bounded. Reading is a bounded walk over the backing slice that returns None on a malformed or truncated trie rather than indexing past the end. There is no build script and no ambient capability. All 8 tests passed."

[[audits.zip32]]
