[package]
name = "zakura-bbtree-experiment"
version = "0.0.0"
edition = "2021"
rust-version = "1.97"
publish = false

# Deliberately isolated: no dependency or feature change for production builds.
[workspace]

[dependencies]
bbtree = { git = "https://github.com/XiangpengHao/bbtree", rev = "8adae97a0ed97e5c98fa2790312eb0aec9719846" }

[features]
default = ["internal-bench"]
internal-bench = []

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[[bin]]
name = "zakura-bbtree-experiment"
path = "src/main.rs"
test = false
bench = false
