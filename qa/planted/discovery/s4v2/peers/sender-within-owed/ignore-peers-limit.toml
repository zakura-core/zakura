# Discovery samples the most records a `Peers` may carry, whatever limit
# the `GetPeers` asks for. The search's `get-one-peer` family has one peer
# ask for one record while the node dials two peers at public addresses
# and confirms their records, so the patched answer carries both (#2267).
# Besides the files the patch changes, the rest of discovery decides
# whether the frame reaches the bypass.
checks = ["crates/zakura-network/src/zakura/discovery"]

[search]
harness = "discovery/wire"
seed = 1
runs = 60
draws = "cycle"
