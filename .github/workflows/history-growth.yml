# Rejects changes that grow the git history by more than 2 MiB of packed
# objects. Added after a 68 MB embedded artifact had to be removed from
# history with a force push: large artifacts belong in release assets or
# external storage with a pinned hash, never in git history.
#
# Release-state refreshes are the one committed exception: they replace an
# append-only frontier grid of a few megabytes. They get a larger allowance,
# and only when the change touches nothing outside the release-state files, so
# the allowance cannot be borrowed to land an unrelated artifact alongside one.
name: History growth

on:
  pull_request:
    branches: [main, "feat/**", "release/**"]

  # Run when a PR is queued so the merge queue validates the merged result
  # against the latest `main`.
  merge_group:

# Ensures that only one workflow task will run at a time. Previous builds, if
# already in process, will get cancelled. Only the latest commit will be allowed
# to run, cancelling any workflows in between
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Limit history growth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select revision range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MG_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          if [ "${EVENT_NAME}" = "merge_group" ]; then
            echo "base=${MG_BASE_SHA}" >> "${GITHUB_OUTPUT}"
            echo "head=${MG_HEAD_SHA}" >> "${GITHUB_OUTPUT}"
          else
            echo "base=${PR_BASE_SHA}" >> "${GITHUB_OUTPUT}"
            echo "head=${PR_HEAD_SHA}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Select the growth limit
        id: limit
        env:
          BASE_SHA: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
        run: |
          set -euo pipefail
          sort > "${RUNNER_TEMP}/release-state-files" <<'EOF'
          Cargo.lock
          Cargo.toml
          crates/zakura-chain/src/parameters/checkpoint/main-checkpoints.txt
          crates/zakura-state/src/service/finalized_state/vct/mainnet-frontier.bin
          crates/zakura-state/src/service/finalized_state/vct/mainnet-subtrees.bin
          crates/zakura-state/src/service/finalized_state/vct/mainnet-vct-manifest.json
          crates/zakurad/src/components/sync/end_of_support.rs
          EOF
          git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" | sort -u \
            > "${RUNNER_TEMP}/changed-files"
          OUTSIDE=$(comm -23 "${RUNNER_TEMP}/changed-files" "${RUNNER_TEMP}/release-state-files")
          if [ -s "${RUNNER_TEMP}/changed-files" ] && [ -z "${OUTSIDE}" ]; then
            # The frontier grid used to dominate this budget. It now ships as a pinned crates.io
            # dependency, so a refresh is an appended checkpoint list plus small artifacts, and
            # the headroom shrinks accordingly: a grid committed by mistake must fail here.
            echo "Release-state-only change; allowing 3 MiB of history growth."
            echo "bytes=3145728" >> "${GITHUB_OUTPUT}"
          else
            echo "bytes=2097152" >> "${GITHUB_OUTPUT}"
          fi

      - name: Check history growth
        env:
          BASE_SHA: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
          HISTORY_GROWTH_LIMIT_BYTES: ${{ steps.limit.outputs.bytes }}
        run: ./scripts/check-history-growth.sh "${BASE_SHA}" "${HEAD_SHA}"
