[package]
name = "zakura-network"
version = "7.0.0-rc4"
authors.workspace = true
description = "Networking code for the Zakura node. Internal crate, published to support cargo install zakura"
# # Legal
#
# This licence is deliberately different to the rest of Zakura.
#
# Some code in:
# zakura-network/src/peer_set/set.rs
# zakura-network/src/peer_set/unready_service.rs
# zakura-network/src/peer_set/initialize.rs
# was modified from a 2019 version of:
# https://github.com/tower-rs/tower/tree/master/tower/src/balance/p2c/service.rs
license = "MIT"
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

readme = "../../README.md"
homepage.workspace = true
# crates.io is limited to 5 keywords and categories
keywords.workspace = true
# Must be one of <https://crates.io/category_slugs>
categories = ["asynchronous", "cryptography::cryptocurrencies", "encoding", "network-programming"]

[features]
default = []

# Production features that activate extra dependencies, or extra features in dependencies

progress-bar = [
    "howudoin",
]

# Testing features that activate extra dependencies
header-fuzz = []
proptest-impl = ["proptest", "proptest-derive", "zakura-chain/proptest-impl"]
zakura-testkit = []

# Exposes an offline benchmark helper for the block-sync Sequencer
# (`zakura::spawn_bench_sequencer`), used by replay-bench tooling. Not for production.
internal-bench = []

[dependencies]
bitflags = { workspace = true }
blake2b_simd = { workspace = true }
byteorder = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true, features = ["clock", "std"] }
dirs = { workspace = true }
hex = { workspace = true }
humantime-serde = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
iroh = { workspace = true }
itertools = { workspace = true }
lazy_static = { workspace = true }
pin-project = { workspace = true }
rand = { workspace = true }
rayon = { workspace = true }
regex = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["serde_derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

futures = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "net", "time", "tracing", "macros", "rt-multi-thread"] }
tokio-stream = { workspace = true, features = ["sync", "time"] }
tokio-util = { workspace = true, features = ["codec"] }
tower = { workspace = true, features = ["retry", "discover", "load", "load-shed", "timeout", "util", "buffer"] }

metrics = { workspace = true }
tracing-error = { workspace = true, features = ["traced-error"] }
tracing = { workspace = true }

# prod feature progress-bar
howudoin = { workspace = true, optional = true }

# proptest dependencies
proptest = { workspace = true, optional = true }
proptest-derive = { workspace = true, optional = true }

zakura-chain = { path = "../zakura-chain", version = "6.0.0-rc0", features = ["async-error"] }
zakura-header-chain = { path = "../zakura-header-chain", version = "1.0.0-rc0" }
zakura-jsonl-trace = { path = "../zakura-jsonl-trace", version = "1.2.0-rc0" }
zakura-node-services = { path = "../zakura-node-services", version = "3.2.1-rc0" }

[dev-dependencies]
proptest = { workspace = true }
proptest-derive = { workspace = true }
criterion = { workspace = true }

tempfile = { workspace = true }
tokio = { workspace = true, features = ["full", "tracing", "test-util"] }
toml = { workspace = true }
tracing-subscriber = { workspace = true }

zakura-chain = { path = "../zakura-chain", version = "6.0.0-rc0", features = ["proptest-impl"] }
zakura-test = { path = "../zakura-test/", version = "2.1.0" }

[lints]
workspace = true

[[bench]]
name = "zakura_single_conn"
harness = false

[[bench]]
name = "zakura_loadgen"
harness = false

[[bench]]
name = "address_book"
harness = false
required-features = ["internal-bench"]
